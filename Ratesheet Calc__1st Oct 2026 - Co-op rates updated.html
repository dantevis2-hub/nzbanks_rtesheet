<meta name="theme-color" content="#F04A12">

<style>
  :root{
    --binder:#2453B8;
    --binder-2:#1B3F91;
    --binder-3:#12296A;
    --page:#FFFFFF;
    --page-2:#F6F8FB;
    --bg:#EEF1F6;
    --bg-2:#E4E9F1;
    --ink:#151A2B;
    --muted:#697086;
    --rule:#E5E8EF;
    --shadow:0 1px 2px rgba(20,30,60,.04),0 10px 28px rgba(20,30,60,.09);
    --shadow-sm:0 1px 2px rgba(20,30,60,.06);
    --radius:16px;
    --serif:"Playfair Display","Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);color:var(--ink);background:var(--bg);
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- TAB RAIL ---------- */
  .railwrap{
    flex:none;height:60px;
    display:flex;align-items:center;gap:10px;
    padding:0 20px;
    background:var(--page);
    border-bottom:1px solid var(--rule);
    position:relative;z-index:4;
  }
  .rail{
    flex:1;min-width:0;
    height:100%;
    display:flex;align-items:center;gap:4px;
    overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  }
  .rail::-webkit-scrollbar{display:none}
  .tools{flex:none;display:flex;align-items:center;gap:8px}

  .tab{
    position:relative;flex:none;
    display:flex;align-items:center;gap:7px;
    height:34px;padding:0 15px;
    border:1px solid transparent;border-radius:999px;
    background:transparent;color:var(--muted);
    font:inherit;font-size:13px;font-weight:600;letter-spacing:.1px;
    white-space:nowrap;cursor:pointer;
    transition:background .14s ease,color .14s ease,border-color .14s ease;
  }
  .tab:hover{background:var(--bg-2);color:var(--ink)}
  .tab[aria-selected="true"]{
    background:var(--brand,#8A93A3);color:var(--brand-ink,#fff);
    border-color:transparent;z-index:3;
    box-shadow:var(--shadow-sm);
  }
  .tab:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
  .tab .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--brand,#8A93A3)}
  .tab[aria-selected="true"] .dot{background:var(--brand-ink,#fff);opacity:.9}
  .tab .ribbon{display:none}

  /* ---------- CANVAS ---------- */
  .binder{
    flex:1;min-height:0;position:relative;display:flex;
    background:var(--bg);
    border-top:3px solid var(--accent,var(--binder));
    transition:border-color .2s ease;
  }

  /* Decorative fore-edge/card-catalogue elements from the old skeuomorphic
     shell are kept in the DOM (tab-switch script still toggles classes on
     them) but carry no width or artwork in the modern layout. */
  .leaves{flex:none;width:0;position:relative;z-index:1}
  .leaves i{display:none}

  .filing{flex:none;width:0;position:relative;z-index:1}
  .cards,.rod,.plate{display:none}

  .page{
    flex:1;min-width:0;position:relative;z-index:2;
    margin:20px;
    background:var(--page);border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }

  /* ---------- FRAMES ----------
     The container is a full-bleed overlay above the cover, so it must stay

  #frames{position:absolute;inset:0;z-index:1;pointer-events:none}

  .booting{position:absolute;inset:0;display:none;place-items:center;align-content:center;gap:12px;background:var(--page);z-index:6}

<style>
  :root{

  .ratebanner .wm{font-weight:900;font-size:30px;letter-spacing:2px;color:#fff}
  .ratebanner .wm span{display:inline-block;transform:skewX(-8deg)}
  .herostrip{height:10px;background:repeating-linear-gradient(45deg,var(--blue) 0 14px,var(--blue-deep) 14px 28px)}

  table.master{width:100%;border-collapse:collapse}
  table.master th,table.master td{border:1px solid #cdddef;padding:7px 9px;text-align:center;font-variant-numeric:tabular-nums}
  table.master thead th{background:var(--blue-cell);font-weight:800;font-size:12px}
  table.master td.group{background:#fff;font-weight:800;text-align:left;vertical-align:middle;white-space:nowrap}
  table.master tbody tr:nth-child(even) td:not(.group){background:var(--row-alt)}
  table.master td.term{text-align:left;font-weight:600}
  table.master input{width:88px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;text-align:center;font:inherit}
  table.master input.term{width:130px;text-align:left}
  table.master th.bandsplit,table.master td.bandsplit{border-left:2.5px solid var(--ink)}
  table.sheet th.bandsplit,table.sheet td.bandsplit{border-left:1.5px solid var(--ink)}
  .bandchip{display:inline-block;background:var(--blue-pale);border:1.5px solid var(--blue-deep);color:#0a3a66;font-weight:800;font-size:12px;letter-spacing:.4px;padding:3px 10px;border-radius:999px}
  .mwrap{overflow-x:auto}
  .masterbtns{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;background:var(--blue-pale);border-top:1.5px solid var(--ink)}
  .delrow{background:#fff;border:1px solid var(--ink);border-radius:4px;padding:2px 8px;cursor:pointer;font-weight:800}

  /* CASH MATRIX EDITOR */
  details.matrix{margin-top:18px}
  details.matrix>summary{cursor:pointer;list-style:none;background:var(--ink);color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:1px;font-size:12px;padding:11px 16px;border-radius:10px;user-select:none;display:flex;align-items:center;gap:8px}
  details.matrix>summary:before{content:"▸";font-size:11px}
  details.matrix[open]>summary{border-radius:10px 10px 0 0}
  details.matrix[open]>summary:before{content:"▾"}
  details.matrix .inner{border:1.5px solid var(--ink);border-top:0;border-radius:0 0 10px 10px;background:#fff;padding:16px}
  .mxnote{font-size:12px;color:var(--muted);margin-bottom:12px}
  .matrix h4{font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px;color:var(--ink)}
  .mxbar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:var(--blue-pale);border:1.5px dashed var(--blue-deep);border-radius:8px;padding:10px 14px;font-size:12px;font-weight:600}
  .mxchk{display:flex;align-items:center;gap:6px}
  .mxnum{width:80px;padding:4px 6px;border:1px solid var(--ink);border-radius:4px;font:inherit;text-align:right}
  .mxnum.wide{width:100px}
  .mxtxt{width:130px;padding:4px 6px;border:1px solid var(--ink);border-radius:4px;font:inherit}
  table.mxtable{width:100%;border-collapse:collapse;min-width:640px}
  table.mxtable th,table.mxtable td{border:1px solid #cdddef;padding:8px 10px;text-align:center;vertical-align:top}
  table.mxtable thead th{background:var(--blue-cell);font-weight:800;font-size:12px}
  table.mxtable td.rowlab{background:#fff;text-align:left;font-weight:700;font-size:12px;white-space:normal;max-width:190px}
  .mxcell{display:flex;flex-direction:column;gap:5px;align-items:stretch}
  .mxcell .fldrow{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:11px;color:var(--muted);font-weight:700}
  .mxcell .fldrow span{width:34px;text-align:left}
  .mxcell input{width:70px;padding:3px 5px;border:1px solid var(--line);border-radius:4px;font:inherit;text-align:right}

  /* DEAL — polished template-styled layout with graphics */
  .dealwrap{max-width:none}
  .dealcard{background:transparent;border:0;border-radius:0;padding:0;box-shadow:none}
  .dealhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
  .dealhead h2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .dealhead .hint{color:var(--blue-deep);font-weight:700;font-style:italic;font-size:11px}
  .drow{display:grid;grid-template-columns:210px 1fr;margin-bottom:10px}
  .dlabel{display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:800;font-size:15px;border:2px solid var(--ink);border-right:0;border-radius:11px 0 0 11px}
  .dlabel svg{width:18px;height:18px;flex:0 0 auto}
  .dlabel.y{background:var(--blue);color:#fff}
  .dlabel.b{background:#062a52;color:#fff}
  .dlabel.n{background:#eef4fb}
  .dval{display:flex;align-items:center;justify-content:flex-end;gap:8px;border:2px solid var(--ink);border-radius:0 11px 11px 0;background:#fff;padding:0 14px;min-height:50px}
  .dval .pfx{font-weight:800;font-size:16px;margin-right:auto;color:var(--muted)}
  .dval .mnum,.dval .plain{border:0;outline:0;text-align:right;font:inherit;font-size:18px;font-weight:800;width:100%;background:transparent;padding:0}
  .dval .plain{max-width:70px}
  .dval .unit{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase}
  .dval select{border:0;outline:0;font:inherit;font-size:15px;font-weight:800;width:100%;background:transparent;cursor:pointer;padding:0;text-align:right;text-align-last:right}
  .dval select.ynsel{color:#1f6b3a}
  .drow .dval:focus-within{box-shadow:inset 0 0 0 2px var(--blue-deep)}

  /* results: gauge + tiles */
  .results{margin-top:22px;background:linear-gradient(180deg,#f7fbff,#fff);border:1.5px solid var(--ink);border-radius:14px;padding:18px}
  .lvr-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .lvr-top span{font-weight:800;text-transform:uppercase;letter-spacing:.7px;font-size:12px;color:var(--muted)}
  .lvr-top b{font-size:28px;font-weight:900;letter-spacing:-1px}
  .lvr-top b.green{color:var(--good)} .lvr-top b.amber{color:#C08A1E} .lvr-top b.red{color:var(--warn)}
  .gauge{position:relative;height:24px;border-radius:12px;overflow:hidden;border:1.5px solid var(--ink)}
  .gauge .zones{position:absolute;inset:0;display:flex}
  .zone.green{width:80%;background:#CDE8CC}
  .zone.amber{width:5%;background:#FBE3A6}
  .zone.red{width:15%;background:#F4C4BC}
  .gauge-pointer{position:absolute;top:-2px;bottom:-2px;width:4px;background:var(--ink);transform:translateX(-50%);transition:left .25s ease;z-index:2}
  .gauge-pointer:after{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:13px;height:13px;background:var(--ink);border:2px solid #fff;border-radius:50%}
  .ticks{position:relative;height:15px;margin-top:3px;font-size:10px;font-weight:800;color:var(--muted)}
  .ticks .tick{position:absolute;transform:translateX(-50%)}
  .ticks .tick:before{content:"";position:absolute;top:-4px;left:50%;width:1.5px;height:4px;background:var(--muted);transform:translateX(-50%)}
  .out-tiles{display:grid;grid-template-columns:1fr 1.5fr;gap:12px;margin-top:18px}
  .tile{border:1.5px solid var(--ink);border-radius:12px;padding:12px 15px;background:#fff}
  .tile-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
  .tile-val{font-size:22px;font-weight:900;margin-top:3px;letter-spacing:-.5px}
  .tile.hero{background:var(--blue);border-width:2px}
  .tile.hero .tile-label{color:#cfe4ff}
  .tile.hero .tile-val{font-size:32px;color:#fff}
  .cash-why{margin-top:12px;font-size:12px;font-weight:600;color:#0a3a66;background:var(--blue-pale);border:1.5px dashed var(--blue-deep);border-radius:8px;padding:9px 13px}
  @media(max-width:560px){.drow{grid-template-columns:150px 1fr}.out-tiles{grid-template-columns:1fr}}

  .dealactions{display:flex;justify-content:flex-end;margin-top:12px}
  .dealactions .btn{padding:7px 16px;font-size:13px}

  .dval select.ynsel.warn{color:#C0341B;font-weight:800}

  /* LMI advisory modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,16,0,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal-overlay.open{display:flex}
  .modal{background:#fff;border:2px solid var(--ink);border-radius:16px;max-width:460px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden;animation:pop .16s ease}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-head{background:var(--blue);color:#fff;border-bottom:2px solid var(--navy);padding:14px 18px;font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:10px}
  .modal-head svg{width:20px;height:20px;flex:0 0 auto}
  .modal-body{padding:18px}
  .modal-body p{font-size:13px;line-height:1.55;margin-bottom:14px}
  .modal-field{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .modal-field input{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:8px;font:inherit;font-size:16px;font-weight:700}
  .modal-preview{margin-top:12px;font-size:13px;background:var(--blue-pale);border:1.5px dashed var(--blue-deep);border-radius:8px;padding:10px 12px}
  .modal-preview:empty{display:none}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 18px;border-top:1.5px solid var(--line);background:#f3f8fe}
  .modal-foot .btn[disabled]{opacity:.45;cursor:not-allowed}

  details.matrix{margin-top:0}

  /* RATESHEET */
  .sheetctrls{display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
  .linkbtn{
    display:block;margin-top:4px;padding:0;border:0;background:none;
    font:inherit;font-size:11px;font-weight:600;color:#0073E6;
    cursor:pointer;text-align:left;text-decoration:underline;
  }
  .linkbtn:hover{color:#005BB5}
  .linkbtn[hidden]{display:none}
  #s_loan.overridden{border-color:#0073E6;background:#F0F7FF}
  .sheetctrls .fld{display:flex;flex-direction:column;gap:4px}
  .sheetctrls label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .sheetctrls input,.sheetctrls select{width:150px}
  table.sheet{width:100%;min-width:640px;border-collapse:collapse;border:1.5px solid var(--ink)}
  table.sheet th,table.sheet td{border:1px solid var(--ink);padding:4px 9px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px;line-height:1.25}
  table.sheet thead th{font-weight:800;font-size:11.5px;background:var(--blue);color:#fff}
  table.sheet td.term{text-align:left;white-space:nowrap}
  table.sheet .repcol{border-left:1.5px solid var(--ink)}
  table.sheet tr.black td{color:var(--t-black)}
  table.sheet tr.gold td{color:var(--t-gold)}
  table.sheet tr.green td{color:var(--t-green)}
  table.sheet tr.red td{color:var(--t-red)}
  .foot{margin-top:10px;font-weight:700;font-style:italic;font-size:11px}
  .foot div{margin-top:3px}
  .swrap{overflow-x:auto}
  .copystatus{align-self:center;color:var(--good);font-weight:700;font-size:12px;min-width:60px}

  footer{max-width:1400px;margin:0 auto;padding:0 20px 30px;font-size:11px;color:var(--muted)}

  @media print{
    header,footer,.printbtn,#copyBtn,.copystatus,.sheetctrls .fld:not(:last-child){display:none!important}
    .tab{display:none!important}
    .workrow{display:block!important;margin:0!important;padding:0!important;border:0!important}
    #tab-sheet{display:block!important;margin-top:0!important;padding-top:0!important;border-top:0!important;border:0!important;box-shadow:none!important}
    #tab-sheet .stitle{display:none!important}
    body{background:#fff}
    table.sheet{max-width:none;width:100%}
  }
</style>
</head>
<body>

<header>
  <div class="title">
    <h1>ANZ Ratesheet Calculator</h1>
    <div class="byline">by D.E. Visto <b>version 2.1</b></div>
  </div>
  <div class="logo"><span>ANZ</span></div>
</header>

<main>
  <\!-- ============== CAPTURE (top) ============== -->
  <section id="tab-capture" class="tab capture">
    <div class="drop" id="drop">
      <b>Drag an ANZ rate PDF or screenshot here to capture rates</b>
      <div class="sub">or click to choose a file. Text PDFs are read directly; image PDFs and screenshots (PNG/JPG) are read with OCR (needs internet, ~20–40s). Always check the captured figures.</div>
      <div class="status" id="dropStatus"></div>
      <input type="file" id="pdfFile" accept="application/pdf,.pdf,image/png,image/jpeg,image/webp" style="display:none">
    </div>

    <details id="readerLogBox" style="display:none;margin-bottom:14px">
      <summary style="cursor:pointer;font-weight:700;font-size:12px">What the reader saw (troubleshooting)</summary>
      <pre id="readerLog" style="white-space:pre-wrap;font-size:11px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;max-height:220px;overflow:auto;margin-top:8px"></pre>
    </details>

    <details style="margin-bottom:18px">
      <summary style="cursor:pointer;font-weight:700;font-size:12px">Paste rows from the sheet instead</summary>
      <div style="margin-top:8px">
        <div class="sub" style="margin-bottom:6px">One product per line with the four rates in sheet order — <code>6 months 4.69% 4.49% 5.04% 5.29%</code>. Order: Special ≤80%, Discretionary ≤80%, Discretionary 80.01–85%, Standard >85%+.</div>
        <textarea id="pasteBox" rows="6" style="width:100%;padding:8px;border:1.5px solid var(--ink);border-radius:6px;font-family:monospace;font-size:12px" placeholder="6 months 4.69% 4.49% 5.04% 5.29%&#10;1 year 4.65% 4.59% 5.00% 5.25%&#10;New Floating 5.54% 5.54% 6.04% 6.04%&#10;..."></textarea>
        <button class="btn" id="pasteParse" style="margin-top:8px">Capture pasted rows</button>
      </div>
    </details>
  </section>

  <\!-- ============== WORK ROW: deal (left) + ratesheet (right) ============== -->
  <div class="workrow">
  <section id="tab-deal" class="tab">
    <div class="stitle"><span class="num">1</span><h2>Deal</h2></div>
    <div class="dealwrap">
      <div class="dealcard">
        <div class="dealhead"><h2>Deal details</h2><span class="hint">enter the details below</span></div>

        <div class="drow">
          <div class="dlabel y"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>New Lending</div>
          <div class="dval money"><span class="pfx">$</span><input class="mnum" id="dLend" inputmode="numeric"></div>
        </div>
        <div class="drow">
          <div class="dlabel y"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Loan Term</div>
          <div class="dval"><input class="plain" id="dTerm" type="number" min="1" max="30" step="1"><span class="unit">yrs</span></div>
        </div>
        <div class="drow">
          <div class="dlabel b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Property Value</div>
          <div class="dval money"><span class="pfx">$</span><input class="mnum" id="dPV" inputmode="numeric"></div>
        </div>
        <div class="drow">
          <div class="dlabel n"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>First Home Buyer</div>
          <div class="dval"><select id="fhbSel" class="ynsel"><option value="">—</option><option>Yes</option><option>No</option></select></div>
        </div>

        <div class="dealactions"><button class="btn ghost" id="dealReset">Reset deal</button></div>

        <div class="results">
          <div class="lvr-top"><span>Loan to Value Ratio</span><b id="lvrOut">—</b></div>
          <div class="gauge">
            <div class="zones"><div class="zone green"></div><div class="zone amber"></div><div class="zone red"></div></div>
            <div class="gauge-pointer" id="gaugePointer" style="left:0%"></div>
          </div>
          <div class="ticks"><div class="tick" style="left:80%">80%</div><div class="tick" style="left:85%">85%</div></div>

          <div class="out-tiles">
            <div class="tile"><div class="tile-label">Rate applied</div><div class="tile-val" id="basisOut" style="font-size:14px;line-height:1.3">—</div><div style="margin-top:7px"><span class="bandchip" id="bandChip">—</span></div></div>
            <div class="tile hero"><div class="tile-label">Cash Contribution</div><div class="tile-val" id="cashOut">$0</div></div>
          </div>
          <div class="cash-why" id="cashWhy">—</div>
        </div>
      </div>
    </div>
  </section>

  <section id="tab-sheet" class="tab">
    <div class="stitle"><span class="num">2</span><h2>Ratesheet</h2></div>
    <div class="sheetctrls">
      <div class="fld"><label>Lending for repayments ($)</label><input type="number" id="s_loan" step="1000"><button type="button" class="linkbtn" id="s_loanReset" hidden></button></div>
      <div class="fld"><label>Term (years)</label><input type="number" id="s_term" min="1" max="30"></div>
      <div class="fld"><label>Repayments</label>
        <select id="s_basis">
          <option value="pi">Principal &amp; Interest</option>
          <option value="io">Interest only</option>
        </select>
      </div>
      <div class="fld"><label>Cash offer ($)</label><input type="number" id="s_cash" step="500"></div>
      <div class="fld"><button class="btn" id="copyBtn">Copy for Word</button></div>
      <div class="fld"><button class="btn ghost printbtn" id="printBtn">Print / Save PDF</button></div>
      <div class="fld copystatus" id="copyStatus"></div>
    </div>

    <div class="swrap">
      <table class="sheet">
        <thead>
          <tr>
            <th rowspan="2">Term</th>
            <th rowspan="2">Standard Rate</th>
            <th rowspan="2">Your Discount</th>
            <th rowspan="2">Your Rate</th>
            <th colspan="3" class="repcol">Repayments*</th>
          </tr>
          <tr>
            <th class="repcol">weekly</th>
            <th>f/n</th>
            <th>monthly</th>
          </tr>
        </thead>
        <tbody id="sheetBody"></tbody>
      </table>
    </div>
    <div class="foot" id="sheetFoot"></div>
  </section>
  </div>

  <\!-- ============== MASTER RATES (bottom) ============== -->
  <section id="tab-master" class="tab">
    <div class="stitle"><span class="num">3</span><h2>Master Rates</h2></div>
    <div class="ratecard">
      <div class="ratebanner"><div class="wm"><span>ANZ</span></div></div>
      <div class="herostrip"></div>
      <div class="mwrap">
        <table class="master">
          <thead>
            <tr>
              <th rowspan="2" style="text-align:left">Product</th>
              <th rowspan="2" style="text-align:left">Term</th>
              <th colspan="2">&le; 80% LVR</th>
              <th colspan="2" class="bandsplit">&gt; 80%+ LVR</th>
            </tr>
            <tr>
              <th>ANZ Special Rates* &ndash; &le;80% LVR (p.a.)</th>
              <th>Discretionary Rates &le;80% LVR (p.a.)</th>
              <th class="bandsplit">Discretionary Rates 80.01&ndash;85% LVR (p.a.)</th>
              <th>ANZ Standard Rates &ndash; &gt;85%+ LVR (p.a.)</th>
            </tr>
          </thead>
          <tbody id="masterBody"></tbody>
        </table>
      </div>
      <div class="masterbtns">
        <button class="btn ghost" id="addMasterRow">+ Add row</button>
        <button class="btn ghost" id="exportBtn">Export config JSON</button>
        <button class="btn ghost" id="importBtn">Import config JSON</button>
        <input type="file" id="importFile" accept=".json,application/json" style="display:none">
        <button class="btn ghost" id="resetBtn">Reset to defaults</button>
      </div>
    </div>

    <details class="matrix" open>
      <summary>Cash contribution rules — editable</summary>
      <div class="inner">
        <p class="mxnote">ANZ pays a cash contribution based on the LVR band and the new lending amount, plus a flat First Home Buyer offer. The Deal section uses the larger of whatever qualifies. Edit any figure below and the changes flow straight through to the Deal and Ratesheet above — no code changes needed for future rate-sheet updates.</p>

        <h4>Percentage tiers</h4>
        <div class="mwrap">
          <table class="mxtable" id="cashTable">
            <thead><tr>
              <th>LVR band</th><th>Lending from&nbsp;$</th><th>Lending to&nbsp;$</th><th>% of lending</th><th>Max cash&nbsp;$</th><th></th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div style="margin-top:12px;display:flex;gap:8px"><button class="btn ghost" id="addCash">+ Add tier</button></div>

        <h4>First Home Buyer flat offer</h4>
        <div class="mxbar">
          <label class="mxchk"><input type="checkbox" id="cf_active"> First Home Buyer flat offer active</label>
          <span>Amount $<input type="number" id="cf_amt" class="mxnum wide"></span>
          <span>Applies when lending &ge; $<input type="number" id="cf_min" class="mxnum wide"></span>
        </div>

        <h4>Rounding</h4>
        <div class="mxbar">
          <span>Round contribution up to the nearest $<input type="number" id="cf_round" class="mxnum"></span>
          <span style="color:var(--muted)">(0 = no rounding)</span>
        </div>
      </div>
    </details>
  </section>

</main>

<footer>
  Rates and cash rules are indicative only and exclude fees. PDF capture is best-effort — always verify the captured figures against the source rate sheet. The hero band is a placeholder, not ANZ’s marketing artwork.
</footer>

<script>
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const KEY_LABEL = {

/* ============== DEFAULTS (from the ANZ rate sheet screenshots) ============== */
/* special80  = ANZ Special Rates* \u2013 \u226480% LVR
   disc80     = Discretionary Rates \u226480% LVR
   disc85     = Discretionary Rates 80.01\u201385% LVR
   standard85 = ANZ Standard Rates \u2013 >85%+ LVR */
const DEFAULTS = {
  master:[
    {product:"Fixed rate",   term:"6 months",  special80:4.69, disc80:4.49, disc85:5.04, standard85:5.29},
    {product:"Fixed rate",   term:"1 year",    special80:4.65, disc80:4.59, disc85:5.00, standard85:5.25},
    {product:"Fixed rate",   term:"18 months", special80:5.19, disc80:4.99, disc85:5.54, standard85:5.79},
    {product:"Fixed rate",   term:"2 years",   special80:5.29, disc80:4.99, disc85:5.64, standard85:5.89},
    {product:"Fixed rate",   term:"3 years",   special80:5.49, disc80:5.39, disc85:5.84, standard85:6.09},
    {product:"Fixed rate",   term:"4 years",   special80:5.65, disc80:5.65, disc85:6.14, standard85:6.39},
    {product:"Fixed rate",   term:"5 years",   special80:5.79, disc80:5.79, disc85:6.24, standard85:6.49},
    {product:"New Floating", term:"",          special80:5.54, disc80:5.54, disc85:6.04, standard85:6.04},
    {product:"New Flexi",    term:"",          special80:5.40, disc80:5.40, disc85:5.90, standard85:5.90}
  ],
  deal:{ lending:380000, propertyValue:500000, termYears:30, rate80pref:"special", firstHomeBuyer:"No" },
  /* ANZ cash contribution rules \u2014 fully editable in the Master Rates section.
     Each percentage tier is chosen by LVR band + new-lending amount; the flat
     First Home Buyer offer is applied on top and the larger qualifying option wins. */
  cashRules:{
    tiers:[
      {band:"0-80% LVR",     minLend:200000, maxLend:699999,  pct:0.9, maxCash:6300},
      {band:"0-80% LVR",     minLend:700000, maxLend:3000000, pct:1.0, maxCash:30000},
      {band:"80.01-85% LVR", minLend:200000, maxLend:2000000, pct:0.5, maxCash:10000}

  },

};

let store = load() || JSON.parse(JSON.stringify(DEFAULTS));

/* backfill / migrate older saved copies without wiping good data */
(function backfill(){
  const D=DEFAULTS;
  if(!store.master || !store.master.length || !("special80" in store.master[0]))
    store.master = JSON.parse(JSON.stringify(D.master));         // old 3-column format \u2192 reset
  if(!store.deal) store.deal = JSON.parse(JSON.stringify(D.deal));
  if(store.deal.lending==null && "loanAmount" in store.deal) store.deal.lending=store.deal.loanAmount;
  if(!("propertyValue" in store.deal)) store.deal.propertyValue = D.deal.propertyValue;
  if(!("termYears" in store.deal)) store.deal.termYears = D.deal.termYears;
  if(!("firstHomeBuyer" in store.deal)) store.deal.firstHomeBuyer = D.deal.firstHomeBuyer;
  if(!("rate80pref" in store.deal)){                              // migrate old rateBasis \u2192 pref
    store.deal.rate80pref = store.deal.rateBasis==="disc80" ? "disc" : "special";
  }
  delete store.deal.rateBasis; delete store.deal.basis;
  if(!store.cashRules || !store.cashRules.tiers) store.cashRules = JSON.parse(JSON.stringify(D.cashRules));
  if(!store.cashRules.fhb) store.cashRules.fhb = JSON.parse(JSON.stringify(D.cashRules.fhb));
  if(!("roundTo" in store.cashRules)) store.cashRules.roundTo=0;
  if(!store.sheet) store.sheet = JSON.parse(JSON.stringify(D.sheet));
  ["lending","termYears","basis","cash"].forEach(k=>{ if(!(k in store.sheet)) store.sheet[k]=D.sheet[k]; });
  if(store.sheet.lending==null && "loan" in store.sheet) store.sheet.lending=store.sheet.loan;
  delete store.sheet.rateBasis;
  if(store.deal.rate80pref!=="disc") store.deal.rate80pref="special";

})();

/* ============== PERSIST (safe if storage blocked) ============== */
function save(){ try{ localStorage.setItem("anz_ratesheet_v2", JSON.stringify(store)); }catch(e){} }
function load(){ try{ const s=localStorage.getItem("anz_ratesheet_v2"); return s?JSON.parse(s):null; }catch(e){ return null; } }

/* ============== HELPERS ============== */
const $ = id => document.getElementById(id);
const money = n => "$" + Math.round(n||0).toLocaleString("en-NZ");
const fmtInt = n => (n||0).toLocaleString("en-NZ");
const parseInt$ = s => parseInt(String(s).replace(/[^\d]/g,""),10)||0;
function roundUp(v,to){ return to>0 ? Math.ceil(v/to)*to : v; }

function sheetMeta(row){
  const t=(row.term||"").toLowerCase(), p=(row.product||"").toLowerCase();
  if(p.includes("floating")||t.includes("floating")||t.includes("variable")) return {label:"Floating",  color:"black", order:1};
  if(p.includes("flexi")||p.includes("flexible")||p.includes("revolving")) return {label:"Flexi (RC)", color:"black", order:2, io:true};
  if(t==="6 months")  return {label:"6 months fixed", color:"gold", order:3};
  if(t==="1 year")    return {label:"1 year fixed",   color:"gold", order:4};
  if(t==="18 months") return {label:"18 months fixed",color:"green",order:5};
  if(t==="2 years")   return {label:"2 years fixed",  color:"green",order:6};
  if(t==="3 years")   return {label:"3 years fixed",  color:"red",  order:7};
  if(t==="4 years")   return {label:"4 years fixed",  color:"red",  order:8};
  if(t==="5 years")   return {label:"5 years fixed",  color:"red",  order:9};
  return {label:row.term||row.product, color:"black", order:99};
}

/* Master-table order keeps the Fixed rate group first (as on the ANZ sheet),
   with Floating and Flexi beneath \u2014 separate from the ratesheet's order. */
function masterOrder(row){
  const t=(row.term||"").toLowerCase(), p=(row.product||"").toLowerCase();
  const to={"6 months":1,"1 year":2,"18 months":3,"2 years":4,"3 years":5,"4 years":6,"5 years":7};
  if(to[t]!==undefined) return to[t];
  if(p.includes("floating")) return 20;
  if(p.includes("flexi")) return 21;
  return 99;
}

/* ============== LVR-DRIVEN RATE + BAND LOGIC ============== */
/* LVR = new lending / property value. It selects both the cash-contribution
   band and which rate column the ratesheet uses. */
function lvr(){ const d=store.deal; return d.propertyValue>0 ? d.lending/d.propertyValue*100 : null; }
function lvrBand(L){
  if(L==null) return null;
  if(L<=80) return "0-80% LVR";
  if(L<=85) return "80.01-85% LVR";
  return ">85% LVR";
}
/* Which column is "Your Rate", by LVR:
     \u226480%          \u2192 col 2, Discretionary \u226480%
     80.01\u201385%     \u2192 col 3, Discretionary 80.01\u201385%
     >85%          \u2192 col 4, ANZ Standard >85%+
   Standard Rate is always col 4 (ANZ Standard). */
function effectiveRateKey(L){
  if(L==null || L<=80) return "disc80";
  if(L<=85) return "disc85";
  return "standard85";
}

/* ============== CALCULATIONS ============== */
/* Repayment for a given frequency, ppy = periods per year (52 weekly, 26
   fortnightly, 12 monthly). Each frequency amortises on its own period rate. */
function repay(rate,P,years,io,ppy){
  ppy=ppy||12;
  if(P<=0 || years<=0) return 0;
  const i=rate/100/ppy;
  if(io) return P*i;
  const n=years*ppy;
  return i===0 ? P/n : P*i/(1-Math.pow(1+i,-n));
}

/* Cash contribution for a given LVR band: matching % tier plus the flat FHB
   offer \u2014 whichever qualifying option is larger. */
function cashCalcForBand(lending, band, isFhb){
  const cr=store.cashRules;
  if(band==null) return {cash:0, why:"Enter a property value \u2014 the LVR band (and cash) can\u2019t be determined yet."};
  const options=[];
  (cr.tiers||[]).forEach(t=>{
    if(t.band!==band) return;
    if(lending < (t.minLend||0)) return;
    if(t.maxLend>0 && lending > t.maxLend) return;
    let c=lending*(t.pct||0)/100;
    if(t.maxCash>0) c=Math.min(c, t.maxCash);
    options.push({cash:c, why:`${t.band} \u00b7 ${t.pct}% of ${money(lending)} (max ${money(t.maxCash)})`});
  });
  if(cr.fhb && cr.fhb.active && isFhb && lending>=(cr.fhb.minLend||0))
    options.push({cash:cr.fhb.amount||0, why:`First Home Buyer \u00b7 ${money(cr.fhb.amount||0)} (lending \u2265 ${money(cr.fhb.minLend||0)})`});
  if(!options.length) return {cash:0, why:`No cash contribution qualifies at ${band} for this lending amount`};
  options.sort((a,b)=>b.cash-a.cash);
  const best=options[0];
  best.cash=roundUp(best.cash, cr.roundTo||0);
  return best;
}
function cashCalc(){ const d=store.deal; return cashCalcForBand(d.lending||0, lvrBand(lvr()), d.firstHomeBuyer==="Yes"); }

/* ============== RENDER: MASTER ============== */
function renderMaster(){
  const body=$("masterBody"); body.innerHTML="";
  const groups=[]; store.master.forEach((row,i)=>{
    const last=groups[groups.length-1];
    if(last && last.name===row.product) last.rows.push(i); else groups.push({name:row.product,rows:[i]});
  });
  groups.forEach(gr=>gr.rows.forEach((idx,gi)=>{
    const row=store.master[idx], tr=document.createElement("tr");
    let html="";
    if(gi===0) html+=`<td class="group" rowspan="${gr.rows.length}">${row.product}</td>`;
    html+=`<td class="term"><input class="term" data-i="${idx}" data-k="term" value="${row.term||""}"></td>`;
    RATE_KEYS.forEach((k,ki)=>{ const cls=ki===2?' class="bandsplit"':''; html+=`<td${cls}><input type="number" step="0.01" data-i="${idx}" data-k="${k}" value="${row[k]}"></td>`; });
    html+=`<td style="border:0;background:#fff"><button class="delrow" data-del="${idx}" title="Remove">\u2715</button></td>`;
    tr.innerHTML=html; body.appendChild(tr);
  }));
  body.querySelectorAll("input").forEach(inp=>inp.addEventListener("input",e=>{
    const i=+e.target.dataset.i, k=e.target.dataset.k;
    store.master[i][k]= k==="term" ? e.target.value : (parseFloat(e.target.value)||0);
    save(); renderSheet();
  }));
  body.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",e=>{
    store.master.splice(+e.target.dataset.del,1); save(); renderMaster(); renderSheet();
  }));
}

/* ============== RENDER: DEAL ============== */
function selInit(id,get,set){
  const el=$(id);
  el.addEventListener("change",()=>{ set(el.value); save(); renderDeal(); renderSheet(); });
  el._sync=()=>{ el.value=get(); };
}
function moneyInit(id,get,set){
  const el=$(id);
  el.addEventListener("input",()=>{ const v=parseInt$(el.value); set(v); el.value=v?fmtInt(v):""; save(); renderDeal(); renderSheet(); });
  el._sync=()=>{ const v=get(); el.value=v?fmtInt(v):""; };

function renderDeal(){
  const d=store.deal, L=lvr(), band=lvrBand(L);
  $("dLend")._sync&&$("dLend")._sync();
  $("dPV")._sync&&$("dPV")._sync();
  $("dTerm").value = d.termYears ? d.termYears : "";

/* ============== RENDER: RATESHEET ============== */
function sheetRows(){
  const lending=store.sheet.lending ?? store.deal.lending;
  const years=store.sheet.termYears ?? store.deal.termYears;
  const basis=store.sheet.basis || "pi";
  const L=lvr();
  const key=effectiveRateKey(L);
  const io=basis==="io";
  let ioOnly=false;
  const rows=store.master.map(r=>({r,m:sheetMeta(r)})).sort((a,b)=>a.m.order-b.m.order).map(({r,m})=>{
    const std=r.standard85;          // 4th column \u2014 ANZ Standard (>85%+) as the standard reference
    const your=r[key];               // 2nd col (disc80) at \u226480%, 3rd col (disc85) above 80%
    const disc=your-std;             // negative = discount below the advertised rate
    const mid=(disc>0?"+":"")+disc.toFixed(2)+"%";
    /* Revolving credit has no scheduled principal, so this row stays on an
       interest only basis whichever basis the rest of the sheet is set to. */
    const rio = io || !!m.io;
    if(m.io) ioOnly=true;
    const wk=repay(your,lending,years,rio,52), fn=repay(your,lending,years,rio,26), mo=repay(your,lending,years,rio,12);
    return {label:m.label+(m.io?"*":""),color:m.color,std,your,mid,wk,fn,mo};
  });
  return {rows,key,L,lending,years,basis,ioOnly};
}

function renderSheet(){
  const {rows,key,L,lending,years,basis,ioOnly}=sheetRows();
  /* A figure equal to what the rule gives is not a deliberate override —
     it is just the number the box was already showing, and pinning it there
     would stop the cashback following the loan. */
  const autoCash = cashCalcForBand(lending, lvrBand(L), store.deal.firstHomeBuyer==="Yes").cash;
  if(store.sheet.cash!=null && Math.round(store.sheet.cash)===Math.round(autoCash)) store.sheet.cash=null;
  const cash = store.sheet.cash ?? autoCash;
  const dealLend=store.deal.lending||0;
  const overridden=store.sheet.lending!=null && store.sheet.lending!==dealLend;
  $("s_loan").value=lending; $("s_term").value=years?years:"";
  $("s_loan").classList.toggle("overridden",overridden);
  const rst=$("s_loanReset");
  rst.hidden=!overridden;
  if(overridden) rst.textContent="Use the deal amount ($"+fmtInt(dealLend)+")";
  $("s_basis").value=basis;
  $("s_cash").value=cash || "";

  const body=$("sheetBody"); body.innerHTML="";
  rows.forEach(row=>{
    const tr=document.createElement("tr"); tr.className=row.color;
    tr.innerHTML=`<td class="term">${row.label}</td>
      <td>${row.std.toFixed(2)}%</td>
      <td>${row.mid}</td>
      <td>${row.your.toFixed(2)}%</td>
      <td class="repcol">${money(row.wk)}</td>
      <td>${money(row.fn)}</td>
      <td>${money(row.mo)}</td>`;
    body.appendChild(tr);
  });

  const basisTxt = basis==="io" ? "interest only" : "P&I";
  let foot=`<div>*Repayments are on ${basis==="io"?"an":"a"} ${basisTxt} basis over ${years} years - Loan of ${money(lending)}.</div>`;
  if(ioOnly) foot+=`<div>*Flexi \u2013 Revolving Credit is on an interest only basis.</div>`;
  if(cash>0) foot+=`<div>*ANZ will also give you ${money(cash)} cash for having your home loan with them.</div>`;
  $("sheetFoot").innerHTML=foot;
}

/* ============== COPY RATESHEET FOR WORD (inline-styled) ============== */
function copyStatus(msg){ const el=$("copyStatus"); el.textContent=msg; if(msg) setTimeout(()=>{el.textContent="";},4000); }
function buildSheetHtml(){
  const {rows,key,L,lending,years,basis,ioOnly}=sheetRows();
  /* A figure equal to what the rule gives is not a deliberate override —
     it is just the number the box was already showing, and pinning it there
     would stop the cashback following the loan. */
  const autoCash = cashCalcForBand(lending, lvrBand(L), store.deal.firstHomeBuyer==="Yes").cash;
  if(store.sheet.cash!=null && Math.round(store.sheet.cash)===Math.round(autoCash)) store.sheet.cash=null;
  const cash = store.sheet.cash ?? autoCash;
  const colr={black:"#14213a",gold:"#E8A020",green:"#1E8E4E",red:"#C0341B"};
  const th="border:1px solid #333;background:#0073e6;color:#ffffff;font-family:Calibri,Arial,sans-serif;font-size:11px;font-weight:bold;padding:3px 7px;text-align:center;";
  const td="border:1px solid #333;font-family:Calibri,Arial,sans-serif;font-size:11px;font-weight:bold;padding:2px 7px;text-align:center;";
  let h=`<table style="border-collapse:collapse;width:680px;">`;
  h+=`<tr><th style="${th}text-align:left;" rowspan="2">Term</th><th style="${th}" rowspan="2">Standard Rate</th><th style="${th}" rowspan="2">Your Discount</th><th style="${th}" rowspan="2">Your Rate</th><th style="${th}" colspan="3">Repayments*</th></tr>`;
  h+=`<tr><th style="${th}">weekly</th><th style="${th}">f/n</th><th style="${th}">monthly</th></tr>`;
  rows.forEach(r=>{ const c=colr[r.color]||"#161616";
    h+=`<tr>`+
      `<td style="${td}text-align:left;color:${c};">${r.label}</td>`+
      `<td style="${td}color:${c};">${r.std.toFixed(2)}%</td>`+
      `<td style="${td}color:${c};">${r.mid}</td>`+
      `<td style="${td}color:${c};">${r.your.toFixed(2)}%</td>`+
      `<td style="${td}color:${c};">${money(r.wk)}</td>`+
      `<td style="${td}color:${c};">${money(r.fn)}</td>`+
      `<td style="${td}color:${c};">${money(r.mo)}</td>`+
    `</tr>`;
  });
  h+=`</table>`;
  const basisTxt = basis==="io" ? "interest only" : "P&I";
  h+=`<p style="font-family:Calibri,Arial,sans-serif;font-size:10px;font-style:italic;margin:6px 0 0;">`+
     `*Repayments are on ${basis==="io"?"an":"a"} ${basisTxt} basis over ${years} years - Loan of ${money(lending)}.`;
  if(ioOnly) h+=`<br>*Flexi \u2013 Revolving Credit is on an interest only basis.`;
  if(cash>0) h+=`<br>*ANZ will also give you ${money(cash)} cash for having your home loan with them.`;
  h+=`</p>`;
  const plain=[["Term","Standard Rate","Your Discount","Your Rate","weekly","f/n","monthly"]]
    .concat(rows.map(r=>[r.label,r.std.toFixed(2)+"%",r.mid,r.your.toFixed(2)+"%",money(r.wk),money(r.fn),money(r.mo)]))
    .map(row=>row.join("\t")).join("\n");
  return {h,plain};
}
async function copySheet(){
  const {h,plain}=buildSheetHtml();
  try{
    if(navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({
        "text/html":new Blob([h],{type:"text/html"}),
        "text/plain":new Blob([plain],{type:"text/plain"})
      })]);
      copyStatus("Copied \u2014 paste into Word");
      return;
    }
  }catch(e){ /* fall through */ }
  try{
    const ta=document.createElement("textarea"); ta.value=plain; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
    copyStatus("Copied (text)");
  }catch(e){ copyStatus("Copy failed"); }
}

/* ============== CAPTURE: PDF text \u2192 OCR fallback \u2192 images \u2192 paste ============== */
let lastReadLines=[];
function setStatus(msg,cls){ const st=$("dropStatus"); st.className="status"+(cls?" "+cls:""); st.textContent=msg; }

function detectRow(text){
  const s=text.toLowerCase();
  if(/new\s*flexi|flexi|flexible|revolving/.test(s))         return {product:"New Flexi",    term:""};
  if(/new\s*floating|floating|variable/.test(s))             return {product:"New Floating", term:""};
  if(/18\s*(months|mths|mth|mo)\b/.test(s))                  return {product:"Fixed rate", term:"18 months"};
  if(/\b6\s*(months|mths|mth|mo)\b/.test(s))                 return {product:"Fixed rate", term:"6 months"};
  if(/\b1\s*(years?|yrs?)\b|12\s*(months|mths|mo)\b/.test(s))return {product:"Fixed rate", term:"1 year"};
  if(/\b2\s*(years?|yrs?)\b|24\s*(months|mo)\b/.test(s))     return {product:"Fixed rate", term:"2 years"};
  if(/\b3\s*(years?|yrs?)\b|36\s*(months|mo)\b/.test(s))     return {product:"Fixed rate", term:"3 years"};
  if(/\b4\s*(years?|yrs?)\b|48\s*(months|mo)\b/.test(s))     return {product:"Fixed rate", term:"4 years"};
  if(/\b5\s*(years?|yrs?)\b|60\s*(months|mo)\b/.test(s))     return {product:"Fixed rate", term:"5 years"};
  return null;
}

/* Shared parser: array of text lines \u2192 capture records with the four rate columns.
   Percentages are read left-to-right in sheet order:
   Special \u226480 \u00b7 Discretionary \u226480 \u00b7 Discretionary 80.01\u201385 \u00b7 Standard >85+ */
function parseLines(lines){
  const captured={};
  lines.forEach(text=>{
    const t=detectRow(text); if(!t) return;
    let pcts=(text.match(/(\d{1,2}(?:[.,]\d{1,2})?)\s*%/g)||[]).map(x=>parseFloat(x.replace(",",".")));
    pcts=pcts.filter(p=>p>0 && p<15);
    if(pcts.length<2) return;
    const p=(i,fb)=>pcts[i]!==undefined?pcts[i]:fb;
    const rec={product:t.product, term:t.term,
      special80:p(0),
      disc80:p(1,pcts[0]),
      disc85:p(2,p(1,pcts[0])),
      standard85:p(3,p(2,p(1,pcts[0])))};
    captured[t.product+"|"+t.term]=rec;
  });
  return Object.values(captured);
}

async function pdfTextLines(pdf){
  const lines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const items=(await page.getTextContent()).items.filter(i=>i.str.trim());
    if(!items.length) continue;
    const heights=items.map(i=>i.height||0).filter(h=>h>0).sort((a,b)=>a-b);
    const medH=heights.length?heights[Math.floor(heights.length/2)]:8;
    const tol=Math.max(3,medH*0.7);
    const mapped=items.map(i=>({str:i.str,x:i.transform[4],y:i.transform[5]}));
    mapped.sort((a,b)=>b.y-a.y||a.x-b.x);
    const rows=[];
    mapped.forEach(it=>{ let r=rows.find(r=>Math.abs(r.y-it.y)<=tol); if(!r){r={y:it.y,items:[]};rows.push(r);} r.items.push(it); });
    rows.forEach(r=>{ r.items.sort((a,b)=>a.x-b.x); lines.push(r.items.map(i=>i.str).join(" ").replace(/\s+/g," ").trim()); });
  }
  return lines;
}

async function ocrPdf(pdf){
  if(!window.Tesseract) throw new Error("OCR library not loaded (needs internet)");
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const vp=page.getViewport({scale:2.5});
    const canvas=document.createElement("canvas"); canvas.width=vp.width; canvas.height=vp.height;
    await page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;
    const {data}=await Tesseract.recognize(canvas,"eng",{logger:m=>{ if(m.status==="recognizing text") setStatus("Reading image, page "+p+" \u2014 "+Math.round(m.progress*100)+"%"); }});
    (data.lines||[]).forEach(l=>out.push(l.text.replace(/\s+/g," ").trim()));
  }
  return out;
}

async function ocrImage(file){
  if(!window.Tesseract) throw new Error("OCR library not loaded (needs internet)");
  const {data}=await Tesseract.recognize(file,"eng",{logger:m=>{ if(m.status==="recognizing text") setStatus("Reading image \u2014 "+Math.round(m.progress*100)+"%"); }});
  return (data.lines||[]).map(l=>l.text.replace(/\s+/g," ").trim());
}

function showReaderLog(lines){
  lastReadLines=lines;
  const box=$("readerLogBox");
  const clean=lines.filter(Boolean);
  if(!clean.length){ box.style.display="none"; return; }
  box.style.display="block"; box.open=false;
  $("readerLog").textContent=clean.join("\n");
}

function applyRecords(recs){
  recs.forEach(rec=>{
    const ex=store.master.find(m=>m.product===rec.product && (m.term||"").toLowerCase()===(rec.term||"").toLowerCase());
    if(ex) Object.assign(ex,rec); else store.master.push(rec);
  });
  store.master.sort((a,b)=>masterOrder(a)-masterOrder(b));
  save(); renderMaster(); renderSheet();
}

async function capture(file){
  try{
    const isImg = (file.type||"").startsWith("image/") || /\.(png|jpe?g|webp)$/i.test(file.name);
    let lines=[];
    if(isImg){
      setStatus("Reading screenshot "+file.name+" \u2014 this can take 20\u201340s\u2026");
      lines=await ocrImage(file);
    } else {
      setStatus("Reading "+file.name+"\u2026");
      if(!window.pdfjsLib) throw new Error("PDF library couldn\u2019t load (needs internet)");
      const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
      lines=await pdfTextLines(pdf);
      if(!parseLines(lines).length){
        setStatus("No selectable text matched \u2014 this PDF looks image-based, running OCR (20\u201340s)\u2026");
        lines=await ocrPdf(pdf);
      }
    }
    showReaderLog(lines);
    const recs=parseLines(lines);
    if(!recs.length){ setStatus("Still no rate rows found. Open \u201cWhat the reader saw\u201d below to see the text, or use the paste box.","err"); return; }
    applyRecords(recs);
    setStatus("Captured "+recs.length+" rate row(s) \u2014 check the figures below against the source.","ok");
  }catch(err){
    setStatus("Couldn\u2019t read that file: "+err.message+". Try the paste box, or type the rates in.","err");
  }
}

/* ==========================================================================
   WORD EXPORT — drops the ratesheet on screen into this bank's Word template
   --------------------------------------------------------------------------
   The template is a real .docx carried inside this file as base64. A .docx is
   a zip of XML parts, so the export opens that zip, rewrites only the pieces
   that change inside word/document.xml, and zips it back up. Every other part
   — styles, fonts, headers, the whole bottom half of the letter — is copied
   through byte for byte, so what lands in the client's inbox is the adviser's
   own template with today's numbers in it.

   What gets replaced:
     1. the rates table at the top        -> rebuilt from the table on screen
     2. the "*Repayments are on ..." line -> every note under the ratesheet
     3. the "* ... cash for having your home loan ..." line -> removed, because
        the notes in (2) already carry the bank's own cash wording
   Everything below those notes is left exactly as the adviser wrote it.

   The table is read straight off the screen rather than out of this bank's
   internals, so the Word table always says what the adviser is looking at —
   same rows, same order, same traffic-light colours, same "Your Discount" or
   "LEM" heading — and one engine serves every bank in the book.
   ========================================================================== */

const WX_FILE   = "Loan Structure - Ratesheet - " + WORD_CFG.bank + ".docx";
const WX_TPLKEY = "wordtpl_" + WORD_CFG.id + "_v1";
let   WX_TPL    = null;   /* {name,b64} once the adviser supplies their own */

try{ WX_TPL = JSON.parse(localStorage.getItem(WX_TPLKEY) || "null"); }catch(e){ WX_TPL = null; }

/* ---------------- bytes ---------------- */
function wxB64Bytes(b64){
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return u;
}
function wxBytesB64(u8){
  let s=""; const C=0x8000;
  for(let i=0;i<u8.length;i+=C) s += String.fromCharCode.apply(null, u8.subarray(i,i+C));
  return btoa(s);
}

let WX_CRCT = null;
function wxCrc32(u8){
  if(!WX_CRCT){
    WX_CRCT = new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); WX_CRCT[n]=c>>>0; }
  }
  let c = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = WX_CRCT[(c ^ u8[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0;
}

/* Raw deflate through the browser's own Compression Streams — no library.
   A browser too old to compress simply stores the part instead, which Word
   reads perfectly well; the file is just a little larger. */
async function wxInflate(u8){
  if(typeof DecompressionStream !== "function")
    throw new Error("this browser cannot read a compressed Word template — try Chrome, Edge, or Safari 16.4 or newer");
  const st = new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function wxDeflate(u8){
  if(typeof CompressionStream !== "function") return null;
  const st = new Blob([u8]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(st).arrayBuffer());
}

/* ---------------- zip ---------------- */
function wxZipRead(buf){
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for(let i=buf.length-22; i>=0 && i > buf.length-22-65557; i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd < 0) throw new Error("that file is not a Word document");
  const count = dv.getUint16(eocd+10,true);
  let p = dv.getUint32(eocd+16,true);
  const dec = new TextDecoder(), out = [];
  for(let i=0;i<count;i++){
    if(dv.getUint32(p,true) !== 0x02014b50) throw new Error("that Word document is damaged");
    const method=dv.getUint16(p+10,true), mtime=dv.getUint16(p+12,true), mdate=dv.getUint16(p+14,true),
          crc=dv.getUint32(p+16,true), csize=dv.getUint32(p+20,true), usize=dv.getUint32(p+24,true),
          nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true),
          lho=dv.getUint32(p+42,true);
    const name = dec.decode(buf.subarray(p+46, p+46+nlen));
    const dstart = lho + 30 + dv.getUint16(lho+26,true) + dv.getUint16(lho+28,true);
    out.push({ name, method, crc, csize, usize, mtime, mdate, data: buf.subarray(dstart, dstart+csize) });
    p += 46 + nlen + elen + clen;
  }
  return out;
}

function wxZipWrite(entries){
  const enc = new TextEncoder(), body = [], dir = [];
  let off = 0;
  entries.forEach(e => {
    const nm = enc.encode(e.name);
    const lh = new Uint8Array(30 + nm.length), lv = new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0,true);
    lv.setUint16(8,e.method,true);   lv.setUint16(10,e.mtime,true); lv.setUint16(12,e.mdate,true);
    lv.setUint32(14,e.crc,true);     lv.setUint32(18,e.csize,true); lv.setUint32(22,e.usize,true);
    lv.setUint16(26,nm.length,true); lv.setUint16(28,0,true);
    lh.set(nm,30);
    body.push(lh, e.data);

    const ch = new Uint8Array(46 + nm.length), cv = new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true); cv.setUint16(8,0,true);
    cv.setUint16(10,e.method,true);  cv.setUint16(12,e.mtime,true); cv.setUint16(14,e.mdate,true);
    cv.setUint32(16,e.crc,true);     cv.setUint32(20,e.csize,true); cv.setUint32(24,e.usize,true);
    cv.setUint16(28,nm.length,true); cv.setUint32(42,off,true);
    ch.set(nm,46);
    dir.push(ch);
    off += lh.length + e.data.length;
  });
  const dirSize = dir.reduce((a,b)=>a+b.length,0);
  const eo = new Uint8Array(22), ev = new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(8,entries.length,true); ev.setUint16(10,entries.length,true);
  ev.setUint32(12,dirSize,true);       ev.setUint32(16,off,true);
  return new Blob(body.concat(dir,[eo]),
    {type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

/* ---------------- reading the table off the screen ---------------- */
function wxText(el){
  const c = el.cloneNode(true);
  Array.prototype.forEach.call(c.querySelectorAll("br"), function(b){ b.parentNode.replaceChild(document.createTextNode(" "), b); });
  return (c.textContent || "").replace(/\s+/g," ").trim();
}
/* On screen some banks reverse their heading strip out of a coloured bar. The
   Word table keeps the template's plain white look, so anything close to white
   would vanish — those cells come back as black instead. */
function wxHex(css){
  const m = /rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(css || "");
  if(!m) return "000000";
  const r = +m[1], g = +m[2], b = +m[3];
  if(0.299*r + 0.587*g + 0.114*b > 215) return "000000";
  return [r,g,b].map(function(v){ return ("0" + v.toString(16)).slice(-2); }).join("").toUpperCase();
}

/* Turns a <thead>/<tbody> into a rectangular grid so rowspan and colspan can
   be replayed as Word's vMerge and gridSpan. */
function wxGrid(section){
  const grid = [];
  Array.prototype.forEach.call(section.rows, function(tr, r){
    grid[r] = grid[r] || [];
    let c = 0;
    Array.prototype.forEach.call(tr.cells, function(td){
      while(grid[r][c]) c++;
      const cs = td.colSpan || 1, rs = td.rowSpan || 1;
      for(let i=0;i<rs;i++){
        grid[r+i] = grid[r+i] || [];
        for(let j=0;j<cs;j++)
          grid[r+i][c+j] = { td:td, span:cs, rows:rs, colStart:(j===0), rowStart:(i===0) };
      }
      c += cs;
    });
  });
  return grid;
}

function wxReadCell(td, head){
  const cs = getComputedStyle(td);
  return {
    text:  wxText(td),
    color: head ? "000000" : wxHex(cs.color),
    bold:  head || parseInt(cs.fontWeight,10) >= 600 || cs.fontWeight === "bold",
    align: cs.textAlign === "right" ? "right" : (cs.textAlign === "left" || cs.textAlign === "start") ? "left" : "center"
  };
}

/* ---------------- column widths, so every row stays on one line ----------
   Data cells are measured at full length and never allowed to wrap. Header
   cells may still wrap onto the second deck, exactly as the template does, so
   a long heading never squeezes the rows. If even the unwrappable content is
   wider than the page, the whole table steps down a point size until it fits
   rather than breaking a row in two. */
let WX_MEAS = null;
function wxWidth(text, bold, pt){
  if(!WX_MEAS) WX_MEAS = document.createElement("canvas").getContext("2d");
  WX_MEAS.font = (bold ? "bold " : "") + (pt * 4 / 3) + 'px Calibri, Carlito, Candara, "Segoe UI", Arial, sans-serif';
  return WX_MEAS.measureText(text).width * 15;          /* px -> twips */
}
const WX_PAD = 200;                                      /* cell margins + a little air */

function wxColumnWidths(head, body, cols, avail, pt){
  const min = new Array(cols).fill(240), want = new Array(cols).fill(240);
  /* A cell that spans columns only has to fit across the columns it covers,
     so its width is claimed once, from the column it starts in. */
  function claim(arr, from, span, need){
    span = Math.min(span, cols - from);
    if(span < 1) return;
    let have = 0;
    for(let i=0;i<span;i++) have += arr[from+i];
    if(need <= have) return;
    const extra = (need - have) / span;
    for(let i=0;i<span;i++) arr[from+i] += extra;
  }
  body.forEach(function(row){
    row.forEach(function(c){
      if(!c || !c.colStart) return;
      const w = wxWidth(c.text, c.bold, pt) + WX_PAD;
      claim(min, c.col, c.span, w); claim(want, c.col, c.span, w);
    });
  });
  head.forEach(function(row){
    row.forEach(function(c){
      if(!c || !c.colStart) return;
      const longest = c.text.split(" ").reduce(function(a,w){ return Math.max(a, wxWidth(w, c.bold, pt)); }, 0);
      claim(min,  c.col, c.span, longest + WX_PAD);
      claim(want, c.col, c.span, wxWidth(c.text, c.bold, pt) + WX_PAD);
    });
  });

  const sumMin = min.reduce(function(a,b){ return a+b; }, 0);
  if(sumMin > avail) return null;                        /* caller drops a point size */

  const sumWant = want.reduce(function(a,b){ return a+b; }, 0);
  let out;
  if(sumWant <= avail){
    const slack = (avail - sumWant) / cols;
    out = want.map(function(w){ return w + slack; });
  }else{
    const room = avail - sumMin, hunger = sumWant - sumMin;
    out = min.map(function(w,i){ return w + room * ((want[i]-w) / hunger); });
  }
  out = out.map(function(w){ return Math.round(w); });
  out[cols-1] += avail - out.reduce(function(a,b){ return a+b; }, 0);
  return out;
}

/* ---------------- WordprocessingML ---------------- */
function wxEsc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function wxBd(tag, kind){
  return kind === "nil"
    ? '<w:' + tag + ' w:val="nil"/>'
    : '<w:' + tag + ' w:val="single" w:sz="8" w:space="0" w:color="auto"/>';
}
function wxP(c, pt){
  const sz = Math.round(pt * 2);
  const rpr = '<w:rFonts w:ascii="Calibri" w:eastAsia="Times New Roman" w:hAnsi="Calibri" w:cs="Calibri"/>' +
              (c.bold ? "<w:b/><w:bCs/>" : "") +
              '<w:color w:val="' + c.color + '"/>' +
              '<w:sz w:val="' + sz + '"/><w:szCs w:val="' + sz + '"/><w:lang w:eastAsia="en-GB"/>';
  const jc = c.align === "left" ? "" : '<w:jc w:val="' + (c.align === "right" ? "right" : "center") + '"/>';
  return '<w:p><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/>' + jc +
         "<w:rPr>" + rpr + "</w:rPr></w:pPr>" +
         (c.text === "" ? "" : "<w:r><w:rPr>" + rpr + '</w:rPr><w:t xml:space="preserve">' + wxEsc(c.text) + "</w:t></w:r>") +
         "</w:p>";
}
function wxTc(w, inner, o){
  const b = o.bd;
  return '<w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/>' +
    (o.span > 1 ? '<w:gridSpan w:val="' + o.span + '"/>' : "") +
    (o.vm === "restart" ? '<w:vMerge w:val="restart"/>' : o.vm === "cont" ? "<w:vMerge/>" : "") +
    "<w:tcBorders>" + wxBd("top",b.t) + wxBd("left",b.l) + wxBd("bottom",b.b) + wxBd("right",b.r) + "</w:tcBorders>" +
    (o.noWrap ? "<w:noWrap/>" : "") +
    '<w:vAlign w:val="center"/></w:tcPr>' + inner + "</w:tc>";
}

function wxBuildTable(head, body, widths, pt){
  const cols = widths.length;
  let x = '<w:tbl><w:tblPr><w:tblW w:w="' + widths.reduce(function(a,b){return a+b;},0) + '" w:type="dxa"/>' +
          '<w:tblCellMar><w:left w:w="85" w:type="dxa"/><w:right w:w="85" w:type="dxa"/></w:tblCellMar>' +
          '<w:tblLook w:val="04A0" w:firstRow="1" w:lastRow="0" w:firstColumn="1" w:lastColumn="0" w:noHBand="0" w:noVBand="1"/>' +
          "</w:tblPr><w:tblGrid>" + widths.map(function(w){ return '<w:gridCol w:w="' + w + '"/>'; }).join("") + "</w:tblGrid>";

  function emit(rows, isHead){
    rows.forEach(function(row, r){
      x += '<w:tr><w:trPr>' + (isHead ? "<w:tblHeader/>" : '<w:trHeight w:val="340"/>') + "</w:trPr>";
      for(let c=0;c<cols;c++){
        const cell = row[c];
        if(!cell || !cell.colStart) continue;
        let w = 0; for(let i=0;i<cell.span;i++) w += widths[c+i];
        /* the header is boxed in; below it the horizontal rules come from each
           row's own bottom edge and the verticals from the cell to the left */
        const bd = isHead
          ? { t:"single", l:"single", b:"single", r:"single" }
          : { t:"nil", l:(c === 0 ? "single" : "nil"), b:"single", r:"single" };
        x += wxTc(w, wxP(cell, pt), {
          span: cell.span,
          vm: cell.rows > 1 ? (cell.rowStart ? "restart" : "cont") : null,
          bd: bd,
          noWrap: !isHead
        });
      }
      x += "</w:tr>";
    });
  }
  emit(head, true);
  emit(body, false);
  return x + "</w:tbl>";
}

function wxNote(text){
  const rpr = '<w:rPr><w:rFonts w:cstheme="minorHAnsi"/><w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr>';
  return '<w:p><w:pPr><w:spacing w:after="0"/>' + rpr + "</w:pPr>" +
         "<w:r>" + rpr + '<w:t xml:space="preserve">' + wxEsc(text) + "</w:t></w:r></w:p>";
}

/* ---------------- surgery on word/document.xml ---------------- */
function wxFindTable(xml){
  const scan = /<w:tbl[\s>]|<\/w:tbl>/g;
  let m, start = -1, depth = 0;
  while((m = scan.exec(xml))){
    if(m[0].charAt(1) === "/"){ if(--depth === 0) return {start:start, end:scan.lastIndex}; }
    else { if(depth === 0) start = m.index; depth++; }
  }
  return null;
}
function wxFindPara(xml, needle){
  const i = xml.indexOf(needle);
  if(i < 0) return null;
  const s = Math.max(xml.lastIndexOf("<w:p ", i), xml.lastIndexOf("<w:p>", i));
  const e = xml.indexOf("</w:p>", i);
  if(s < 0 || e < 0) return null;
  return {start:s, end:e+6};
}
function wxSplice(xml, at, text){ return xml.slice(0, at.start) + text + xml.slice(at.end); }

/* the width of the template's own text column, so the table lines up with the
   paragraphs underneath it instead of hanging into the margin */
function wxTextWidth(xml){
  const pg = /<w:pgSz\b[^>]*w:w="(\d+)"/.exec(xml);
  const mg = /<w:pgMar\b[^>]*>/.exec(xml);
  if(!pg || !mg) return 9026;
  const left  = /w:left="(\d+)"/.exec(mg[0]);
  const right = /w:right="(\d+)"/.exec(mg[0]);
  const w = +pg[1] - (left ? +left[1] : 1440) - (right ? +right[1] : 1440);
  return w > 2000 ? w : 9026;
}

/* ---------------- the ratesheet on screen ---------------- */
function wxScrape(){
  const table = document.querySelector(WORD_CFG.table);
  if(!table || !table.tHead || !table.tBodies.length || !table.tBodies[0].rows.length)
    throw new Error("there is no ratesheet on screen yet — fill in the deal first");

  const hg = wxGrid(table.tHead), bg = wxGrid(table.tBodies[0]);
  const cols = Math.max.apply(null, hg.concat(bg).map(function(r){ return r.length; }));

  function pack(grid, head){
    return grid.map(function(row){
      const out = new Array(cols).fill(null);
      for(let c=0;c<cols;c++){
        const g = row[c];
        if(!g) continue;
        const cell = wxReadCell(g.td, head);
        cell.span = g.span; cell.rows = g.rows; cell.colStart = g.colStart; cell.rowStart = g.rowStart; cell.col = c;
        out[c] = cell;
      }
      return out;
    });
  }
  const head = pack(hg, true), body = pack(bg, false);

  const footEl = WORD_CFG.foot ? document.querySelector(WORD_CFG.foot) : null;
  let notes = [];
  if(footEl){
    const divs = Array.prototype.filter.call(footEl.querySelectorAll("div"), function(d){ return !d.querySelector("div"); });
    if(divs.length) notes = divs.map(wxText);
    else notes = footEl.innerHTML.split(/<br\s*\/?>/i).map(function(part){
      const t = document.createElement("div"); t.innerHTML = part; return wxText(t);
    });
  }
  notes = notes.filter(function(t){ return t; });

  return {head:head, body:body, cols:cols, notes:notes};
}

function wxFill(xml){
  const s = wxScrape();
  const avail = wxTextWidth(xml);

  let pt = 14, widths = null;
  while(pt >= 8 && !(widths = wxColumnWidths(s.head, s.body, s.cols, avail, pt))) pt -= 0.5;
  if(!widths) throw new Error("the ratesheet has more columns than will fit on the page");

  const tbl = wxFindTable(xml);
  if(!tbl) throw new Error("no table found in that template — the rates table has to be the first table in the document");
  xml = wxSplice(xml, tbl, wxBuildTable(s.head, s.body, widths, pt));

  if(s.notes.length){
    /* The template's cash line goes first. Left until afterwards, the search
       would find the freshly written note instead and delete that, leaving the
       placeholder behind. */
    const cp = wxFindPara(xml, "cash for having your home loan");
    if(cp) xml = wxSplice(xml, cp, "");
    const rp = wxFindPara(xml, "Repayments are on");
    if(rp) xml = wxSplice(xml, rp, s.notes.map(wxNote).join(""));
  }
  return xml;
}

/* ---------------- build and hand over the file ---------------- */
async function wxBuild(){
  const parts = wxZipRead(wxB64Bytes(WX_TPL ? WX_TPL.b64 : WORD_TEMPLATE_B64));
  const doc = parts.filter(function(p){ return p.name === "word/document.xml"; })[0];
  if(!doc) throw new Error("that file is not a Word document");

  const raw = doc.method === 8 ? await wxInflate(doc.data) : doc.data;
  const out = new TextEncoder().encode(wxFill(new TextDecoder().decode(raw)));

  const packed = await wxDeflate(out);
  doc.method = packed ? 8 : 0;
  doc.data   = packed || out;
  doc.csize  = doc.data.length;
  doc.usize  = out.length;
  doc.crc    = wxCrc32(out);

  return wxZipWrite(parts);
}

/* A blob link clicked inside this frame is refused by some browsers, so the
   link is hung off the outer page whenever that page is reachable. */
function wxSave(blob, name){
  let doc = document;
  try{ if(window.top && window.top.document && window.top.document.body) doc = window.top.document; }catch(e){}
  const url = URL.createObjectURL(blob);
  const a = doc.createElement("a");
  a.href = url; a.download = name; a.style.display = "none";
  doc.body.appendChild(a); a.click();
  setTimeout(function(){ try{ a.parentNode.removeChild(a); }catch(e){} URL.revokeObjectURL(url); }, 30000);
}

/* ---------------- controls ---------------- */
(function(){
  const anchor = document.querySelector(WORD_CFG.mount);
  if(!anchor) return;
  const host = anchor.closest(".fld") || anchor;
  const wrap = document.createElement("span");
  wrap.style.cssText = "display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap";
  wrap.innerHTML =
    '<button type="button" class="' + WORD_CFG.cls + '" id="wordBtn">Download Word</button>' +
    '<button type="button" class="' + WORD_CFG.ghost + '" id="tplBtn">Word template…</button>' +
    '<button type="button" id="tplReset" hidden style="background:none;border:0;padding:0;font:inherit;font-size:11px;text-decoration:underline;cursor:pointer;color:inherit;opacity:.75"></button>' +
    '<span id="wordStatus" style="font-size:11px;opacity:.8"></span>' +
    '<input type="file" id="tplFile" accept=".docx" style="display:none">';
  if(host.parentNode) host.parentNode.insertBefore(wrap, host.nextSibling);

  const $$ = function(id){ return document.getElementById(id); };
  let timer = null;
  function say(msg){
    const el = $$("wordStatus"); if(!el) return;
    el.textContent = msg || "";
    clearTimeout(timer);
    if(msg) timer = setTimeout(function(){ el.textContent = ""; }, 6000);
  }
  function paint(){
    $$("tplBtn").textContent = WX_TPL ? "Template: " + WX_TPL.name : "Word template…";
    $$("tplBtn").title = WX_TPL
      ? "Downloads use your own template. Click to choose a different one."
      : "Downloads use the built-in " + WORD_CFG.bank + " template. Click to use your own .docx instead.";
    $$("tplReset").hidden = !WX_TPL;
    $$("tplReset").textContent = "use the built-in one";
  }
  function setTpl(t){
    WX_TPL = t;
    try{ t ? localStorage.setItem(WX_TPLKEY, JSON.stringify(t)) : localStorage.removeItem(WX_TPLKEY); }
    catch(e){ say("Loaded for now, but there is no room to remember it."); }
    paint();
  }

  $$("wordBtn").addEventListener("click", async function(){
    const b = $$("wordBtn"), was = b.textContent;
    b.disabled = true; b.textContent = "Building…";
    try{ wxSave(await wxBuild(), WX_FILE); say("Saved — " + WX_FILE); }
    catch(err){ say("Could not build it: " + err.message); }
    finally{ b.disabled = false; b.textContent = was; }
  });
  $$("tplBtn").addEventListener("click", function(){ $$("tplFile").click(); });
  $$("tplReset").addEventListener("click", function(){ setTpl(null); say("Back to the built-in " + WORD_CFG.bank + " template."); });
  $$("tplFile").addEventListener("change", function(e){
    const f = e.target.files[0]; e.target.value = "";
    if(!f) return;
    if(!/\.docx$/i.test(f.name)){ say("Please choose a .docx file."); return; }
    const fr = new FileReader();
    fr.onerror = function(){ say("That file could not be read."); };
    fr.onload = function(){
      try{
        const bytes = new Uint8Array(fr.result);
        if(!wxZipRead(bytes).some(function(p){ return p.name === "word/document.xml"; }))
          throw new Error("that file is not a Word document");
        setTpl({ name:f.name, b64:wxBytesB64(bytes) });
        say("Template set — " + f.name);
      }catch(err){ say("Could not use that template: " + err.message); }
    };
    fr.readAsArrayBuffer(f);
  });
  paint();
})();
