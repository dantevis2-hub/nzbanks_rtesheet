};

// Row colour scheme to echo the report screenshot (short=gold, 2yr=green, longer=red)
const ROW_COLOR = {
  "6 months fixed":"gold","1 year fixed":"gold",
  "2 year fixed":"green",
  "3 year fixed":"red","4 year fixed":"red","5 year fixed":"red"
};

let state = {
  deal:{ bank:"KIWIBANK", loanAmount:380000, termYears:24, propertyValue:660000, cashOffer:3420,
         firstHomeBuyer:"No", kaingaOra:"No", refinancing:"Yes", topUp:"No",
         cashManual:false, cashManualVal:0, logo:"" },
  // Cash-contribution criteria (all editable for future versions).
  cashRules:{
    matrixId:"", effective:"",
    // Standard loans (purchase & top-up)
    b1lvr:80, b1pct:0.90, b1max:0,       // LVR <= 80% -> 0.90% of loan (b1max 0 = no cap)
    b2lvr:90, b2pct:0.50, b2max:0,       // 80% < LVR <= 90% -> 0.50% of loan (else zero)
    // Refinance limited-time offer (separate, can be switched off when it expires)
    refiActive:true, refiEffective:"",
    rb1lvr:80, rb1pct:0.90, rb1max:0,
    rb2lvr:90, rb2pct:0.50, rb2max:0,    // no minimum loan for refinance
    // Shared
    fhbMinCash:5000, fhbMinLoan:250000,  // FHB: >= $250k loan gets at least $5,000, any LVR
    topupMinLoan:200000,                 // top-ups: loan must be >= $200,000 to qualify
    roundUpTo:10                         // round final cash up to nearest $10
  },
  products: DEFAULT_PRODUCTS.slice(),
  rates: JSON.parse(JSON.stringify(EXAMPLE_RATES)),
  recoTerm:"2 year fixed",
  repayType:"pi"   // "pi" = principal & interest, "io" = interest only
};

/* ---------------------------------------------------------------------------
   Helpers
--------------------------------------------------------------------------- */
const $ = s => document.querySelector(s);
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isNaN(n)?0:n; };
const money = n => "$"+Math.round(n).toLocaleString("en-NZ");
const money2 = n => "$"+n.toLocaleString("en-NZ",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = n => (n>=0?"":"") + n.toFixed(2)+"%";

function lvr(){ const p=num(state.deal.propertyValue); return p>0 ? num(state.deal.loanAmount)/p*100 : 0; }
function tier(){ return lvr()<=80 ? "special" : "standard"; }

// P&I repayment for a given period count per year
function repayment(rateAnnualPct, loan, years, periodsPerYear){
  const n = years*periodsPerYear;
  const r = (rateAnnualPct/100)/periodsPerYear;
  if(n<=0) return 0;
  if(r===0) return loan/n;
  return loan*r/(1-Math.pow(1+r,-n));
}

/* ---------------------------------------------------------------------------
   Tabs
--------------------------------------------------------------------------- */
/* single-page layout: all sections always visible */

/* ---------------------------------------------------------------------------
   Deal form wiring
--------------------------------------------------------------------------- */
function bindDeal(){
  const map = {loanAmount:"loanAmount",termYears:"termYears",propertyValue:"propertyValue",bankName:"bank"};
  Object.entries(map).forEach(([id,key])=>{
    $("#"+id).addEventListener("input",e=>{
      state.deal[key] = (key==="bank")? e.target.value : num(e.target.value);
      if(key==="bank") syncLogoText();
      refreshDeal();
    });
  });
  // thousands separators on money inputs
  ["loanAmount","propertyValue","cashManualVal"].forEach(id=>attachThousands($("#"+id)));
  CHAR_IDS.forEach(id=>{
    $("#"+id).addEventListener("change",e=>setChar(id, e.target.checked));
  });
  // manual cash override
  $("#cashManual").addEventListener("change",e=>{
    state.deal.cashManual=e.target.checked;
    $("#cashManualVal").disabled=!e.target.checked;
    refreshDeal();
  });
  $("#cashManualVal").addEventListener("input",e=>{ state.deal.cashManualVal=num(e.target.value); refreshDeal(); });

  // cash-criteria inputs (under Master Rates)
  const rb=[["cr_b1lvr","b1lvr"],["cr_b1pct","b1pct"],["cr_b1max","b1max"],
            ["cr_b2lvr","b2lvr"],["cr_b2pct","b2pct"],["cr_b2max","b2max"],
            ["cr_rb1lvr","rb1lvr"],["cr_rb1pct","rb1pct"],["cr_rb1max","rb1max"],
            ["cr_rb2lvr","rb2lvr"],["cr_rb2pct","rb2pct"],["cr_rb2max","rb2max"],
            ["cr_topupMin","topupMinLoan"],["cr_fhbCash","fhbMinCash"],
            ["cr_fhbLoan","fhbMinLoan"],["cr_round","roundUpTo"]];
  rb.forEach(([id,key])=>{ $("#"+id).addEventListener("input",e=>{ state.cashRules[key]=num(e.target.value); refreshDeal(); }); });
  $("#cr_refiActive").addEventListener("change",e=>{ state.cashRules.refiActive=e.target.checked; refreshDeal(); });
  $("#cr_refiEffective").addEventListener("input",e=>{ state.cashRules.refiEffective=e.target.value; });
  $("#cr_matrixId").addEventListener("input",e=>{ state.cashRules.matrixId=e.target.value; refreshReportMeta(); });
  $("#cr_effective").addEventListener("input",e=>{ state.cashRules.effective=e.target.value; refreshReportMeta(); });

  // logo upload
  $("#logoSlot").addEventListener("click",()=>$("#logoInput").click());
  $("#logoInput").addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ state.deal.logo=rd.result; applyLogo(); };
    rd.readAsDataURL(f);
  });
}
function refreshReportMeta(){ /* report re-reads matrixId when rendered */ }

// Money inputs: keep thousands separators while typing, preserving caret.
function attachThousands(el){
  if(!el) return;
  el.addEventListener("input",()=>{
    const raw=el.value, caret=el.selectionStart||0;
    const digitsBefore=(raw.slice(0,caret).match(/\d/g)||[]).length;
    const digits=raw.replace(/[^\d]/g,"");
    const formatted = digits==="" ? "" : Number(digits).toLocaleString("en-US");
    el.value=formatted;
    let pos=0,seen=0;
    while(pos<formatted.length && seen<digitsBefore){ if(/\d/.test(formatted[pos])) seen++; pos++; }
    try{ el.setSelectionRange(pos,pos); }catch(_){}
  });
}
function fmtThousands(v){ const n=num(v); return n? n.toLocaleString("en-US"):""; }

// Header logo: show uploaded image, else the bank wordmark.
function applyLogo(){
  const img=$("#logoImg"), txt=$("#logoText"), hint=$("#logoHint");
  if(state.deal.logo){ img.src=state.deal.logo; img.style.display="block"; txt.style.display="none"; if(hint) hint.style.display="none"; }
  else { img.removeAttribute("src"); img.style.display="none"; txt.style.display="block"; if(hint) hint.style.display="block"; syncLogoText(); }
}
function syncLogoText(){ const t=$("#logoText"); if(t) t.textContent=(state.deal.bank||"LOGO").toUpperCase(); }

// ---- Loan characteristics: mutually-exclusive scenarios with locks ----
const CHAR_IDS=["firstHomeBuyer","kaingaOra","refinancing","topUp"];
function getChars(){
  return { fhb:state.deal.firstHomeBuyer==="Yes", ko:state.deal.kaingaOra==="Yes",
           rf:state.deal.refinancing==="Yes", tu:state.deal.topUp==="Yes" };
}
function setChar(source, checked){
  let {fhb,ko,rf,tu}=getChars();
  if(source==="firstHomeBuyer") fhb=checked;
  if(source==="kaingaOra")      ko=checked;
  if(source==="refinancing")    rf=checked;
  if(source==="topUp")          tu=checked;
  // cascade based on what changed
  if(source==="refinancing" && rf){ fhb=false; ko=false; tu=false; }
  else if(source==="topUp" && tu){ fhb=false; ko=false; rf=false; }
  else if(source==="firstHomeBuyer"){ if(fhb){ rf=false; tu=false; } else { ko=false; } }
  else if(source==="kaingaOra" && ko){ fhb=true; rf=false; tu=false; }
  if(ko && !fhb) ko=false;               // Kainga Ora requires FHB
  state.deal.firstHomeBuyer=fhb?"Yes":"No";
  state.deal.kaingaOra=ko?"Yes":"No";
  state.deal.refinancing=rf?"Yes":"No";
  state.deal.topUp=tu?"Yes":"No";
  renderLoanChars();
  refreshDeal();
}
function renderLoanChars(){
  const {fhb,ko,rf,tu}=getChars();
  const on={firstHomeBuyer:fhb,kaingaOra:ko,refinancing:rf,topUp:tu};
  const disabled={
    firstHomeBuyer: rf||tu,        // locked off during refinance / top-up
    kaingaOra: !fhb,               // only available under FHB
    refinancing: fhb||ko||tu,      // locked off during FHB / top-up
    topUp: fhb||ko||rf             // locked off during FHB / refinance
  };
  CHAR_IDS.forEach(id=>{
    const cb=$("#"+id); if(!cb) return;
    cb.checked=on[id];
    cb.disabled=disabled[id];
    const row=cb.closest(".toggle-row"); if(row) row.classList.toggle("disabled",disabled[id]);
    const t=$("#"+id+"_s"); if(t){ t.textContent=on[id]?"Yes":"No"; t.classList.toggle("on",on[id]); }
  });
}

// Compute the cash contribution from the criteria + the deal.
function computeCash(){
  const d=state.deal, r=state.cashRules, loan=num(d.loanAmount), l=lvr();
  const steps=[];
  if(d.cashManual) return {amount:num(d.cashManualVal), steps:["Manual override entered."]};

  const isRefi=d.refinancing==="Yes", isTopUp=d.topUp==="Yes", isFHB=d.firstHomeBuyer==="Yes";

  let amount=0;

  if(isRefi){
    // Refinance limited-time offer (own tiers, no minimum loan).
    if(!r.refiActive){
      steps.push("Refinance limited-time offer is not active \u2014 no refinance cash.");
    } else if(l <= r.rb1lvr){
      amount = loan*r.rb1pct/100;
      steps.push(`Refinance offer: LVR ${l.toFixed(1)}% \u2264 ${r.rb1lvr}% \u2192 ${r.rb1pct}% \u00d7 ${money(loan)} = ${money2(amount)}.`);
      if(r.rb1max>0 && amount>r.rb1max){ amount=r.rb1max; steps.push(`Capped at ${money(r.rb1max)}.`); }
    } else if(l <= r.rb2lvr){
      amount = loan*r.rb2pct/100;
      steps.push(`Refinance offer: ${r.rb1lvr}% < LVR ${l.toFixed(1)}% \u2264 ${r.rb2lvr}% \u2192 ${r.rb2pct}% \u00d7 ${money(loan)} = ${money2(amount)}.`);
      if(r.rb2max>0 && amount>r.rb2max){ amount=r.rb2max; steps.push(`Capped at ${money(r.rb2max)}.`); }
    } else {
      steps.push(`Refinance offer: LVR ${l.toFixed(1)}% is above ${r.rb2lvr}% \u2192 $0.`);
    }
  } else {
    // Standard loans (purchase / top-up). Top-ups need a minimum loan.
    const isKO=d.kaingaOra==="Yes";
    const scen = isTopUp ? "Top-up" : (isFHB ? (isKO?"First home buyer (K\u0101inga Ora)":"First home buyer") : "Standard purchase");
    steps.push(`${scen} \u2014 cash is % of loan by LVR tier:`);
    let gated=false;
    if(isTopUp && loan < r.topupMinLoan){
      gated=true;
      steps.push(`Top-up below ${money(r.topupMinLoan)} minimum \u2014 does not qualify for the LVR tiers.`);
    }
    if(!gated){
      if(l <= r.b1lvr){
        amount = loan*r.b1pct/100;
        steps.push(`LVR ${l.toFixed(1)}% \u2264 ${r.b1lvr}% \u2192 ${r.b1pct}% \u00d7 ${money(loan)} = ${money2(amount)}.`);
        if(r.b1max>0 && amount>r.b1max){ amount=r.b1max; steps.push(`Capped at ${money(r.b1max)}.`); }
      } else if(l <= r.b2lvr){
        amount = loan*r.b2pct/100;
        steps.push(`${r.b1lvr}% < LVR ${l.toFixed(1)}% \u2264 ${r.b2lvr}% \u2192 ${r.b2pct}% \u00d7 ${money(loan)} = ${money2(amount)}.`);
        if(r.b2max>0 && amount>r.b2max){ amount=r.b2max; steps.push(`Capped at ${money(r.b2max)}.`); }
      } else {
        steps.push(`LVR ${l.toFixed(1)}% is above ${r.b2lvr}% \u2192 $0 from the LVR tiers.`);
      }
    }
  }

  // First home buyer floor: loan >= min gets at least the floor, regardless of LVR.
  if(isFHB && loan >= r.fhbMinLoan){
    if(amount < r.fhbMinCash){
      steps.push(`First home buyer: at least ${money(r.fhbMinCash)} (loan \u2265 ${money(r.fhbMinLoan)}, any LVR).`);
      amount = r.fhbMinCash;
    } else {
      steps.push(`First home buyer floor ${money(r.fhbMinCash)} not needed \u2014 tier amount is higher.`);
    }
  } else if(isFHB && loan < r.fhbMinLoan){
    steps.push(`FHB floor needs loan \u2265 ${money(r.fhbMinLoan)} \u2014 not applied.`);
  }

  // Round up to nearest.
  if(r.roundUpTo>0 && amount>0){
    const rounded=Math.ceil(amount/r.roundUpTo)*r.roundUpTo;
    if(rounded!==amount) steps.push(`Rounded up to nearest ${money(r.roundUpTo)} \u2192 ${money(rounded)}.`);
    amount=rounded;
  }
  return {amount, steps};
}

function refreshDeal(){
  const l = lvr();
  $("#lvrCell").textContent = Math.round(l)+"%";
  const t = tier();
  $("#tierExplain").textContent = state.deal.kaingaOra==="Yes"
    ? `K\u0101inga Ora \u2192 SPECIAL rates apply (LVR ${l.toFixed(1)}% ignored) \u2013 both Standard Rate and Your Rate come from the \u2264 80% master table`
    : (t==="special"
        ? `LVR ${l.toFixed(1)}% \u2264 80% \u2192 SPECIAL rates apply`
        : `LVR ${l.toFixed(1)}% > 80% \u2192 STANDARD rates apply`);

  const {amount,steps}=computeCash();
  state.deal.cashOffer=amount;
  $("#cashDiscountCell").textContent = money(amount);
  $("#cashBreakdown").innerHTML = `<strong>Cash contribution: ${money(amount)}</strong><br>`+steps.join("<br>");
  if(typeof renderReport==="function" && $("#reportArea")) renderReport();
}

/* ---------------------------------------------------------------------------
   Master rate tables

function renderRateTables(){
  const host = $("#rateTables");
  host.innerHTML="";
  [["special","Special \u2013 LVR \u2264 80%"],["standard","Standard \u2013 LVR > 80%"]].forEach(([tierKey,label])=>{
    const block=document.createElement("div");

    block.innerHTML = `<div class="cap">Interest rate % p.a.</div>
      <div class="tier-name">${label}</div>
      <table class="rates">
        <thead><tr><th style="text-align:left">Product</th><th>Carded</th><th>Matrix</th></tr></thead>
        <tbody></tbody></table>`;
    const tb=block.querySelector("tbody");
    state.products.forEach(p=>{
      if(!state.rates[tierKey][p]) state.rates[tierKey][p]={carded:0,matrix:0};
      const row=state.rates[tierKey][p];
      const tr=document.createElement("tr");
      tr.innerHTML=`<td class="prod">${p}</td>
        <td class="rate"><input inputmode="decimal" value="${row.carded.toFixed(2)}"></td>
        <td class="rate"><input inputmode="decimal" value="${row.matrix.toFixed(2)}"></td>`;
      const [ci,mi]=tr.querySelectorAll("input");
      ci.addEventListener("input",e=>{ row.carded=num(e.target.value); renderReport(); });
      mi.addEventListener("input",e=>{ row.matrix=num(e.target.value); renderReport(); });
      tb.appendChild(tr);
    });
    host.appendChild(block);
  });
}

$("#addProduct").addEventListener("click",()=>{

/* ---------------------------------------------------------------------------
   PDF upload + extraction
--------------------------------------------------------------------------- */
if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }
const drop=$("#drop"), pdfInput=$("#pdfInput");
drop.addEventListener("click",()=>pdfInput.click());
drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("drag");});
drop.addEventListener("dragleave",()=>drop.classList.remove("drag"));
drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("drag");if(e.dataTransfer.files[0])handlePdf(e.dataTransfer.files[0]);});
pdfInput.addEventListener("change",e=>{if(e.target.files[0])handlePdf(e.target.files[0]);});

async function handlePdf(file){
  $("#pdfStatus").innerHTML=`<div class="flash">Reading <strong>${file.name}</strong>\u2026</div>`;
  try{
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    let text="";
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const c=await page.getTextContent();
      // reconstruct lines: cluster items by y (with tolerance), sort left-to-right
      const items=c.items.map(it=>({x:it.transform[4], y:it.transform[5], s:it.str}))
                         .filter(it=>it.s.trim()!=="");
      items.sort((a,b)=> b.y-a.y || a.x-b.x);
      const rows=[];
      for(const it of items){
        const last=rows[rows.length-1];
        if(last && Math.abs(last.y-it.y)<=3){ last.items.push(it); if(it.y<last.y) last.y=it.y; }
        else rows.push({y:it.y, items:[it]});
      }
      rows.forEach(r=>{ r.items.sort((a,b)=>a.x-b.x); text+=r.items.map(i=>i.s).join(" ")+"\n"; });
      text+="\n";
    }
    $("#extractBox").classList.remove("hidden");
    $("#extractText").value=text;
    $("#pdfStatus").innerHTML=`<div class="flash">Extracted ${pdf.numPages} page(s) from <strong>${file.name}</strong>. Review the detected rates below, then apply. Cash-offer rules were read too \u2014 check them above.</div>`;
    detectRates(text);
    parseCashRules(text);
  }catch(err){
    $("#pdfStatus").innerHTML=`<div class="flash">Couldn't read that PDF (${err.message}). It may be a scanned image with no text layer \u2014 enter the rates manually below.</div>`;
  }
}
$("#reparseBtn").addEventListener("click",()=>{ detectRates($("#extractText").value); parseCashRules($("#extractText").value); });

// Read the cash-contribution criteria from the ratesheet text.
function parseCashRules(text){
  const r=state.cashRules, T=text.replace(/\s+/g," ");
  const kNum = s => { let n=parseFloat(s.replace(/[,$]/g,"")); if(/k/i.test(s)) n*=1000; return n; };
  let m;
  // NOTE: the cash-contribution basis is fixed at 0.90% / 0.50% and is NOT scraped
  // from the PDF (a ratesheet is full of other % values), so it can never become
  // something like 0.85%. Edit those percentages manually if a future rate changes.
  // LVR thresholds
  if(m=T.match(/[\u2264<]=?\s*(\d{1,3})\s*%\s*lvr/i)) r.b1lvr=parseFloat(m[1]);
  if(m=T.match(/(?:not\s*exceed|max(?:imum)?)\s*\$?\s*([\d.,]+\s*k?)/i)) r.b1max=kNum(m[1]);
  if(m=T.match(/(?:more than|above|>)\s*\d{1,3}\s*%?\s*(?:to|-|\u2013)\s*(\d{1,3})\s*%/i)) r.b2lvr=parseFloat(m[1]);
  const maxes=[...T.matchAll(/max(?:imum)?\s*(?:is\s*)?\$?\s*([\d.,]+\s*k?)/ig)].map(x=>kNum(x[1]));
  if(maxes.length) r.b2max=maxes[maxes.length-1];
  // Top-up minimum loan
  if(m=T.match(/top-?up\s*(?:amount)?[^$]*\$?\s*([\d.,]+\s*k?)/i)) r.topupMinLoan=kNum(m[1]);
  // FHB
  if(m=T.match(/cash\s*contribution\s*of\s*\$?\s*([\d.,]+\s*k?)/i)) r.fhbMinCash=kNum(m[1]);
  if(m=T.match(/borrowing\s*\$?\s*([\d.,]+\s*k?)\s*or\s*more/i)) r.fhbMinLoan=kNum(m[1]);
  // Rounding
  if(m=T.match(/nearest\s*\$?\s*(\d+)/i)) r.roundUpTo=parseFloat(m[1]);
  // IDs
  if(m=T.match(/matrix\s*id[:\s]*([A-Z0-9\-]+)/i)) r.matrixId=m[1];
  if(m=T.match(/effective\s+([A-Za-z0-9 ]+?\d{4}(?:\s*to\s*[A-Za-z0-9 ]+?\d{4})?)/i)) r.effective=m[1].trim();
  syncCashRuleInputs();
  refreshDeal();
}

// Push cashRules values into the editable inputs.
function syncCashRuleInputs(){
  const r=state.cashRules;
  const set=(id,v)=>{ const el=$("#"+id); if(el) el.value=v; };
  set("cr_matrixId",r.matrixId); set("cr_effective",r.effective);
  set("cr_b1lvr",r.b1lvr); set("cr_b1pct",r.b1pct); set("cr_b1max",r.b1max||"");
  set("cr_b2lvr",r.b2lvr); set("cr_b2pct",r.b2pct); set("cr_b2max",r.b2max||"");
  set("cr_rb1lvr",r.rb1lvr); set("cr_rb1pct",r.rb1pct); set("cr_rb1max",r.rb1max||"");
  set("cr_rb2lvr",r.rb2lvr); set("cr_rb2pct",r.rb2pct); set("cr_rb2max",r.rb2max||"");
  set("cr_refiEffective",r.refiEffective||"");
  set("cr_topupMin",r.topupMinLoan); set("cr_fhbCash",r.fhbMinCash);
  set("cr_fhbLoan",r.fhbMinLoan); set("cr_round",r.roundUpTo);
  const ra=$("#cr_refiActive"); if(ra) ra.checked=r.refiActive!==false;
}

// Find each product line and grab EVERY rate on it, so a sheet that lists
// both the <=80% and >80% bands on one line captures all of them.
function extractRates(line){
  return (line.match(/\d{1,2}\.\d{1,2}/g)||[]).map(Number).filter(v=>v>0 && v<=20);
}
function detectRates(text){
  const lines=text.split(/\n/);
  const found=[];
  let maxVals=0;
  state.products.forEach(p=>{
    let idx=-1;
    for(let i=0;i<lines.length;i++){ if(matchProduct(lines[i].toLowerCase(),p)){ idx=i; break; } }
    let vals=[], raw="";
    if(idx>=0){
      raw=lines[idx];
      vals=extractRates(lines[idx]);
      // label and numbers may have split onto the next line; borrow it only if
      // that next line isn't itself another product's row
      if(vals.length===0 && idx+1<lines.length){
        const nextLow=lines[idx+1].toLowerCase();
        const nextIsProduct=state.products.some(q=>matchProduct(nextLow,q));
        const nv=extractRates(lines[idx+1]);
        if(nv.length && !nextIsProduct){ vals=nv; raw=lines[idx]+" \u21b3 "+lines[idx+1]; }
      }
    }
    maxVals=Math.max(maxVals,vals.length);
    found.push({product:p, vals, raw});
  });
  renderDetected(found, Math.max(maxVals,2));
}
function matchProduct(low,p){
  p=p.toLowerCase();
  if(p==="__none__") return false;
  if(/6\s*month/.test(p)) return /\b6\s*month/.test(low);
  if(p.includes("offset")) return low.includes("offset");
  if(p.includes("revolving")) return low.includes("revolving");
  if(p.includes("variable")) return low.includes("variable");
  const m=p.match(/(\d+)\s*year/);
  if(m) return new RegExp("\\b"+m[1]+"\\s*(?:years?|yea|yr)").test(low) && /fix/.test(low);
  return low.includes(p);
}

const DEST_OPTS=[["","ignore"],["sp-carded","\u2264 80% \u00b7 Carded"],["sp-matrix","\u2264 80% \u00b7 Matrix"],
                ["st-carded","> 80% \u00b7 Carded"],["st-matrix","> 80% \u00b7 Matrix"]];

// Guess where each detected column belongs based on how many rates each line has.
function defaultMap(i,maxVals){
  if(maxVals>=4) return ["sp-carded","sp-matrix","st-carded","st-matrix"][i]||"";
  if(maxVals===3) return ["sp-carded","sp-matrix","st-matrix"][i]||"";
  return ["sp-carded","sp-matrix"][i]||"";
}

function renderDetected(found,maxVals){
  const box=$("#detected");
  let colHead="";
  for(let i=0;i<maxVals;i++){
    colHead+=`<th><select class="mapsel" data-col="${i}">`+
      DEST_OPTS.map(([v,l])=>`<option value="${v}">${l}</option>`).join("")+`</select></th>`;
  }
  const rows=found.map((f,ri)=>{
    let cells="";
    for(let i=0;i<maxVals;i++){
      const v=(f.vals[i]!=null)?f.vals[i]:"";
      cells+=`<td><input data-r="${ri}" data-c="${i}" value="${v}" style="width:64px"></td>`;
    }
    return `<tr><td>${f.product}</td>${cells}<td style="color:#888;font-size:11px">${(f.raw||"").slice(0,46)}</td></tr>`;
  }).join("");

  box.innerHTML=`<div class="flash">Tell each column where it belongs, then apply. One ratesheet can fill both the \u2264 80% and > 80% tables in a single pass. Blank/wrong cells can be edited first.</div>
    <div class="detected"><table>
      <thead><tr><th>Product</th>${colHead}<th>Matched line</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="row-actions"><button class="btn sm" id="applyDetected">Apply mapping to master rates</button></div>`;

  box.querySelectorAll(".mapsel").forEach(sel=>{ sel.value=defaultMap(+sel.dataset.col,maxVals); });
  box.querySelectorAll("input").forEach(inp=>inp.addEventListener("input",e=>{
    found[+e.target.dataset.r].vals[+e.target.dataset.c]=e.target.value;
  }));

  $("#applyDetected").addEventListener("click",()=>{
    const cols=[...box.querySelectorAll(".mapsel")].map(s=>({col:+s.dataset.col,dest:s.value}));
    let count=0;
    found.forEach(f=>{
      ["special","standard"].forEach(t=>{ if(!state.rates[t][f.product]) state.rates[t][f.product]={carded:0,matrix:0}; });
      cols.forEach(({col,dest})=>{
        if(!dest) return;
        const v=f.vals[col];
        if(v===""||v==null||isNaN(num(v))) return;
        const tk=dest.startsWith("sp")?"special":"standard";
        const field=dest.endsWith("carded")?"carded":"matrix";
        state.rates[tk][f.product][field]=num(v);
        count++;
      });
    });
    renderRateTables();
    $("#pdfStatus").innerHTML=`<div class="flash">Applied ${count} rate value(s). Both the \u2264 80% and > 80% tables below now reflect the sheet \u2014 please review.</div>`;
  });
}

/* ---------------------------------------------------------------------------
   Report
--------------------------------------------------------------------------- */
function fillRecoDropdown(){
  const sel=$("#recoTerm");
  sel.innerHTML=`<option value="">(none)</option>`+state.products.map(p=>`<option value="${p}">${p}</option>`).join("");
  sel.value=state.recoTerm;
  sel.onchange=e=>{ state.recoTerm=e.target.value; renderReport(); };
}

function renderReport(){
  fillRecoDropdown();
  const d=state.deal, t=tier(), l=lvr();
  const loan=num(d.loanAmount), years=num(d.termYears);
  const io = state.repayType==="io";
  const rt=$("#repayType"); if(rt) rt.value=state.repayType;
  const periodRepay = (rate,periods)=> io ? loan*(rate/100)/periods : repayment(rate,loan,years,periods);

  // Rate mapping:
  //  Kainga Ora  -> BOTH columns are read from the Special (LVR <= 80%) master table,
  //                 because a Kainga Ora loan is priced at special rates whatever the LVR:
  //                   Standard Rate = Special Carded, Your Rate = Special Matrix
  //  Otherwise   -> Standard Rate = Standard Carded (col 3), always
  //                 Your Rate     = LVR <= 80%: Special Matrix (col 2)
  //                                 LVR >  80%: Standard Matrix (col 4)
  const hideKO = d.kaingaOra==="Yes";
  const tierKey = hideKO ? "special" : t;            // drives Your Rate (matrix)
  const stdKey  = hideKO ? "special" : "standard";   // drives Standard Rate (carded)
  const otherKey = stdKey==="special" ? "standard" : "special";
  let rows="";
  state.products.forEach(p=>{
    // Kainga Ora: drop Offset Home Loan and Revolving Credit rows
    if(hideKO && /offset|revolving/i.test(p)) return;
    // Column 3 - carded rate from the master table that actually applies to this deal.
    // If that cell was never filled in, fall back to the other table rather than
    // printing 0.00% or a leftover example figure.
    let std = state.rates[stdKey][p]?.carded ?? 0;
    if(!std) std = state.rates[otherKey][p]?.carded ?? 0;
    let your = state.rates[tierKey][p]?.matrix ?? 0;
    if(!your) your = std;
    const disc = your - std;
    const w  = periodRepay(your,52);
    const fn = periodRepay(your,26);
    const m  = periodRepay(your,12);
    const colorClass = ROW_COLOR[p] || "";
    const reco = (p===state.recoTerm) ? "reco" : "";
    rows+=`<tr class="${colorClass} ${reco}">
      <td class="term">${p}</td>
      <td>${std.toFixed(2)}%</td>
      <td>${disc>0?"+":""}${disc.toFixed(2)}%</td>
      <td>${your.toFixed(2)}%</td>
      <td>${money(w)}</td>
      <td>${money(fn)}</td>
      <td>${money(m)}</td>
    </tr>`;
  });

  const cashLine = num(d.cashOffer)>0
    ? `*${d.bank||"The bank"} will also give you ${money(d.cashOffer)} cash for having your home loan with them.` : "";
  const flags=[];
  if(d.firstHomeBuyer==="Yes")flags.push("First Home Buyer");
  if(d.kaingaOra==="Yes")flags.push("K\u0101inga Ora");
  if(d.refinancing==="Yes")flags.push("Refinancing");
  if(d.topUp==="Yes")flags.push("Top-up");

  const cr=state.cashRules;
  const matrixLine = (cr.matrixId||cr.effective)
    ? `<div style="font-size:12px;color:var(--brand-dark);font-weight:700;margin-bottom:6px">Matrix ID: ${cr.matrixId||"\u2014"}${cr.effective?` \u2013 Effective ${cr.effective}`:""}</div>` : "";

  const logoBlock = d.logo ? `<img src="${d.logo}" alt="" style="max-height:44px;max-width:180px;object-fit:contain">` : "";

  $("#reportArea").innerHTML=`
    <div class="rpt-sheet">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;max-width:620px">
      <div>${matrixLine}</div>
      <div>${logoBlock}</div>
    </div>
    <div class="rpt-head">
      <div class="bank">${d.bank||"Bank"} <span class="tier-badge">${hideKO?"SPECIAL (K\u0101inga Ora)":(t==="special"?"SPECIAL (LVR \u2264 80%)":"STANDARD (LVR > 80%)")}</span></div>
      <div class="meta">
        Loan ${money(loan)} &nbsp;\u2022&nbsp; Property ${money(num(d.propertyValue))} &nbsp;\u2022&nbsp; LVR ${l.toFixed(1)}%<br>
        Term ${years} yrs${flags.length?` &nbsp;\u2022&nbsp; ${flags.join(", ")}`:""}
      </div>
    </div>
    <table class="report">
      <colgroup>
        <col style="width:140px"><col style="width:80px"><col style="width:80px"><col style="width:80px">
        <col style="width:80px"><col style="width:76px"><col style="width:84px">
      </colgroup>
      <thead>
        <tr>
          <th rowspan="2" style="text-align:left;padding-left:8px">Term</th>
          <th rowspan="2">Standard<br>Rate</th>
          <th rowspan="2">Your<br>Discount</th>
          <th rowspan="2">Your<br>Rate</th>
          <th colspan="3">Repayments*</th>
        </tr>
        <tr><th>weekly</th><th>f/n</th><th>monthly</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="rpt-foot">
      *Repayments are ${io?`Interest Only`:`on a P&amp;I basis over ${years} years`} \u2013 Loan of ${money(loan)}<br>
      ${cashLine}
    </div>
    </div>`;
}

$("#copyTableBtn") && $("#copyTableBtn").addEventListener("click",()=>{
  const sheet=$("#reportArea").querySelector(".rpt-sheet");
  if(!sheet) return;
  const range=document.createRange(); range.selectNodeContents(sheet);
  const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  sel.removeAllRanges();
  const b=$("#copyTableBtn"); const old=b.textContent;
  b.textContent = ok ? "Copied \u2713" : "Press Ctrl/Cmd+C";
  setTimeout(()=>b.textContent=old, 1600);
});

/* ---------------------------------------------------------------------------
   Persistence: window.storage (if available) + JSON export/import
--------------------------------------------------------------------------- */
async function saveState(){
  try{ if(window.storage) await window.storage.set("ratesheet_state", JSON.stringify(state)); }catch(e){}
}
async function loadState(){
  try{
    if(window.storage){
      const r=await window.storage.get("ratesheet_state");
      if(r&&r.value){ state=JSON.parse(r.value); hydrateForm(); }
    }
  }catch(e){}
}
function hydrateForm(){
  // migrate older saved state to the current cashRules shape
  if(!state.cashRules || state.cashRules.b1pct===undefined){
    const old=state.cashRules||{};
    state.cashRules={ matrixId:old.matrixId||"", effective:old.effective||"",
      b1lvr:80,b1pct:0.90,b1max:0, b2lvr:90,b2pct:0.50,b2max:0,
      refiActive:true, refiEffective:"", rb1lvr:80,rb1pct:0.90,rb1max:0, rb2lvr:90,rb2pct:0.50,rb2max:0,
      fhbMinCash:5000, fhbMinLoan:250000, topupMinLoan:200000, roundUpTo:10 };
  }
  delete state.cashRules.refiB1only;
  if(!state.repayType) state.repayType="pi";
  // seed refinance fields if an older tiered state lacked them (default to standard tiers)
  const cr=state.cashRules;
  if(cr.rb1pct===undefined){
    cr.refiActive=cr.refiActive!==false; cr.refiEffective=cr.refiEffective||"";
    cr.rb1lvr=cr.b1lvr; cr.rb1pct=cr.b1pct; cr.rb1max=cr.b1max||0;
    cr.rb2lvr=cr.b2lvr; cr.rb2pct=cr.b2pct; cr.rb2max=cr.b2max||0;
  }
  const d=state.deal;
  $("#loanAmount").value=fmtThousands(d.loanAmount); $("#termYears").value=d.termYears;
  $("#propertyValue").value=fmtThousands(d.propertyValue); $("#bankName").value=d.bank;
  $("#cashManual").checked=!!d.cashManual;
  $("#cashManualVal").disabled=!d.cashManual;
  $("#cashManualVal").value=d.cashManualVal?fmtThousands(d.cashManualVal):"";
  renderLoanChars();
  applyLogo();
  syncCashRuleInputs();
  refreshDeal(); renderRateTables();
}
setInterval(saveState, 4000);

$("#exportBtn").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(state.deal.bank||"ratesheet")+"-config.json";
  a.click();
});
$("#importInput").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ state=JSON.parse(rd.result); hydrateForm(); alert("Backup loaded."); }catch(err){ alert("That file isn't a valid backup."); } };
  rd.readAsText(f);
});

/* ==========================================================================
   WORD EXPORT — drops the ratesheet on screen into this bank's Word template
   --------------------------------------------------------------------------
   The template is a real .docx carried inside this file as base64. A .docx is
   a zip of XML parts, so the export opens that zip, rewrites only the pieces
   that change inside word/document.xml, and zips it back up. Every other part
   — styles, fonts, headers, the whole bottom half of the letter — is copied
   through byte for byte, so what lands in the client's inbox is the adviser's
   own template with today's numbers in it.

   What gets replaced:
     1. the rates table at the top        -> rebuilt from the table on screen
     2. the "*Repayments are on ..." line -> every note under the ratesheet
     3. the "* ... cash for having your home loan ..." line -> removed, because
        the notes in (2) already carry the bank's own cash wording
   Everything below those notes is left exactly as the adviser wrote it.

   The table is read straight off the screen rather than out of this bank's
   internals, so the Word table always says what the adviser is looking at —
   same rows, same order, same traffic-light colours, same "Your Discount" or
   "LEM" heading — and one engine serves every bank in the book.
   ========================================================================== */

const WX_FILE   = "Loan Structure - Ratesheet - " + WORD_CFG.bank + ".docx";
const WX_TPLKEY = "wordtpl_" + WORD_CFG.id + "_v1";
let   WX_TPL    = null;   /* {name,b64} once the adviser supplies their own */

try{ WX_TPL = JSON.parse(localStorage.getItem(WX_TPLKEY) || "null"); }catch(e){ WX_TPL = null; }

/* ---------------- bytes ---------------- */
function wxB64Bytes(b64){
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return u;
}
function wxBytesB64(u8){
  let s=""; const C=0x8000;
  for(let i=0;i<u8.length;i+=C) s += String.fromCharCode.apply(null, u8.subarray(i,i+C));
  return btoa(s);
}

let WX_CRCT = null;
function wxCrc32(u8){
  if(!WX_CRCT){
    WX_CRCT = new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); WX_CRCT[n]=c>>>0; }
  }
  let c = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = WX_CRCT[(c ^ u8[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0;
}

/* Raw deflate through the browser's own Compression Streams — no library.
   A browser too old to compress simply stores the part instead, which Word
   reads perfectly well; the file is just a little larger. */
async function wxInflate(u8){
  if(typeof DecompressionStream !== "function")
    throw new Error("this browser cannot read a compressed Word template — try Chrome, Edge, or Safari 16.4 or newer");
  const st = new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function wxDeflate(u8){
  if(typeof CompressionStream !== "function") return null;
  const st = new Blob([u8]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(st).arrayBuffer());
}

/* ---------------- zip ---------------- */
function wxZipRead(buf){
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for(let i=buf.length-22; i>=0 && i > buf.length-22-65557; i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd < 0) throw new Error("that file is not a Word document");
  const count = dv.getUint16(eocd+10,true);
  let p = dv.getUint32(eocd+16,true);
  const dec = new TextDecoder(), out = [];
  for(let i=0;i<count;i++){
    if(dv.getUint32(p,true) !== 0x02014b50) throw new Error("that Word document is damaged");
    const method=dv.getUint16(p+10,true), mtime=dv.getUint16(p+12,true), mdate=dv.getUint16(p+14,true),
          crc=dv.getUint32(p+16,true), csize=dv.getUint32(p+20,true), usize=dv.getUint32(p+24,true),
          nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true),
          lho=dv.getUint32(p+42,true);
    const name = dec.decode(buf.subarray(p+46, p+46+nlen));
    const dstart = lho + 30 + dv.getUint16(lho+26,true) + dv.getUint16(lho+28,true);
    out.push({ name, method, crc, csize, usize, mtime, mdate, data: buf.subarray(dstart, dstart+csize) });
    p += 46 + nlen + elen + clen;
  }
  return out;
}

function wxZipWrite(entries){
  const enc = new TextEncoder(), body = [], dir = [];
  let off = 0;
  entries.forEach(e => {
    const nm = enc.encode(e.name);
    const lh = new Uint8Array(30 + nm.length), lv = new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0,true);
    lv.setUint16(8,e.method,true);   lv.setUint16(10,e.mtime,true); lv.setUint16(12,e.mdate,true);
    lv.setUint32(14,e.crc,true);     lv.setUint32(18,e.csize,true); lv.setUint32(22,e.usize,true);
    lv.setUint16(26,nm.length,true); lv.setUint16(28,0,true);
    lh.set(nm,30);
    body.push(lh, e.data);

    const ch = new Uint8Array(46 + nm.length), cv = new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true); cv.setUint16(8,0,true);
    cv.setUint16(10,e.method,true);  cv.setUint16(12,e.mtime,true); cv.setUint16(14,e.mdate,true);
    cv.setUint32(16,e.crc,true);     cv.setUint32(20,e.csize,true); cv.setUint32(24,e.usize,true);
    cv.setUint16(28,nm.length,true); cv.setUint32(42,off,true);
    ch.set(nm,46);
    dir.push(ch);
    off += lh.length + e.data.length;
  });
  const dirSize = dir.reduce((a,b)=>a+b.length,0);
  const eo = new Uint8Array(22), ev = new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(8,entries.length,true); ev.setUint16(10,entries.length,true);
  ev.setUint32(12,dirSize,true);       ev.setUint32(16,off,true);
  return new Blob(body.concat(dir,[eo]),
    {type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

/* ---------------- reading the table off the screen ---------------- */
function wxText(el){
  const c = el.cloneNode(true);
  Array.prototype.forEach.call(c.querySelectorAll("br"), function(b){ b.parentNode.replaceChild(document.createTextNode(" "), b); });
  return (c.textContent || "").replace(/\s+/g," ").trim();
}
/* On screen some banks reverse their heading strip out of a coloured bar. The
   Word table keeps the template's plain white look, so anything close to white
   would vanish — those cells come back as black instead. */
function wxHex(css){
  const m = /rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(css || "");
  if(!m) return "000000";
  const r = +m[1], g = +m[2], b = +m[3];
  if(0.299*r + 0.587*g + 0.114*b > 215) return "000000";
  return [r,g,b].map(function(v){ return ("0" + v.toString(16)).slice(-2); }).join("").toUpperCase();
}

/* Turns a <thead>/<tbody> into a rectangular grid so rowspan and colspan can
   be replayed as Word's vMerge and gridSpan. */
function wxGrid(section){
  const grid = [];
  Array.prototype.forEach.call(section.rows, function(tr, r){
    grid[r] = grid[r] || [];
    let c = 0;
    Array.prototype.forEach.call(tr.cells, function(td){
      while(grid[r][c]) c++;
      const cs = td.colSpan || 1, rs = td.rowSpan || 1;
      for(let i=0;i<rs;i++){
        grid[r+i] = grid[r+i] || [];
        for(let j=0;j<cs;j++)
          grid[r+i][c+j] = { td:td, span:cs, rows:rs, colStart:(j===0), rowStart:(i===0) };
      }
      c += cs;
    });
  });
  return grid;
}

function wxReadCell(td, head){
  const cs = getComputedStyle(td);
  return {
    text:  wxText(td),
    color: head ? "000000" : wxHex(cs.color),
    bold:  head || parseInt(cs.fontWeight,10) >= 600 || cs.fontWeight === "bold",
    align: cs.textAlign === "right" ? "right" : (cs.textAlign === "left" || cs.textAlign === "start") ? "left" : "center"
  };
}

/* ---------------- column widths, so every row stays on one line ----------
   Data cells are measured at full length and never allowed to wrap. Header
   cells may still wrap onto the second deck, exactly as the template does, so
   a long heading never squeezes the rows. If even the unwrappable content is
   wider than the page, the whole table steps down a point size until it fits
   rather than breaking a row in two. */
let WX_MEAS = null;
function wxWidth(text, bold, pt){
  if(!WX_MEAS) WX_MEAS = document.createElement("canvas").getContext("2d");
  WX_MEAS.font = (bold ? "bold " : "") + (pt * 4 / 3) + 'px Calibri, Carlito, Candara, "Segoe UI", Arial, sans-serif';
  return WX_MEAS.measureText(text).width * 15;          /* px -> twips */
}
const WX_PAD = 200;                                      /* cell margins + a little air */

function wxColumnWidths(head, body, cols, avail, pt){
  const min = new Array(cols).fill(240), want = new Array(cols).fill(240);
  /* A cell that spans columns only has to fit across the columns it covers,
     so its width is claimed once, from the column it starts in. */
  function claim(arr, from, span, need){
    span = Math.min(span, cols - from);
    if(span < 1) return;
    let have = 0;
    for(let i=0;i<span;i++) have += arr[from+i];
    if(need <= have) return;
    const extra = (need - have) / span;
    for(let i=0;i<span;i++) arr[from+i] += extra;
  }
  body.forEach(function(row){
    row.forEach(function(c){
      if(!c || !c.colStart) return;
      const w = wxWidth(c.text, c.bold, pt) + WX_PAD;
      claim(min, c.col, c.span, w); claim(want, c.col, c.span, w);
    });
  });
  head.forEach(function(row){
    row.forEach(function(c){
      if(!c || !c.colStart) return;
      const longest = c.text.split(" ").reduce(function(a,w){ return Math.max(a, wxWidth(w, c.bold, pt)); }, 0);
      claim(min,  c.col, c.span, longest + WX_PAD);
      claim(want, c.col, c.span, wxWidth(c.text, c.bold, pt) + WX_PAD);
    });
  });

  const sumMin = min.reduce(function(a,b){ return a+b; }, 0);
  if(sumMin > avail) return null;                        /* caller drops a point size */

  const sumWant = want.reduce(function(a,b){ return a+b; }, 0);
  let out;
  if(sumWant <= avail){
    const slack = (avail - sumWant) / cols;
    out = want.map(function(w){ return w + slack; });
  }else{
    const room = avail - sumMin, hunger = sumWant - sumMin;
    out = min.map(function(w,i){ return w + room * ((want[i]-w) / hunger); });
  }
  out = out.map(function(w){ return Math.round(w); });
  out[cols-1] += avail - out.reduce(function(a,b){ return a+b; }, 0);
  return out;
}

/* ---------------- WordprocessingML ---------------- */
function wxEsc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function wxBd(tag, kind){
  return kind === "nil"
    ? '<w:' + tag + ' w:val="nil"/>'
    : '<w:' + tag + ' w:val="single" w:sz="8" w:space="0" w:color="auto"/>';
}
function wxP(c, pt){
  const sz = Math.round(pt * 2);
  const rpr = '<w:rFonts w:ascii="Calibri" w:eastAsia="Times New Roman" w:hAnsi="Calibri" w:cs="Calibri"/>' +
              (c.bold ? "<w:b/><w:bCs/>" : "") +
              '<w:color w:val="' + c.color + '"/>' +
              '<w:sz w:val="' + sz + '"/><w:szCs w:val="' + sz + '"/><w:lang w:eastAsia="en-GB"/>';
  const jc = c.align === "left" ? "" : '<w:jc w:val="' + (c.align === "right" ? "right" : "center") + '"/>';
  return '<w:p><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/>' + jc +
         "<w:rPr>" + rpr + "</w:rPr></w:pPr>" +
         (c.text === "" ? "" : "<w:r><w:rPr>" + rpr + '</w:rPr><w:t xml:space="preserve">' + wxEsc(c.text) + "</w:t></w:r>") +
         "</w:p>";
}
function wxTc(w, inner, o){
  const b = o.bd;
  return '<w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/>' +
    (o.span > 1 ? '<w:gridSpan w:val="' + o.span + '"/>' : "") +
    (o.vm === "restart" ? '<w:vMerge w:val="restart"/>' : o.vm === "cont" ? "<w:vMerge/>" : "") +
    "<w:tcBorders>" + wxBd("top",b.t) + wxBd("left",b.l) + wxBd("bottom",b.b) + wxBd("right",b.r) + "</w:tcBorders>" +
    (o.noWrap ? "<w:noWrap/>" : "") +
    '<w:vAlign w:val="center"/></w:tcPr>' + inner + "</w:tc>";
}

function wxBuildTable(head, body, widths, pt){
  const cols = widths.length;
  let x = '<w:tbl><w:tblPr><w:tblW w:w="' + widths.reduce(function(a,b){return a+b;},0) + '" w:type="dxa"/>' +
          '<w:tblCellMar><w:left w:w="85" w:type="dxa"/><w:right w:w="85" w:type="dxa"/></w:tblCellMar>' +
          '<w:tblLook w:val="04A0" w:firstRow="1" w:lastRow="0" w:firstColumn="1" w:lastColumn="0" w:noHBand="0" w:noVBand="1"/>' +
          "</w:tblPr><w:tblGrid>" + widths.map(function(w){ return '<w:gridCol w:w="' + w + '"/>'; }).join("") + "</w:tblGrid>";

  function emit(rows, isHead){
    rows.forEach(function(row, r){
      x += '<w:tr><w:trPr>' + (isHead ? "<w:tblHeader/>" : '<w:trHeight w:val="340"/>') + "</w:trPr>";
      for(let c=0;c<cols;c++){
        const cell = row[c];
        if(!cell || !cell.colStart) continue;
        let w = 0; for(let i=0;i<cell.span;i++) w += widths[c+i];
        /* the header is boxed in; below it the horizontal rules come from each
           row's own bottom edge and the verticals from the cell to the left */
        const bd = isHead
          ? { t:"single", l:"single", b:"single", r:"single" }
          : { t:"nil", l:(c === 0 ? "single" : "nil"), b:"single", r:"single" };
        x += wxTc(w, wxP(cell, pt), {
          span: cell.span,
          vm: cell.rows > 1 ? (cell.rowStart ? "restart" : "cont") : null,
          bd: bd,
          noWrap: !isHead
        });
      }
      x += "</w:tr>";
    });
  }
  emit(head, true);
  emit(body, false);
  return x + "</w:tbl>";
}

function wxNote(text){
  const rpr = '<w:rPr><w:rFonts w:cstheme="minorHAnsi"/><w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr>';
  return '<w:p><w:pPr><w:spacing w:after="0"/>' + rpr + "</w:pPr>" +
         "<w:r>" + rpr + '<w:t xml:space="preserve">' + wxEsc(text) + "</w:t></w:r></w:p>";
}

/* ---------------- surgery on word/document.xml ---------------- */
function wxFindTable(xml){
  const scan = /<w:tbl[\s>]|<\/w:tbl>/g;
  let m, start = -1, depth = 0;
  while((m = scan.exec(xml))){
    if(m[0].charAt(1) === "/"){ if(--depth === 0) return {start:start, end:scan.lastIndex}; }
    else { if(depth === 0) start = m.index; depth++; }
  }
  return null;
}
function wxFindPara(xml, needle){
  const i = xml.indexOf(needle);
  if(i < 0) return null;
  const s = Math.max(xml.lastIndexOf("<w:p ", i), xml.lastIndexOf("<w:p>", i));
  const e = xml.indexOf("</w:p>", i);
  if(s < 0 || e < 0) return null;
  return {start:s, end:e+6};
}
function wxSplice(xml, at, text){ return xml.slice(0, at.start) + text + xml.slice(at.end); }

/* the width of the template's own text column, so the table lines up with the
   paragraphs underneath it instead of hanging into the margin */
function wxTextWidth(xml){
  const pg = /<w:pgSz\b[^>]*w:w="(\d+)"/.exec(xml);
  const mg = /<w:pgMar\b[^>]*>/.exec(xml);
  if(!pg || !mg) return 9026;
  const left  = /w:left="(\d+)"/.exec(mg[0]);
  const right = /w:right="(\d+)"/.exec(mg[0]);
  const w = +pg[1] - (left ? +left[1] : 1440) - (right ? +right[1] : 1440);
  return w > 2000 ? w : 9026;
}

/* ---------------- the ratesheet on screen ---------------- */
function wxScrape(){
  const table = document.querySelector(WORD_CFG.table);
  if(!table || !table.tHead || !table.tBodies.length || !table.tBodies[0].rows.length)
    throw new Error("there is no ratesheet on screen yet — fill in the deal first");

  const hg = wxGrid(table.tHead), bg = wxGrid(table.tBodies[0]);
  const cols = Math.max.apply(null, hg.concat(bg).map(function(r){ return r.length; }));

  function pack(grid, head){
    return grid.map(function(row){
      const out = new Array(cols).fill(null);
      for(let c=0;c<cols;c++){
        const g = row[c];
        if(!g) continue;
        const cell = wxReadCell(g.td, head);
        cell.span = g.span; cell.rows = g.rows; cell.colStart = g.colStart; cell.rowStart = g.rowStart; cell.col = c;
        out[c] = cell;
      }
      return out;
    });
  }
  const head = pack(hg, true), body = pack(bg, false);

  const footEl = WORD_CFG.foot ? document.querySelector(WORD_CFG.foot) : null;
  let notes = [];
  if(footEl){
    const divs = Array.prototype.filter.call(footEl.querySelectorAll("div"), function(d){ return !d.querySelector("div"); });
    if(divs.length) notes = divs.map(wxText);
    else notes = footEl.innerHTML.split(/<br\s*\/?>/i).map(function(part){
      const t = document.createElement("div"); t.innerHTML = part; return wxText(t);
    });
  }
  notes = notes.filter(function(t){ return t; });

  return {head:head, body:body, cols:cols, notes:notes};
}

function wxFill(xml){
  const s = wxScrape();
  const avail = wxTextWidth(xml);

  let pt = 14, widths = null;
  while(pt >= 8 && !(widths = wxColumnWidths(s.head, s.body, s.cols, avail, pt))) pt -= 0.5;
  if(!widths) throw new Error("the ratesheet has more columns than will fit on the page");

  const tbl = wxFindTable(xml);
  if(!tbl) throw new Error("no table found in that template — the rates table has to be the first table in the document");
  xml = wxSplice(xml, tbl, wxBuildTable(s.head, s.body, widths, pt));

  if(s.notes.length){
    /* The template's cash line goes first. Left until afterwards, the search
       would find the freshly written note instead and delete that, leaving the
       placeholder behind. */
    const cp = wxFindPara(xml, "cash for having your home loan");
    if(cp) xml = wxSplice(xml, cp, "");
    const rp = wxFindPara(xml, "Repayments are on");
    if(rp) xml = wxSplice(xml, rp, s.notes.map(wxNote).join(""));
  }
  return xml;
}

/* ---------------- build and hand over the file ---------------- */
async function wxBuild(){
  const parts = wxZipRead(wxB64Bytes(WX_TPL ? WX_TPL.b64 : WORD_TEMPLATE_B64));
  const doc = parts.filter(function(p){ return p.name === "word/document.xml"; })[0];
  if(!doc) throw new Error("that file is not a Word document");

  const raw = doc.method === 8 ? await wxInflate(doc.data) : doc.data;
  const out = new TextEncoder().encode(wxFill(new TextDecoder().decode(raw)));

  const packed = await wxDeflate(out);
  doc.method = packed ? 8 : 0;
  doc.data   = packed || out;
  doc.csize  = doc.data.length;
  doc.usize  = out.length;
  doc.crc    = wxCrc32(out);

  return wxZipWrite(parts);
}

/* A blob link clicked inside this frame is refused by some browsers, so the
   link is hung off the outer page whenever that page is reachable. */
function wxSave(blob, name){
  let doc = document;
  try{ if(window.top && window.top.document && window.top.document.body) doc = window.top.document; }catch(e){}
  const url = URL.createObjectURL(blob);
  const a = doc.createElement("a");
  a.href = url; a.download = name; a.style.display = "none";
  doc.body.appendChild(a); a.click();
  setTimeout(function(){ try{ a.parentNode.removeChild(a); }catch(e){} URL.revokeObjectURL(url); }, 30000);
}

/* ---------------- controls ---------------- */
(function(){
  const anchor = document.querySelector(WORD_CFG.mount);
  if(!anchor) return;
  const host = anchor.closest(".fld") || anchor;
  const wrap = document.createElement("span");
  wrap.style.cssText = "display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap";
  wrap.innerHTML =
    '<button type="button" class="' + WORD_CFG.cls + '" id="wordBtn">Download Word</button>' +
    '<button type="button" class="' + WORD_CFG.ghost + '" id="tplBtn">Word template…</button>' +
    '<button type="button" id="tplReset" hidden style="background:none;border:0;padding:0;font:inherit;font-size:11px;text-decoration:underline;cursor:pointer;color:inherit;opacity:.75"></button>' +
    '<span id="wordStatus" style="font-size:11px;opacity:.8"></span>' +
    '<input type="file" id="tplFile" accept=".docx" style="display:none">';
  if(host.parentNode) host.parentNode.insertBefore(wrap, host.nextSibling);

  const $$ = function(id){ return document.getElementById(id); };
  let timer = null;
  function say(msg){
    const el = $$("wordStatus"); if(!el) return;
    el.textContent = msg || "";
    clearTimeout(timer);
    if(msg) timer = setTimeout(function(){ el.textContent = ""; }, 6000);
  }
  function paint(){
    $$("tplBtn").textContent = WX_TPL ? "Template: " + WX_TPL.name : "Word template…";
    $$("tplBtn").title = WX_TPL
      ? "Downloads use your own template. Click to choose a different one."
      : "Downloads use the built-in " + WORD_CFG.bank + " template. Click to use your own .docx instead.";
    $$("tplReset").hidden = !WX_TPL;
    $$("tplReset").textContent = "use the built-in one";
  }
  function setTpl(t){
    WX_TPL = t;
    try{ t ? localStorage.setItem(WX_TPLKEY, JSON.stringify(t)) : localStorage.removeItem(WX_TPLKEY); }
    catch(e){ say("Loaded for now, but there is no room to remember it."); }
    paint();
  }

  $$("wordBtn").addEventListener("click", async function(){
    const b = $$("wordBtn"), was = b.textContent;
    b.disabled = true; b.textContent = "Building…";
    try{ wxSave(await wxBuild(), WX_FILE); say("Saved — " + WX_FILE); }
    catch(err){ say("Could not build it: " + err.message); }
    finally{ b.disabled = false; b.textContent = was; }
  });
  $$("tplBtn").addEventListener("click", function(){ $$("tplFile").click(); });
  $$("tplReset").addEventListener("click", function(){ setTpl(null); say("Back to the built-in " + WORD_CFG.bank + " template."); });
  $$("tplFile").addEventListener("change", function(e){
    const f = e.target.files[0]; e.target.value = "";
    if(!f) return;
    if(!/\.docx$/i.test(f.name)){ say("Please choose a .docx file."); return; }
    const fr = new FileReader();
    fr.onerror = function(){ say("That file could not be read."); };
    fr.onload = function(){
      try{
        const bytes = new Uint8Array(fr.result);
        if(!wxZipRead(bytes).some(function(p){ return p.name === "word/document.xml"; }))
          throw new Error("that file is not a Word document");
        setTpl({ name:f.name, b64:wxBytesB64(bytes) });
        say("Template set — " + f.name);
      }catch(err){ say("Could not use that template: " + err.message); }
    };
    fr.readAsArrayBuffer(f);
  });
  paint();
})();

<\/script>
</body>

<style>
  :root{

    font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Helvetica,Arial,sans-serif;

  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1260px;margin:0 auto;padding:0 18px 60px}

  /* Header */
  header{background:var(--orange);color:var(--ink);border-bottom:4px solid var(--ink);padding:16px 26px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}

  /* Toolbar */
  .toolbar{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap;margin:18px 0}
  .drop{flex:1;min-width:300px;border:2.5px dashed var(--orange-2);border-radius:12px;background:var(--tint);padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:.15s}
  .drop:hover,.drop.over{background:#fff;border-color:var(--ink)}
  .drop .ic{width:40px;height:40px;flex:none;border-radius:9px;background:var(--orange);color:#fff;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}

  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button.act{border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-family:inherit;font-weight:800;font-size:12.5px;padding:0 16px;height:100%;min-height:46px;border-radius:6px;cursor:pointer;transition:.12s}
  button.act:hover{background:var(--tint)}
  button.act.primary{background:var(--orange);border-color:var(--ink);color:#fff}
  button.act.primary:hover{background:var(--orange-2)}
  button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--orange-3);outline-offset:2px}

  .pastewrap{padding:16px 18px 18px}
  .pastewrap textarea{width:100%;min-height:150px;border:1.5px solid var(--ink);border-radius:8px;padding:10px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;resize:vertical;background:#fff}
  .pastewrap textarea:focus{outline:none;border-color:var(--orange)}
  .pastewrap p{font-size:12px;color:#555;line-height:1.7;margin:0 0 10px}
  .pastewrap code{background:var(--tint);padding:1px 5px;border-radius:4px;font-size:11.5px}

  .parse-status{font-size:12.5px;margin:-6px 0 14px;padding:9px 13px;border-radius:9px;display:none}
  .parse-status.show{display:block}
  .parse-status.load{background:var(--amber-bg);border:1px solid #E8CE95;color:var(--amber)}
  .parse-status.ok{background:var(--green-tint);border:1px solid #A6DCBB;color:var(--green-2)}
  .parse-status.err{background:#FDECEA;border:1px solid #F5B4AD;color:#A11}

  /* Cards / panes */
  .grid{display:grid;grid-template-columns:360px 1fr;gap:22px;align-items:start}
  @media(max-width:1000px){.grid{grid-template-columns:1fr}}
  .card{background:#fff;border:1.5px solid var(--ink);border-radius:14px;box-shadow:0 10px 28px rgba(20,16,0,.07);overflow:hidden}
  .card .cap{display:flex;align-items:baseline;gap:10px;background:#fff;color:var(--ink);font-weight:900;font-size:14px;letter-spacing:.6px;text-transform:uppercase;padding:14px 18px 11px;border-bottom:2px solid var(--ink)}
  .card .cap .pane-tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-3);background:var(--tint);border:1px solid var(--orange-2);border-radius:20px;padding:2px 9px;margin-left:auto}
  .card .body{padding:18px}

  /* Deal form */
  .dsec{margin-bottom:20px}
  .dsec:last-of-type{margin-bottom:0}
  .dsec-h{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);padding-bottom:9px;border-bottom:2px solid var(--ink);margin-bottom:9px}
  .drow{display:flex;align-items:stretch;gap:0;margin-bottom:9px}
  .dlab{display:flex;align-items:center;flex:1 1 auto;font-size:12.5px;font-weight:800;color:var(--ink-2);background:var(--tint);border:1.5px solid var(--ink);border-right:0;border-radius:10px 0 0 10px;padding:0 12px}
  .drow:has(.dpick) .dlab{background:var(--ink);color:#fff}
  .drow:has(.dout) .dlab{background:#F5F2E9;color:var(--ink-2)}
  .dctl{width:162px;flex:none;height:42px}
  .dfield{position:relative;display:flex;align-items:center;background:#fff;border:1.5px solid var(--ink);border-radius:0 10px 10px 0;height:100%;padding:0 12px;transition:border-color .15s,box-shadow .15s}
  .dfield:focus-within{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,96,0,.14)}
  .dfield input{width:100%;border:0;outline:0;background:transparent;font:inherit;font-size:15.5px;font-weight:800;color:var(--ink);text-align:right}
  .dfield.money{padding-left:24px}
  .dfield.money::before{content:"$";position:absolute;left:12px;color:var(--ink-3);font-size:13px;font-weight:600}
  .dfield .unit{margin-left:6px;font-size:12.5px;color:var(--ink-3);font-weight:600;flex:none}
  .dout{display:flex;align-items:center;justify-content:flex-end;height:100%;background:var(--surface);border:1.5px solid var(--ink);border-radius:0 10px 10px 0;padding:0 12px;font-size:15.5px;font-weight:800;color:var(--orange-3);transition:background .15s,color .15s}
  .dout.warn{background:var(--amber-bg);color:var(--amber)}
  .dpick{position:relative;height:100%}
  .dpick select{width:100%;height:100%;border:1.5px solid var(--ink);border-radius:0 10px 10px 0;background:#fff;padding:0 32px 0 12px;font:inherit;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;-webkit-appearance:none;appearance:none;text-align:right;text-align-last:right;transition:border-color .15s,background .15s,color .15s}
  .dpick select:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,96,0,.14)}
  .dpick select option{color:#111;text-align:left}
  .dpick .cv{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink-3);font-size:10px}
  .dpick.yes select{border-color:#1E9E5A;background:var(--green-tint);color:var(--green-2)}
  .dpick.no select{border-color:#A8410E;background:#FFF4EE;color:#A8410E}
  .cashnote{margin-top:16px;background:var(--surface);border:1.5px solid var(--ink);border-radius:10px;padding:10px 12px;font-size:11.5px;color:#5B5044;line-height:1.6}
  .cashnote b{color:var(--ink)}
  .cashnote button{background:none;border:none;color:var(--orange-2);font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:0}
  .cashnote button:hover{color:var(--orange-3)}
  .editnote{font-size:11px;color:var(--ink-3);margin:10px 2px 0;line-height:1.5}

  /* Ratesheet */
  .rs-controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .basis{display:inline-flex;align-items:center;gap:8px;background:var(--tint);border:1px solid var(--orange-2);color:var(--orange-3);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700}
  .basis.ok{background:var(--green-tint);border-color:#A6DCBB;color:var(--green-2)}
  .basis.warn{background:var(--amber-bg);border-color:#E8CE95;color:var(--amber)}
  .seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
  .seg-btn{border:none;background:#fff;color:var(--ink);font-family:inherit;font-weight:700;font-size:12.5px;padding:7px 16px;cursor:pointer;transition:.12s}
  .seg-btn + .seg-btn{border-left:1.5px solid var(--ink)}
  .seg-btn.active{background:var(--orange);color:#fff}
  .rs-scroll{overflow-x:auto}
  table.rs{width:100%;min-width:690px;border-collapse:collapse;font-size:13px;border:1.5px solid var(--ink)}
  table.rs th,table.rs td{border:1px solid var(--ink);padding:6px 8px;text-align:center;white-space:nowrap}
  table.rs thead th{background:var(--orange);color:#fff;font-weight:800;font-size:12.5px;line-height:1.15}
  table.rs .term-h{min-width:148px}
  table.rs td.term{text-align:left;font-weight:700;padding-left:9px}
  table.rs tr.na td{color:#8A8A8A;font-style:italic}
  .combo-tag{font-size:10px;font-weight:700;letter-spacing:.04em;margin-left:6px;padding:1px 5px;border-radius:4px;background:var(--tint);color:var(--orange-3);border:1px solid var(--tint-2)}
  .foot{margin-top:11px;font-size:12px;font-style:italic;color:#333;line-height:1.7}
  .foot b{font-style:normal}
  .fine{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:10.5px;font-style:normal;color:#6B615A;line-height:1.65}
  .fine div + div{margin-top:5px}

  details.rateedit{margin-top:22px;background:#fff;border:1.5px solid var(--ink);border-radius:14px;box-shadow:0 10px 28px rgba(20,16,0,.07);overflow:hidden}
  details.rateedit summary{cursor:pointer;padding:11px 18px;font-weight:800;font-size:12.5px;letter-spacing:.6px;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--ink);color:var(--orange)}
  details.rateedit summary::-webkit-details-marker{display:none}
  details.rateedit summary .chev{transition:.2s;color:var(--orange)}
  details.rateedit[open] summary .chev{transform:rotate(180deg)}
  .editwrap{padding:16px 18px 18px;overflow-x:auto}
  table.edit{width:100%;border-collapse:collapse;font-size:13px;min-width:660px}
  table.edit th{background:var(--tint-2);color:var(--ink);padding:9px 6px;font-weight:800;font-size:11.5px;line-height:1.3}
  table.edit td{border:1px solid var(--line);padding:2px}
  table.edit td:first-child{font-weight:700;padding-left:10px;background:var(--surface);white-space:nowrap}
  table.edit input{width:100%;border:none;outline:none;text-align:center;font:inherit;padding:7px 4px;background:transparent}
  table.edit input:focus{background:var(--tint)}
  table.edit input:disabled{color:#BFB6AF}

  .rulewrap{padding:16px 18px 20px}
  .rulehint{font-size:12px;color:#555;font-style:italic;margin:0 0 12px;line-height:1.6}
  .ninp{border:1.5px solid var(--ink);background:var(--tint);border-radius:6px;padding:5px 6px;font:inherit;font-weight:700;text-align:center;color:var(--ink)}
  .ninp:focus{outline:none;border-color:var(--orange);background:#fff}
  .ninp.pct{width:62px}
  .ninp.money{width:100px}
  .rule-add,.rule-reset{margin-top:12px;border-radius:6px;padding:9px 15px;font-family:inherit;font-weight:800;cursor:pointer;font-size:12.5px;border:1.5px solid var(--ink)}
  .rule-add{background:var(--orange);color:#fff}
  .rule-add:hover{background:var(--orange-2)}
  .rule-reset{background:#fff;border-color:var(--ink);color:var(--ink);margin-left:8px}
  .rule-reset:hover{background:var(--tint)}

  .ruleset{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;max-width:900px}
  .ruleset .rl{border:1.5px solid var(--ink);border-radius:10px;padding:12px 14px;background:var(--surface)}
  .ruleset .rl b{display:block;font-size:12.5px;margin-bottom:7px}
  .ruleset .rl p{margin:0;font-size:12px;color:#555;line-height:1.9}
  .chk{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;margin-top:8px}
  .chk input{accent-color:var(--orange)}

  .cashblock{border:1.5px solid var(--ink);border-radius:9px;overflow:hidden;max-width:900px}
  .cashblock .rhead{background:var(--orange);color:var(--ink);border-bottom:2px solid var(--ink);font-weight:800;padding:10px 14px;font-size:14px;text-transform:uppercase;letter-spacing:.4px}
  .cashcol{padding:14px 16px}
  .cashcol h4{margin:0 0 12px;font-size:14px;font-weight:700}
  .cashcol p{margin:0 0 10px;font-style:italic;font-size:12.5px;color:#333;line-height:2}
  .cashcol ul{margin:0;padding-left:20px;font-size:12.5px;line-height:2.3;font-style:italic;color:#333}
  .cashcol small{display:block;margin-top:10px;font-size:11px;color:#777;font-style:italic;line-height:1.5}

  /* Motion + busy */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes riseIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes markPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.86)}}
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

  .busy{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(20,16,0,.55);backdrop-filter:blur(3px);animation:fadeIn .18s ease}
  .busy.show{display:flex}
  .busycard{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:28px 30px 24px;width:min(340px,86vw);text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:riseIn .26s cubic-bezier(.2,.8,.3,1)}
  .ring{width:72px;height:72px;margin:0 auto 18px;position:relative}
  .ring svg{display:block}
  .ring.spin > svg{animation:spin 1.05s linear infinite}
  .ring .track{stroke:#F0E2D7}
  .ring .fill{stroke:var(--orange);stroke-linecap:round;transition:stroke-dashoffset .28s ease}
  .ring .glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:markPulse 1.5s ease-in-out infinite;font-size:15px;font-weight:700;color:var(--orange-3);letter-spacing:-.5px}
  .busytitle{font-size:14.5px;font-weight:700;color:var(--orange-3)}
  .busysub{font-size:12px;color:var(--ink-3);margin-top:6px;min-height:16px;line-height:1.5}

  .drop.working{border-style:solid;border-color:var(--orange);cursor:progress;background:linear-gradient(100deg,#fff 35%,rgba(255,96,0,.16) 50%,#fff 65%);background-size:220% 100%;animation:shimmer 1.3s linear infinite}
  .drop.working .ic{animation:markPulse 1.3s ease-in-out infinite}
  button.act.done,button.act.done:hover{background:var(--green-2);border-color:var(--green-2);color:#fff}
  button.act.done{animation:pop .22s cubic-bezier(.2,.8,.3,1)}
  .parse-status.show{animation:riseIn .24s cubic-bezier(.2,.8,.3,1)}

  @media(prefers-reduced-motion:reduce){
    .busy,.busycard,.ring.spin > svg,.ring .glyph,.drop.working,.drop.working .ic,button.act.done,.parse-status.show{animation:none!important}
    .drop.working{background:var(--tint)}
  }

  @media print{
    body{background:#fff}
    .toolbar,details.rateedit,.card.deals,header .logo,.parse-status,.editnote,.seg,.busy{display:none!important}
    .grid{display:block}
    header{background:var(--orange)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    table.rs td,table.rs th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>

                stroke-dasharray="188.5" stroke-dashoffset="135"></circle>
