    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px;margin:0 auto;padding:0 18px 60px}

  /* Header */
  header{background:var(--navy);color:#fff;border-bottom:4px solid var(--navy-2);padding:16px 26px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
  .hd-left h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.5px;text-transform:uppercase;line-height:1.05}
  .hd-left p{margin:3px 0 0;font-size:12px;font-weight:600;opacity:.85}
  .logo{display:flex;align-items:center;gap:10px;background:#fff;border-radius:8px;padding:6px 12px 6px 14px;line-height:1}
  .logo .word{font-size:22px;font-weight:900;letter-spacing:.5px;color:var(--navy)}
  .logo .mark{width:32px;height:32px;background:var(--navy);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;line-height:1}

  /* Toolbar */
  .toolbar{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin:18px 0}
  .drop{flex:1;min-width:280px;border:2.5px dashed var(--navy);border-radius:12px;background:var(--navy-tint);padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:.15s}
  .drop:hover,.drop.over{background:#fff;border-color:var(--navy-2);transform:scale(1.003)}
  .drop .ic{width:40px;height:40px;flex:none;border-radius:9px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
  .drop .txt b{display:block;font-size:13.5px}
  .drop .txt span{font-size:11.5px;color:var(--ink-3)}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button.act{border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-weight:800;font-size:12.5px;padding:0 16px;height:100%;min-height:46px;border-radius:6px;cursor:pointer;transition:.12s}
  button.act:hover{background:var(--navy-tint)}
  button.act.primary{background:var(--navy);border-color:var(--navy-2);color:#fff}
  button.act.primary:hover{background:var(--navy-2)}
  button.act:active{transform:translateY(1px)}

  .pastewrap{padding:0 18px 18px}
  .pastewrap textarea{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;resize:vertical}
  .pastewrap textarea:focus{outline:none;border-color:var(--navy)}
  .pastewrap p{font-size:12px;color:var(--ink-3);line-height:1.6;margin:0 0 10px}
  .pastewrap code{background:var(--navy-tint);padding:1px 5px;border-radius:4px;font-size:11.5px}

  .parse-status{font-size:12.5px;margin:-6px 0 14px;padding:9px 13px;border-radius:9px;display:none;font-weight:600}
  .parse-status.show{display:block}
  .parse-status.load{background:#fff7e6;border:1px solid #ffd98a;color:#8a5a00}
  .parse-status.ok{background:#eaf7ec;border:1px solid #a9dcb2;color:#1e6b2b}
  .parse-status.err{background:#fdecea;border:1px solid #f5b4ad;color:#a11}

  /* Cards layout */
  .grid{display:grid;grid-template-columns:minmax(340px,0.85fr) 1.15fr;gap:22px;align-items:start}
  @media(max-width:980px){.grid{grid-template-columns:1fr}}
  .card{background:#fff;border:1.5px solid var(--navy);border-radius:14px;box-shadow:0 10px 28px rgba(19,28,62,.08);overflow:hidden}
  .card .cap{display:flex;align-items:baseline;gap:10px;background:#fff;color:var(--navy);font-weight:900;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:12px 16px 10px;border-bottom:2px solid var(--navy)}
  .card .cap .pane-tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);background:var(--navy-tint);border:1px solid var(--line);border-radius:20px;padding:2px 9px;margin-left:auto}
  .card .body{padding:18px}

  /* Deals form */
  .dsec{margin-bottom:20px}
  .dsec:last-of-type{margin-bottom:0}
  .dsec-h{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:3px}
  .drow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 0}
  .dlab{font-size:13.5px;font-weight:600;color:var(--ink-2)}
  .dctl{width:158px;flex:none;height:42px}
  .dfield{position:relative;display:flex;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:10px;height:100%;padding:0 12px;transition:border-color .15s,box-shadow .15s}
  .dfield:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px rgba(19,28,62,.1)}
  .dfield input{width:100%;border:0;outline:0;background:transparent;font:inherit;font-size:15.5px;font-weight:700;color:var(--navy);text-align:right}
  .dfield.money{padding-left:24px}
  .dfield.money::before{content:"$";position:absolute;left:12px;color:var(--ink-3);font-size:13px;font-weight:700}
  .dfield .unit{margin-left:6px;font-size:12.5px;color:var(--ink-3);font-weight:600;flex:none}
  .dout{display:flex;align-items:center;justify-content:flex-end;height:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font-size:15.5px;font-weight:800;color:var(--navy);transition:background .15s,color .15s,border-color .15s}
  .dout.warn{background:#FBF0DF;border-color:#EAD2A0;color:#7A5312}
  .dpick{position:relative;height:100%}
  .dpick select{width:100%;height:100%;border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:0 32px 0 12px;font:inherit;font-size:15.5px;font-weight:700;color:var(--navy);cursor:pointer;-webkit-appearance:none;appearance:none;text-align:right;text-align-last:right;transition:border-color .15s,background .15s,color .15s}
  .dpick select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(19,28,62,.1)}
  .dpick select option{color:#111;text-align:left}
  .dpick .cv{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink-3);font-size:10px}
  .dpick.yes select{border-color:#A8D2BC;background:#F2FAF5;color:#14603E}
  .dpick.no select{border-color:#E3C3BF;background:#FCF5F4;color:#8B2F27}
  .cashnote{margin-top:16px;background:var(--navy-tint);border:1.5px dashed #B9C4E0;border-radius:10px;padding:10px 12px;font-size:11.5px;color:var(--ink-2);line-height:1.6}
  .cashnote b{color:var(--navy)}
  .cashnote button{background:none;border:none;color:var(--accent);font:inherit;font-weight:800;text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:0}
  .cashnote button:hover{color:var(--navy)}
  .editnote{font-size:11px;color:var(--ink-3);margin:10px 2px 0;line-height:1.5}

  /* Ratesheet output */
  .rs-controls{display:flex;justify-content:flex-end;margin-bottom:12px}
  .seg{display:inline-flex;border:1.5px solid var(--navy);border-radius:6px;overflow:hidden}
  .seg-btn{border:none;background:#fff;color:var(--navy);font-weight:800;font-size:12.5px;padding:7px 16px;cursor:pointer;transition:.12s}
  .seg-btn + .seg-btn{border-left:1.5px solid var(--navy)}
  .seg-btn.active{background:var(--navy);color:#fff}
  .rs-scroll{overflow-x:auto}
  table.rs{width:100%;min-width:640px;border-collapse:collapse;font-size:13px;border:1.5px solid var(--navy)}
  table.rs th,table.rs td{border:1px solid var(--navy);padding:6px 8px;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
  table.rs thead th{background:var(--navy-tint);color:var(--navy);font-weight:800;font-size:12.5px;line-height:1.15}
  table.rs .term-h{min-width:128px}
  table.rs td.term{text-align:left;font-weight:700;padding-left:9px}
  .foot{margin-top:11px;font-size:12px;font-style:italic;color:var(--ink-2);line-height:1.6}
  .foot b{font-style:normal}

  details.rateedit{margin-top:22px;background:#fff;border:1.5px solid var(--navy);border-radius:14px;box-shadow:0 10px 28px rgba(19,28,62,.06)}
  details.rateedit summary{cursor:pointer;padding:12px 18px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.8px;list-style:none;display:flex;justify-content:space-between;align-items:center;color:var(--navy)}
  details.rateedit summary::-webkit-details-marker{display:none}
  details.rateedit summary .chev{transition:.2s;color:var(--ink-3)}
  details.rateedit[open] summary{border-bottom:2px solid var(--navy)}
  details.rateedit[open] summary .chev{transform:rotate(180deg)}
  .editwrap{padding:14px 18px 18px;overflow-x:auto}
  table.edit{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
  table.edit th{background:var(--navy);color:#fff;padding:8px 6px;font-weight:700;font-size:11.5px}
  table.edit td{border:1px solid var(--line);padding:2px}
  table.edit td:first-child{font-weight:700;padding-left:10px;background:var(--navy-tint)}
  table.edit tbody tr:nth-child(even) td{background:var(--row-alt)}
  table.edit tbody tr:nth-child(even) td:first-child{background:var(--navy-tint)}
  table.edit input{width:100%;border:none;outline:none;background:transparent;text-align:center;font:inherit;padding:7px 4px}
  table.edit input:focus{background:#fff;box-shadow:inset 0 0 0 1.5px var(--navy)}
  .termset{margin-top:14px;font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  .rulewrap{padding:14px 18px 20px}
  .rulehint{font-size:12px;color:var(--ink-3);font-style:italic;margin:0 0 12px}
  table.lem{border-collapse:collapse;font-size:13.5px;width:100%;max-width:460px;border:1px solid var(--line)}
  table.lem th{background:var(--navy);color:#fff;padding:9px 10px;font-weight:700;font-size:12px;text-align:left}
  table.lem td{border:1px solid var(--line);padding:6px 10px}
  table.lem tbody tr:nth-child(even) td{background:var(--row-alt)}
  table.lem td:last-child{text-align:center;width:44px}
  .ninp{border:1px solid var(--line);background:var(--navy-tint);border-radius:6px;padding:5px 6px;font:inherit;font-weight:700;text-align:center;color:var(--navy)}
  .ninp:focus{outline:none;border-color:var(--navy);background:#fff}
  .ninp.band{width:70px}
  .ninp.pct{width:60px}
  .ninp.money{width:98px}
  .ninp.term{width:56px}
  .and-above{font-weight:700;color:var(--ink-3)}
  .rule-add,.rule-reset{margin-top:12px;border-radius:6px;padding:8px 15px;font-weight:800;cursor:pointer;font-size:12.5px;border:1.5px solid transparent}
  .rule-add{background:var(--navy);border-color:var(--navy-2);color:#fff}
  .rule-add:hover{background:var(--navy-2)}
  .rule-reset{background:#fff;border-color:var(--navy);color:var(--navy);margin-left:8px}
  .rule-reset:hover{background:var(--navy-tint)}
  .lem-rm{background:none;border:none;color:var(--danger);cursor:pointer;font-weight:900;font-size:17px;line-height:1}
  .cashblock{border:1.5px solid var(--navy);border-radius:10px;overflow:hidden;max-width:860px}
  .cashblock .rhead{background:var(--navy);color:#fff;font-weight:800;padding:10px 14px;font-size:14px}
  .cashcols{display:grid;grid-template-columns:1fr 1fr}
  @media(max-width:700px){.cashcols{grid-template-columns:1fr}}
  .cashcol{padding:14px 16px;border-right:1px solid var(--line)}
  .cashcol:last-child{border-right:none}
  @media(max-width:700px){.cashcol{border-right:none;border-bottom:1px solid var(--line)}}
  .cashcol h4{margin:0 0 12px;font-size:14px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .cashcol p{margin:0 0 10px;font-style:italic;font-size:12.5px;color:var(--ink-2);line-height:1.9}
  .cashcol ul{margin:0;padding-left:20px;font-size:12.5px;line-height:2.2;font-style:italic;color:var(--ink-2)}
  .cashcol small{display:block;margin-top:10px;font-size:11px;color:var(--ink-3);font-style:italic;line-height:1.5}

  /* Motion + busy states */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes riseIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes starPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

  .busy{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(7,13,36,.55);backdrop-filter:blur(3px);animation:fadeIn .18s ease}
  .busy.show{display:flex}
  .busycard{background:#fff;border:1.5px solid var(--navy);border-radius:16px;padding:28px 30px 24px;width:min(340px,86vw);text-align:center;box-shadow:0 24px 64px rgba(7,13,36,.4);animation:riseIn .26s cubic-bezier(.2,.8,.3,1)}
  .ring{width:72px;height:72px;margin:0 auto 18px;position:relative}
  .ring svg{display:block}
  .ring.spin svg{animation:spin 1.05s linear infinite}
  .ring .track{stroke:#E9EDF5}
  .ring .fill{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .28s ease}
  .ring .star{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--navy);animation:starPulse 1.5s ease-in-out infinite}
  .busytitle{font-size:14.5px;font-weight:800;color:var(--navy);letter-spacing:-.1px}
  .busysub{font-size:12px;color:var(--ink-3);margin-top:6px;min-height:16px;line-height:1.5}

  .drop.working{border-style:solid;border-color:var(--gold);cursor:progress;background:linear-gradient(100deg,#fff 35%,rgba(201,154,46,.16) 50%,#fff 65%);background-size:220% 100%;animation:shimmer 1.3s linear infinite}
  .drop.working .ic{background:var(--gold);animation:starPulse 1.3s ease-in-out infinite}
  button.act.done,button.act.done:hover{background:#17714B;border-color:#17714B;color:#fff}
  button.act.done{animation:pop .22s cubic-bezier(.2,.8,.3,1)}
  .parse-status.show{animation:riseIn .24s cubic-bezier(.2,.8,.3,1)}

  @media(prefers-reduced-motion:reduce){
    .busy,.busycard,.ring.spin svg,.ring .star,.drop.working,.drop.working .ic,button.act.done,.parse-status.show{animation:none!important}
    .drop.working{background:#FBF8F0}
  }

  @media print{
    body{background:#fff}
    .toolbar,details.rateedit,.card.deals,header .logo,.parse-status,.editnote,.rs-controls,.busy{display:none!important}
    .grid{display:block}
    header{background:var(--navy)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    table.rs td,table.rs th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>

<header>
  <div class="hd-left">
    <h1>BNZ Ratesheet Calculator</h1>
    <p>by D.E. Visto &nbsp;•&nbsp; version 1.0</p>
  </div>
  <div class="logo">
    <div class="word">BNZ</div>
    <div class="mark">✱</div>
  </div>
</header>

<div class="wrap">

  <div class="toolbar">
    <label class="drop" id="drop">
      <div class="ic">⬆</div>
      <div class="txt">
        <b>Drag &amp; drop the BNZ Weekly rate card (PDF or image)</b>
        <span>Reads the Card, 0–80% and 80.01–100% columns right here in your browser. Or click to browse.</span>
      </div>
      <input id="file" type="file" accept="image/*,application/pdf" hidden>
    </label>
    <div class="btns">
      <button class="act" id="reset">Reset deal</button>
      <button class="act primary" id="copyword">Copy to Word</button>
      <button class="act" id="print">Print / Save PDF</button>
    </div>
  </div>

  <div class="parse-status" id="status"></div>

  <div class="grid">
    <\!-- DEALS -->
    <div class="card deals">
      <div class="cap">Deals<span class="pane-tag">enter the details below</span></div>
      <div class="body">
        <div class="dsec">
          <div class="dsec-h">Loan</div>
          <div class="drow">
            <span class="dlab">Loan Amount</span>
            <div class="dctl"><div class="dfield money"><input id="loan" inputmode="decimal" value="180,000"></div></div>
          </div>
          <div class="drow">
            <span class="dlab">Loan Term</span>
            <div class="dctl"><div class="dfield"><input id="term" inputmode="numeric" value="30"><span class="unit">yrs</span></div></div>
          </div>
          <div class="drow">
            <span class="dlab">Cash Discount</span>
            <div class="dctl"><div class="dfield money"><input id="cash" inputmode="decimal" value="0"></div></div>
          </div>
          <div class="drow">
            <span class="dlab">LEM</span>
            <div class="dctl"><div class="dout" id="lem">0.00%</div></div>
          </div>
        </div>

        <div class="dsec">
          <div class="dsec-h">Security</div>
          <div class="drow">
            <span class="dlab">Property Value</span>
            <div class="dctl"><div class="dfield money"><input id="pval" inputmode="decimal" value="610,000"></div></div>
          </div>
          <div class="drow">
            <span class="dlab">LVR</span>
            <div class="dctl"><div class="dout" id="lvr">30%</div></div>
          </div>
          <div class="drow">
            <span class="dlab">First Home Buyer</span>
            <div class="dctl"><div class="dpick" id="fhbCell">
              <select id="fhb"><option value="">—</option><option>Yes</option><option>No</option></select><span class="cv">▼</span>
            </div></div>
          </div>
          <div class="drow">
            <span class="dlab">Construction / turnkey</span>
            <div class="dctl"><div class="dpick" id="conCell">
              <select id="con"><option value="">—</option><option>Yes</option><option>No</option></select><span class="cv">▼</span>
            </div></div>
          </div>
        </div>

        <p class="cashnote" id="cashhint"></p>
        <p class="editnote">Shaded fields are calculated. Cash Discount stays at $0 until you enter an approved amount.</p>
      </div>
    </div>

    <\!-- RATESHEET -->
    <div class="card" id="sheetcard">
      <div class="cap">Your Ratesheet<span class="pane-tag">client output</span></div>
      <div class="body">
        <div class="rs-controls">
          <div class="seg" id="repayseg">
            <button class="seg-btn active" data-mode="pi">P&amp;I</button>
            <button class="seg-btn" data-mode="io">Interest Only</button>
          </div>
        </div>
        <div class="rs-scroll">
          <table class="rs" id="rs">
            <thead>
              <tr>
                <th rowspan="2" class="term-h">Term</th>
                <th rowspan="2">Standard<br>Rate</th>
                <th rowspan="2" id="adjHead">Your<br>Discount</th>
                <th rowspan="2">Your<br>Rate</th>
                <th colspan="3">Repayments*</th>
              </tr>
              <tr><th>weekly</th><th>f/n</th><th>monthly</th></tr>
            </thead>
            <tbody id="rsbody"></tbody>
          </table>
        </div>
        <div class="foot" id="foot"></div>
      </div>
    </div>
  </div>

  <\!-- PASTE RATES -->
  <details class="rateedit">
    <summary>Paste rates from the sheet <span class="chev">▾</span></summary>
    <div class="pastewrap">
      <p>Select the rate rows in the ratesheet — Excel, a PDF, anywhere you can highlight text — copy them, and paste below. Each line needs its product or term followed by the three rates in sheet order: <code>Card</code>, <code>0–80%</code>, <code>80.01–100%</code>. Extra words and % signs are fine.</p>
      <textarea id="pastebox" placeholder="6 month	4.69%	4.45%	4.69%
1 year	4.79%	4.59%	4.79%
Total Money Variable	5.94%	5.84%	5.94%"></textarea>
      <button class="rule-add" id="pasteload">Load these rates</button>
      <button class="rule-reset" id="pasteclear">Clear</button>
    </div>
  </details>

  <\!-- RATE EDITOR -->
  <details class="rateedit" id="rateedit">
    <summary>Edit / view loaded rate table (Bank of New Zealand: Home Lending Rates) <span class="chev">▾</span></summary>
    <div class="editwrap">
      <table class="edit">
        <thead>
          <tr>
            <th style="text-align:left;padding-left:10px">Product / Term</th>
            <th>Card</th>
            <th>0% – 80% LVR</th>
            <th>80.01% – 100% LVR</th>
          </tr>
        </thead>
        <tbody id="editbody"></tbody>
      </table>
      <div class="termset">
        <span>Rapid Repay maximum term</span>
        <input class="ninp term" id="rapidterm"> <span>years</span>
      </div>
      <button class="rule-reset" id="ratesreset" style="margin-left:0">Reset rates to default</button>
    </div>
  </details>

  <\!-- LEM BANDS EDITOR -->
  <details class="rateedit">
    <summary>Edit Low Equity Margin bands <span class="chev">▾</span></summary>
    <div class="rulewrap">
      <p class="rulehint">LVR is matched to the first band it falls at or below. Values apply live to the ratesheet and the LEM field.</p>
      <table class="lem">
        <thead><tr><th>LVR up to</th><th>LEM rate</th><th></th></tr></thead>
        <tbody id="lembody"></tbody>

              <li>New home loan with a minimum of $<input class="ninp money" data-cash="large.min" id="c_lmin">: up to <input class="ninp pct" data-cash="large.pct" id="c_lpct"> % of the new lending amount, maximum payment of $<input class="ninp money" data-cash="large.cap" id="c_lcap">. Excludes house under construction &amp; turnkey applications.</li>

<script>
/* ---------- rate table (Bank of New Zealand: Home Lending Rates) ---------- */
const BLACK="#1a1a1a", YEL="#E8A317", GRN="#5FA845", RED="#E63329";
const DEFAULTS = {
  variable:  {label:"Variable",    card:5.84,b80:5.74,b100:5.84,color:BLACK},
  totalmoney:{label:"TotalMoney (offset)",  card:5.94,b80:5.84,b100:5.94,color:BLACK},
  rapid:     {label:"Rapid Repay (Flexi)", card:5.94,b80:5.84,b100:5.94,color:BLACK,rapid:true},
  m6: {label:"6 months fixed", card:4.69,b80:4.45,b100:4.69,color:YEL},
  m12:{label:"1 year fixed",   card:4.79,b80:4.59,b100:4.79,color:YEL},
  m18:{label:"18 months fixed",card:5.09,b80:4.79,b100:5.09,color:GRN},
  m24:{label:"2 years fixed",  card:5.29,b80:4.99,b100:5.29,color:GRN},
  m36:{label:"3 years fixed",  card:5.29,b80:5.29,b100:5.29,color:RED},
  m48:{label:"4 years fixed",  card:5.39,b80:5.39,b100:5.39,color:RED},
  m60:{label:"5 years fixed",  card:5.49,b80:5.49,b100:5.49,color:RED},
};
const ORDER = ["variable","totalmoney","rapid","m6","m12","m18","m24","m36","m48","m60"];
let rates = structuredClone(DEFAULTS);

/* Rapid Repay runs on a shorter maximum term than the rest of the book */
const DEFAULT_RAPID_TERM = 25;
let rapidMaxTerm = DEFAULT_RAPID_TERM;

/* The book runs to 30 years; anything longer is brought back to 30. */
const MAX_TERM = 30;

/* Low Equity Margin bands — max = upper LVR bound (inclusive), Infinity = "and above" */
const DEFAULT_LEM = [
  {max:80,       rate:0},
  {max:85,       rate:0.35},
  {max:90,       rate:0.75},
  {max:95,       rate:1.20},
  {max:Infinity, rate:1.50},
];
let lemBands = structuredClone(DEFAULT_LEM);

/* Cash discount rule */
const DEFAULT_CASH = {
  lvrCap:80,
  std:   {min:200000, max:699999, pct:0.90, cap:20000},  // standard new home loan
  build: {min:200000,             pct:1.00, cap:20000},  // house under construction / turnkey
  large: {min:700000,             pct:1.00, cap:30000},  // $700k+, excludes construction & turnkey
  fhb:   {minLend:250000, min:5000},
};
let cashRule = structuredClone(DEFAULT_CASH);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const num = s => { const n = parseFloat(String(s).replace(/[^0-9.]/g,"")); return isNaN(n)?0:n; };
const money = n => "$"+Math.round(n).toLocaleString("en-US");
const groupInt = v => { const raw=String(v).replace(/[^0-9.]/g,""); if(raw==="")return ""; const [i,d]=raw.split("."); const gi=Number(i||0).toLocaleString("en-US"); return d!==undefined? gi+"."+d : gi; };
const signed = v => (v>0?"+":"")+v.toFixed(2)+"%";
const adjText = v => v===0 ? "0.00%" : (v>0?"+":"")+v.toFixed(2)+"%";

function lemBand(lvr){
  const sorted=[...lemBands].sort((a,b)=>a.max-b.max);
  for(const b of sorted){ if(lvr<=b.max) return b.rate; }
  return sorted.length? sorted[sorted.length-1].rate : 0;
}
function pmt(P,ratePct,ppy,years){
  const r=ratePct/100/ppy, n=years*ppy;
  if(n<=0) return 0;
  if(r===0) return P/n;
  return P*r/(1-Math.pow(1+r,-n));
}
function repay(P,ratePct,ppy,years){
  if(repayMode==="io") return P*(ratePct/100)/ppy;
  return pmt(P,ratePct,ppy,years);
}
/* maximum cash the deal is eligible for under the rule */
function cashEligible(loan,lvr,fhb,construction){
  // percentage tiers apply only at or below the LVR cap
  let base=0, baseTier="";
  if(lvr<=cashRule.lvrCap){
    if(construction){
      if(loan>=cashRule.build.min){
        base=Math.min(loan*cashRule.build.pct/100, cashRule.build.cap);
        baseTier=`construction / turnkey tier (${cashRule.build.pct}% of lending, max ${money(cashRule.build.cap)})`;
      }
    }else if(loan>=cashRule.large.min){
      base=Math.min(loan*cashRule.large.pct/100, cashRule.large.cap);
      baseTier=`${money(cashRule.large.min)}+ tier (${cashRule.large.pct}% of lending, max ${money(cashRule.large.cap)})`;
    }else if(loan>=cashRule.std.min && loan<=cashRule.std.max){
      base=Math.min(loan*cashRule.std.pct/100, cashRule.std.cap);
      baseTier=`standard tier (${cashRule.std.pct}% of lending, max ${money(cashRule.std.cap)})`;
    }
  }
  // the first home buyer minimum applies at any LVR — take whichever is higher
  const fhbAmt = (fhb && loan>=cashRule.fhb.minLend) ? cashRule.fhb.min : 0;
  const fhbTier = `first home buyer minimum ${money(cashRule.fhb.min)}`;

  if(fhbAmt>base)
    return {amount:fhbAmt, tier: base>0 ? `${fhbTier} — higher than the ${baseTier} at ${money(base)}` : fhbTier};
  if(base>0)
    return {amount:base, tier: fhbAmt>0 ? `${baseTier} — higher than the ${fhbTier}` : baseTier};
  return {amount:0, tier:""};
}

/* null = follow the rule, a number = the user has overridden it */
let cashOverride = null;

let repayMode = "pi";

/* ---------- model ---------- */
function computeModel(){
  const loan = num($("#loan").value);
  const termTyped = num($("#term").value);
  const term = Math.min(termTyped, MAX_TERM);   // nothing runs past 30 years
  const pval = num($("#pval").value);
  const fVal = $("#fhb").value;
  const cVal = $("#con").value;
  const fhb  = fVal==="Yes";
  const construction = cVal==="Yes";
  const lvr  = pval>0 ? loan/pval*100 : 0;
  const under80 = lvr<=80;
  const lem = under80 ? 0 : lemBand(lvr);
  const el = cashEligible(loan,lvr,fhb,construction);
  /* A figure equal to what the rule gives is not a deliberate override —
     it is just the number the box was already showing, and pinning it there
     would stop the cashback following the loan. */
  if(cashOverride!=null && Math.round(cashOverride)===Math.round(el.amount)) cashOverride=null;
  const cash = cashOverride!=null ? cashOverride : el.amount;

  let rapidCapped = false;
  const rows = ORDER.map(k=>{
    const r = rates[k];
    const std  = r.card;                          // Standard Rate is always the Card rate
    const band = under80 ? r.b80 : r.b100;        // LVR picks the column
    const rate = under80 ? band : band + lem;     // over 80%, add the Low Equity Margin
    const adj  = under80 ? rate - std : lem;      // discount (negative) or LEM (positive)
    /* Rapid Repay is held to its own shorter maximum. The asterisk is only
       earned when that cap actually bites: the term is longer than the cap AND
       the sheet is on P&I, since interest only ignores the term entirely. */
    const capped = !!r.rapid && term > rapidMaxTerm && repayMode !== "io";
    const yrs  = r.rapid ? Math.min(term, rapidMaxTerm) : term;
    if(capped) rapidCapped = true;
    return {label:r.label + (capped ? "*" : ""), color:r.color, std, adj, rate,
            wk:repay(loan,rate,52,yrs), fn:repay(loan,rate,26,yrs), mo:repay(loan,rate,12,yrs)};
  });

  return {loan,term,termTyped,rapidCapped,pval,fVal,cVal,fhb,construction,lvr,lem,under80,cash,
          eligible:el.amount, tier:el.tier,
          adjHeader: under80 ? "Your Discount" : "LEM", rows};
}

/* ---------- render ---------- */
function calc(){
  const m = computeModel();

  const lvrEl=$("#lvr");
  lvrEl.textContent = m.pval>0 ? Math.round(m.lvr)+"%" : "—";
  lvrEl.classList.toggle("warn", m.pval>0 && m.lvr>80);

  const lemEl=$("#lem");
  lemEl.textContent = m.lem.toFixed(2)+"%";
  lemEl.classList.toggle("warn", m.lem>0);

  const fc=$("#fhbCell");
  fc.classList.toggle("yes", m.fVal==="Yes");
  fc.classList.toggle("no",  m.fVal==="No");
  const cc=$("#conCell");
  cc.classList.toggle("yes", m.cVal==="Yes");
  cc.classList.toggle("no",  m.cVal==="No");

  // cashback fills itself from the rule unless the user has typed over it
  const cashEl=$("#cash");
  if(document.activeElement!==cashEl) cashEl.value = groupInt(Math.round(m.cash));

  const hint=$("#cashhint");
  if(cashOverride!=null){
    hint.innerHTML = `Overridden. The rule gives <b>${money(m.eligible)}</b>. <button id="applycash">Reset to the rule</button>`;
    $("#applycash").addEventListener("click",()=>{ cashOverride=null; calc(); });
  }else if(m.eligible>0){
    hint.innerHTML = `Auto-filled from the ${m.tier}. Type over it to set a different amount.`;
  }else if(m.lvr>cashRule.lvrCap){
    hint.textContent = `No cashback above ${cashRule.lvrCap}% LVR under the current rule.`;
  }else{
    hint.textContent = `No cashback at this loan size — new lending starts at ${money(cashRule.std.min)}.`;
  }

  // third column switches between discount and LEM
  $("#adjHead").innerHTML = m.adjHeader==="LEM" ? "LEM" : "Your<br>Discount";

  const body=$("#rsbody"); body.innerHTML="";
  m.rows.forEach(row=>{
    const tr=document.createElement("tr");
    const c=row.color;
    tr.innerHTML =
      `<td class="term" style="color:${c}">${row.label}</td>`+
      `<td style="color:${c}">${row.std.toFixed(2)}%</td>`+
      `<td style="color:${c}">${adjText(row.adj)}</td>`+
      `<td style="color:${c};font-weight:800">${row.rate.toFixed(2)}%</td>`+
      `<td style="color:${c}">${money(row.wk)}</td>`+
      `<td style="color:${c}">${money(row.fn)}</td>`+
      `<td style="color:${c}">${money(row.mo)}</td>`;
    body.appendChild(tr);
  });

  const basis = repayMode==="io" ? "an Interest Only basis" : `a P&amp;I basis over <b>${m.term||0}</b> years`;
  let footHtml = `<div>*Repayments are on ${basis} - Loan of <b>${money(m.loan)}</b>.</div>`;
  if(m.termTyped > MAX_TERM)
    footHtml += `<div>*Loan term brought back to the <b>${MAX_TERM} year</b> maximum.</div>`;
  if(m.rapidCapped)
    footHtml += `<div>*Rapid Repay (Flexi) has a maximum loan term of <b>${rapidMaxTerm} years</b>, so its repayments are based on ${rapidMaxTerm} years.</div>`;
  footHtml += `<div>*BNZ will also give you <b>${money(m.cash)}</b> cash for having your home loan with them.</div>`;
  $("#foot").innerHTML = footHtml;
}

/* ---------- copy ratesheet to Word ---------- */
function buildCopyHTML(){
  const m = computeModel();
  const HEAVY="2.25pt solid #000", LIGHT="0.5pt solid #000";
  const heads=["Term","Standard Rate",m.adjHeader,"Your Rate","weekly","f/n","monthly"];
  const R = m.rows.length + 1, C = heads.length;
  const cellStyle=(ri,ci,extra="")=>{
    const top   = ri===0   ? HEAVY : LIGHT;
    const bot   = ri===R-1 ? HEAVY : LIGHT;
    const left  = ci===0   ? HEAVY : LIGHT;
    const right = ci===C-1 ? HEAVY : LIGHT;
    return `border-top:${top};border-bottom:${bot};border-left:${left};border-right:${right};padding:4px 8px;font-family:Arial,Helvetica,sans-serif;font-size:10.5pt;${extra}`;
  };
  let html=`<table style="border-collapse:collapse;border:${HEAVY}"><thead><tr>`;
  heads.forEach((h,ci)=>{ html+=`<th style="${cellStyle(0,ci,'text-align:center;font-weight:bold')}">${h}</th>`; });
  html+=`</tr></thead><tbody>`;
  m.rows.forEach((row,i)=>{
    const ri=i+1, c=row.color;
    html+=`<tr>`+
      `<td style="${cellStyle(ri,0,'text-align:left;font-weight:bold;color:'+c)}">${row.label}</td>`+
      `<td style="${cellStyle(ri,1,'text-align:center;color:'+c)}">${row.std.toFixed(2)}%</td>`+
      `<td style="${cellStyle(ri,2,'text-align:center;color:'+c)}">${adjText(row.adj)}</td>`+
      `<td style="${cellStyle(ri,3,'text-align:center;font-weight:bold;color:'+c)}">${row.rate.toFixed(2)}%</td>`+
      `<td style="${cellStyle(ri,4,'text-align:center;color:'+c)}">${money(row.wk)}</td>`+
      `<td style="${cellStyle(ri,5,'text-align:center;color:'+c)}">${money(row.fn)}</td>`+
      `<td style="${cellStyle(ri,6,'text-align:center;color:'+c)}">${money(row.mo)}</td>`+
      `</tr>`;
  });
  html+=`</tbody></table>`;
  const basis = repayMode==="io" ? "an Interest Only basis" : `a P&I basis over ${m.term||0} years`;
  html+=`<p style="font-family:Arial;font-size:9.5pt;font-style:italic;margin:6px 0 0">*Repayments are on ${basis} - Loan of ${money(m.loan)}.</p>`;
  if(m.termTyped > MAX_TERM)
    html+=`<p style="font-family:Arial;font-size:9.5pt;font-style:italic;margin:2px 0 0">*Loan term brought back to the ${MAX_TERM} year maximum.</p>`;
  if(m.rapidCapped)
    html+=`<p style="font-family:Arial;font-size:9.5pt;font-style:italic;margin:2px 0 0">*Rapid Repay (Flexi) has a maximum loan term of ${rapidMaxTerm} years, so its repayments are based on ${rapidMaxTerm} years.</p>`;
  html+=`<p style="font-family:Arial;font-size:9.5pt;font-style:italic;margin:2px 0 0">*BNZ will also give you ${money(m.cash)} cash for having your home loan with them.</p>`;
  return html;
}

async function copyToWord(){
  const html = buildCopyHTML();
  const tmp = document.createElement("div"); tmp.innerHTML=html;
  const plain = tmp.innerText;
  let ok=false;
  try{
    if(navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({
        "text/html": new Blob([html],{type:"text/html"}),
        "text/plain": new Blob([plain],{type:"text/plain"})
      })]);
      ok=true;
    }
  }catch(e){ ok=false; }
  if(!ok){
    const holder=document.createElement("div");
    holder.contentEditable="true"; holder.innerHTML=html;
    holder.style.cssText="position:fixed;left:-9999px;top:0;opacity:0";
    document.body.appendChild(holder);
    const range=document.createRange(); range.selectNodeContents(holder);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    try{ ok=document.execCommand("copy"); }catch(e){}
    sel.removeAllRanges(); document.body.removeChild(holder);
  }
  const btn=$("#copyword"); const label=btn.dataset.label||btn.textContent;
  btn.dataset.label=label;
  btn.classList.toggle("done",ok);
  btn.textContent = ok ? "✓ Copied — paste into Word" : "Copy failed — try again";
  setTimeout(()=>{ btn.textContent=label; btn.classList.remove("done"); },2200);
}

/* ---------- rate editor ---------- */
function renderEditor(){
  const b=$("#editbody"); b.innerHTML="";
  ORDER.forEach(k=>{
    const r=rates[k];
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${r.label}</td>`+
      ["card","b80","b100"].map(f=>`<td><input data-k="${k}" data-f="${f}" value="${r[f].toFixed(2)}"></td>`).join("");
    b.appendChild(tr);
  });
  b.querySelectorAll("input").forEach(inp=>{
    inp.addEventListener("input",e=>{
      rates[e.target.dataset.k][e.target.dataset.f]=num(e.target.value);
      calc();
    });
  });
  $("#rapidterm").value = rapidMaxTerm;
}
$("#rapidterm").addEventListener("input",e=>{ rapidMaxTerm=num(e.target.value)||0; calc(); });

/* ---------- LEM band editor ---------- */
function renderLem(){
  const b=$("#lembody"); b.innerHTML="";
  lemBands.forEach((band,i)=>{
    const isInf=!isFinite(band.max);
    const tr=document.createElement("tr");
    tr.innerHTML=
      `<td>${isInf?'<span class="and-above">and above</span>'
                 :`<input class="ninp band" data-i="${i}" data-f="max" value="${band.max}"> %`}</td>`+
      `<td><input class="ninp pct" data-i="${i}" data-f="rate" value="${band.rate.toFixed(2)}"> %</td>`+
      `<td>${lemBands.length>2?`<button class="lem-rm" data-rm="${i}" title="Remove band">×</button>`:""}</td>`;
    b.appendChild(tr);
  });
  b.querySelectorAll("input").forEach(inp=>inp.addEventListener("input",e=>{
    const i=+e.target.dataset.i, f=e.target.dataset.f;
    lemBands[i][f]=num(e.target.value); calc();
  }));
  b.querySelectorAll(".lem-rm").forEach(btn=>btn.addEventListener("click",e=>{
    lemBands.splice(+e.target.dataset.rm,1); renderLem(); calc();
  }));
}

/* ---------- cash rule editor ---------- */
function renderCash(){
  const set=(id,v)=>{ const el=$(id); if(el) el.value=v; };
  set("#c_lvrCap",cashRule.lvrCap);
  set("#c_stdmin",groupInt(cashRule.std.min));
  set("#c_stdmax",groupInt(cashRule.std.max));
  set("#c_stdpct",cashRule.std.pct);
  set("#c_stdcap",groupInt(cashRule.std.cap));
  set("#c_bmin",groupInt(cashRule.build.min));
  set("#c_bpct",cashRule.build.pct);
  set("#c_bcap",groupInt(cashRule.build.cap));
  set("#c_lmin",groupInt(cashRule.large.min));
  set("#c_lpct",cashRule.large.pct);
  set("#c_lcap",groupInt(cashRule.large.cap));
  set("#c_fhbmin",groupInt(cashRule.fhb.minLend));
  set("#c_fhbmin2",groupInt(cashRule.fhb.min));
}
document.querySelectorAll("[data-cash]").forEach(inp=>{
  inp.addEventListener("input",e=>{
    const path=e.target.dataset.cash.split("."); let o=cashRule;
    while(path.length>1) o=o[path.shift()];
    o[path[0]]=num(e.target.value);
    if(e.target.classList.contains("money")){
      e.target.value=groupInt(e.target.value);
      try{e.target.setSelectionRange(e.target.value.length,e.target.value.length);}catch(_){}
    }
    calc();
  });
});

$("#lemadd").addEventListener("click",()=>{
  const inf=lemBands.findIndex(b=>!isFinite(b.max));
  lemBands.splice(inf>=0?inf:lemBands.length,0,{max:100,rate:0});
  renderLem(); calc();
});
$("#lemreset").addEventListener("click",()=>{ lemBands=structuredClone(DEFAULT_LEM); renderLem(); calc(); });
$("#cashreset").addEventListener("click",()=>{ cashRule=structuredClone(DEFAULT_CASH); renderCash(); calc(); });

/* ---------- inputs ---------- */
function bindMoney(id){
  const el=$(id);
  el.addEventListener("input",()=>{ el.value=groupInt(el.value); try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){} calc(); });
}
["#loan","#pval"].forEach(bindMoney);
$("#cash").addEventListener("input",e=>{
  cashOverride = e.target.value.trim()==="" ? null : num(e.target.value);
  e.target.value=groupInt(e.target.value);
  try{e.target.setSelectionRange(e.target.value.length,e.target.value.length);}catch(_){}
  calc();
});
$("#cash").addEventListener("blur",calc);
$("#term").addEventListener("input",calc);
$("#fhb").addEventListener("change",calc);
$("#con").addEventListener("change",calc);

$("#repayseg").addEventListener("click",e=>{
  const b=e.target.closest(".seg-btn"); if(!b) return;
  repayMode=b.dataset.mode;
  $("#repayseg").querySelectorAll(".seg-btn").forEach(x=>x.classList.toggle("active",x===b));
  calc();
});

$("#reset").addEventListener("click",()=>{
  $("#loan").value="0"; $("#term").value="0"; $("#pval").value="0";
  $("#fhb").value=""; $("#con").value=""; cashOverride=null;
  calc();
});
$("#print").addEventListener("click",()=>{

  setTimeout(()=>{ busy(false); window.print(); },420);
});
$("#copyword").addEventListener("click",copyToWord);
$("#ratesreset").addEventListener("click",()=>{ rates=structuredClone(DEFAULTS); rapidMaxTerm=DEFAULT_RAPID_TERM; renderEditor(); calc(); });

/* ---------- paste rates (works with no network) ---------- */
function applyRows(text){
  let n=0, skipped=0;
  text.split(/\r?\n/).forEach(line=>{
    if(!line.trim()) return;
    const nums=(line.match(/\d+\.\d+/g)||[]).map(parseFloat).filter(v=>v>0&&v<25);
    if(nums.length<3){ if(/[a-z]/i.test(line)) skipped++; return; }
    const k=matchKey(line,line);
    if(!k){ skipped++; return; }
    const [card,b80,b100]=nums.slice(-3);
    rates[k].card=card; rates[k].b80=b80; rates[k].b100=b100;
    n++;
  });
  return {n,skipped};
}
function loadText(text,source){
  const {n,skipped}=applyRows(text);
  if(n===0){
    setStatus("err","No rate rows recognised in "+source+". Each row needs a product or term plus three rates, like: 6 month 4.69% 4.45% 4.69%");
    return false;
  }
  renderEditor(); calc();
  $("#rateedit").open=true;
  setStatus("ok","Loaded "+n+" rate row"+(n===1?"":"s")+" from "+source+(skipped?", skipped "+skipped+" line"+(skipped===1?"":"s"):"")+". Check the rate table below to confirm.");
  return true;
}

/* ---------- busy overlay ---------- */
const RING_C=188.5;
function busy(on,title,sub,pct){
  const b=$("#busy");
  if(!on){ b.classList.remove("show"); $("#drop").classList.remove("working"); return; }
  b.classList.add("show");
  $("#drop").classList.add("working");
  if(title) $("#busytitle").textContent=title;
  $("#busysub").textContent=sub||"";
  const ring=$("#ring"), fill=$("#ringfill");
  if(pct==null){                                   // indeterminate
    ring.classList.add("spin");
    fill.style.strokeDashoffset=RING_C*0.72;
  }else{                                           // determinate
    ring.classList.remove("spin");
    const f=Math.max(0,Math.min(1,pct/100));
    fill.style.strokeDashoffset=RING_C*(1-f);
  }
}

function setStatus(kind,msg){
  const s=$("#status"); s.className="parse-status show "+kind; s.textContent=msg;
  if(kind==="ok") setTimeout(()=>s.classList.remove("show"),4000);
}
function fileToB64(file){

}
function matchKey(product,term){
  const p=(product||"").toLowerCase(), t=(term||"").toLowerCase();
  if(p.includes("total")) return "totalmoney";
  if(p.includes("rapid")) return "rapid";
  if(t.includes("variable")||t.includes("float")) return "variable";
  if(t.includes("6 month")||t.includes("6month")) return "m6";
  if(t.includes("18 month")||t.includes("18month")) return "m18";
  if(t.includes("1 year")||t.includes("12 month")) return "m12";
  if(t.includes("2 year")||t.includes("24 month")) return "m24";
  if(t.includes("3 year")||t.includes("36 month")) return "m36";
  if(t.includes("4 year")||t.includes("48 month")) return "m48";
  if(t.includes("5 year")||t.includes("60 month")) return "m60";
  return null;
}

const PDFJS_SRC="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const TESS_SRC="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";

function loadScript(src){
  return new Promise((res,rej)=>{
    if([...document.scripts].some(s=>s.src===src)) return res();
    const el=document.createElement("script");
    el.src=src; el.onload=()=>res();
    el.onerror=()=>rej(new Error("couldn't load a required library — check your internet connection"));
    document.head.appendChild(el);
  });
}

/* sharpen and enlarge before OCR — small type reads badly at native size */
function prepCanvas(img,scale){
  const c=document.createElement("canvas");
  c.width=img.width*scale; c.height=img.height*scale;
  const x=c.getContext("2d");
  x.imageSmoothingQuality="high";
  x.drawImage(img,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height), a=d.data;
  for(let i=0;i<a.length;i+=4){
    const g=0.299*a[i]+0.587*a[i+1]+0.114*a[i+2];
    const v=g>165?255:(g<105?0:g);
    a[i]=a[i+1]=a[i+2]=v;
  }
  x.putImageData(d,0,0);
  return c;
}

/* ---------- choosing how to read an image ----------
   Two settings decide whether a rate card reads at all.

   Page segmentation: tesseract.js defaults to SINGLE_BLOCK, which treats a
   bordered table as one paragraph of prose and returns almost nothing from it.
   The tesseract command line defaults to AUTO instead, and AUTO is what reads
   these cards properly, so it has to be asked for explicitly.

   Preparation: sharpening helps a dim photo and ruins a clean screenshot,
   because a fixed threshold eats the thin strokes of small type while
   tesseract already does its own adaptive version. So the image is read as it
   is first and only worked on if that comes back thin. */
function canvasOf(img,scale,cropTop){
  const skip=Math.round((img.height||0)*(cropTop||0));
  const sh=(img.height||0)-skip;
  const c=document.createElement("canvas");
  c.width=Math.round(img.width*scale); c.height=Math.round(sh*scale);
  const x=c.getContext("2d");
  x.imageSmoothingQuality="high";
  x.drawImage(img,0,skip,img.width,sh,0,0,c.width,c.height);
  return c;
}

/* a usable row carries some words and at least two rates */
function readScore(text){
  let n=0;
  (text||"").split(/\r?\n/).forEach(l=>{
    const nums=(l.match(/\d+\.\d+/g)||[]).length;
    if(nums>=2 && /[a-z]{3}/i.test(l)) n++;
  });
  return n;
}

async function ocrBest(img){
  const tries=[
    {how:"as it is",          psm:3, make:()=>canvasOf(img,1)},
    /* A stacked header \u2014 a band like "Loan to Value Band" sitting above the
       columns it spans \u2014 throws off the page analysis badly enough that whole
       blocks of rows are dropped. Setting the header aside recovers them, and
       costs nothing on cards that did not need it because the best read wins. */
    {how:"below the header",  psm:3, make:()=>canvasOf(img,1,0.15)},
    {how:"column by column",  psm:4, make:()=>canvasOf(img,1)},
    {how:"enlarged",          psm:3, make:()=>canvasOf(img,2)},
    {how:"sharpened",         psm:3, make:()=>prepCanvas(img,2)}
  ];
  let best={score:-1,text:"",how:""};
  for(let i=0;i<tries.length;i++){
    busy(true,"Reading the rate card","Reading the image "+tries[i].how+"\u2026",null);
    let text="";
    try{ text=await ocrCanvas(tries[i].make(),tries[i].psm); }
    catch(e){ if(i===tries.length-1) throw e; }
    const s=readScore(text);
    if(s>best.score) best={score:s,text:text,how:tries[i].how};
    if(s>=4) break;      /* a decent read \u2014 the heavier passes cost seconds each */
  }
  return best;
}

async function ocrCanvas(canvas,psm){
  await loadScript(TESS_SRC);
  const worker=await Tesseract.createWorker("eng",1,{
    logger:m=>{
      if(m.status==="recognizing text") busy(true,"Reading the rate card","Recognising the table — "+Math.round(m.progress*100)+"%",m.progress*100);
      else busy(true,"Reading the rate card","Warming up the text engine…",null);
    }
  });
  try{
    /* Left to itself tesseract.js uses SINGLE_BLOCK, which reads a bordered
       rate table as one paragraph and loses nearly every row. AUTO is what the
       command line tool uses by default and what these cards need. */
    await worker.setParameters({
      tessedit_pageseg_mode: String(psm||3),
      preserve_interword_spaces: "1"
    });
    const {data:{text}}=await worker.recognize(canvas);
    return text;
  } finally { await worker.terminate(); }
}

/* pull the text layer out of a digital PDF, grouped back into visual lines */
async function pdfText(file){
  await loadScript(PDFJS_SRC);
  pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
  const buf=await file.arrayBuffer();
  const doc=await pdfjsLib.getDocument({data:buf}).promise;
  let out="";
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p);
    const content=await page.getTextContent();
    const rows={};
    content.items.forEach(it=>{
      const key=Math.round(it.transform[5]/4);
      (rows[key]=rows[key]||[]).push(it);
    });
    /* A PDF content stream may emit a row's cells in any order, so the columns
       have to be put back into reading order by their x position before the
       row is joined — otherwise Current Rate and New Rate can arrive swapped. */
    out+=Object.keys(rows).sort((a,b)=>b-a).map(k=>
      rows[k].sort((p,q)=>p.transform[4]-q.transform[4]).map(i=>i.str).join(" ")
    ).join("\n")+"\n";
  }
  return {text:out, doc};
}

/* fall back to rasterising the page and running OCR on it */
async function pdfOcr(doc){
  let out="";
  for(let p=1;p<=Math.min(doc.numPages,3);p++){
    const page=await doc.getPage(p);
    const vp=page.getViewport({scale:2});
    const c=document.createElement("canvas");
    c.width=vp.width; c.height=vp.height;
    await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    /* rendered at scale 2 the page is already generous, so read it untouched
       and only work on it if that comes back thin */
    let pageText=await ocrCanvas(c,3);
    if(readScore(pageText)<3){
      const alt=await ocrCanvas(c,4);
      if(readScore(alt)>readScore(pageText)) pageText=alt;
    }
    if(readScore(pageText)<3){
      const sharp=await ocrCanvas(prepCanvas(c,1),3);
      if(readScore(sharp)>readScore(pageText)) pageText=sharp;
    }
    out+=pageText+"\n";
  }
  return out;
}

function imageFromFile(file){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>res(img);
    img.onerror=()=>rej(new Error("that image couldn't be opened"));
    img.src=URL.createObjectURL(file);
  });
}

async function handleFile(file){
  const isPdf = file.type==="application/pdf" || /\.pdf$/i.test(file.name);
  busy(true,"Reading the rate card","Opening “"+file.name+"”…",null);
  setStatus("load","Reading “"+file.name+"”…");
  try{
    let text="";
    if(isPdf){
      busy(true,"Reading the rate card","Pulling the text out of the PDF…",null);
      const {text:layer,doc}=await pdfText(file);
      text=layer;
      if(applyRows(layer).n<3){                       // scanned PDF with no text layer
        busy(true,"Reading the rate card","No text layer — reading the page as an image…",null);
        text=await pdfOcr(doc);
      }
    }else{
      const img=await imageFromFile(file);
      text=(await ocrBest(img)).text;
    }
    busy(true,"Reading the rate card","Matching the rows…",100);
    await new Promise(r=>setTimeout(r,220));          // let the ring finish filling
    loadText(text,"“"+file.name+"”");
  }catch(err){
    setStatus("err","Couldn't read that file ("+err.message+"). Copy the rate rows and use “Paste rates from the sheet” below instead.");
  }finally{
    busy(false);
  }
}

/* ==========================================================================
   WORD EXPORT — drops the ratesheet on screen into this bank's Word template
   --------------------------------------------------------------------------
   The template is a real .docx carried inside this file as base64. A .docx is
   a zip of XML parts, so the export opens that zip, rewrites only the pieces
   that change inside word/document.xml, and zips it back up. Every other part
   — styles, fonts, headers, the whole bottom half of the letter — is copied
   through byte for byte, so what lands in the client's inbox is the adviser's
   own template with today's numbers in it.

   What gets replaced:
     1. the rates table at the top        -> rebuilt from the table on screen
     2. the "*Repayments are on ..." line -> every note under the ratesheet
     3. the "* ... cash for having your home loan ..." line -> removed, because
        the notes in (2) already carry the bank's own cash wording
   Everything below those notes is left exactly as the adviser wrote it.

   The table is read straight off the screen rather than out of this bank's
   internals, so the Word table always says what the adviser is looking at —
   same rows, same order, same traffic-light colours, same "Your Discount" or
   "LEM" heading — and one engine serves every bank in the book.
   ========================================================================== */

const WX_FILE   = "Loan Structure - Ratesheet - " + WORD_CFG.bank + ".docx";
const WX_TPLKEY = "wordtpl_" + WORD_CFG.id + "_v1";
let   WX_TPL    = null;   /* {name,b64} once the adviser supplies their own */

try{ WX_TPL = JSON.parse(localStorage.getItem(WX_TPLKEY) || "null"); }catch(e){ WX_TPL = null; }

/* ---------------- bytes ---------------- */
function wxB64Bytes(b64){
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return u;
}
function wxBytesB64(u8){
  let s=""; const C=0x8000;
  for(let i=0;i<u8.length;i+=C) s += String.fromCharCode.apply(null, u8.subarray(i,i+C));
  return btoa(s);
}

let WX_CRCT = null;
function wxCrc32(u8){
  if(!WX_CRCT){
    WX_CRCT = new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); WX_CRCT[n]=c>>>0; }
  }
  let c = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = WX_CRCT[(c ^ u8[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0;
}

/* Raw deflate through the browser's own Compression Streams — no library.
   A browser too old to compress simply stores the part instead, which Word
   reads perfectly well; the file is just a little larger. */
async function wxInflate(u8){
  if(typeof DecompressionStream !== "function")
    throw new Error("this browser cannot read a compressed Word template — try Chrome, Edge, or Safari 16.4 or newer");
  const st = new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function wxDeflate(u8){
  if(typeof CompressionStream !== "function") return null;
  const st = new Blob([u8]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(st).arrayBuffer());
}

/* ---------------- zip ---------------- */
function wxZipRead(buf){
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for(let i=buf.length-22; i>=0 && i > buf.length-22-65557; i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd < 0) throw new Error("that file is not a Word document");
  const count = dv.getUint16(eocd+10,true);
  let p = dv.getUint32(eocd+16,true);
  const dec = new TextDecoder(), out = [];
  for(let i=0;i<count;i++){
    if(dv.getUint32(p,true) !== 0x02014b50) throw new Error("that Word document is damaged");
    const method=dv.getUint16(p+10,true), mtime=dv.getUint16(p+12,true), mdate=dv.getUint16(p+14,true),
          crc=dv.getUint32(p+16,true), csize=dv.getUint32(p+20,true), usize=dv.getUint32(p+24,true),
          nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true),
          lho=dv.getUint32(p+42,true);
    const name = dec.decode(buf.subarray(p+46, p+46+nlen));
    const dstart = lho + 30 + dv.getUint16(lho+26,true) + dv.getUint16(lho+28,true);
    out.push({ name, method, crc, csize, usize, mtime, mdate, data: buf.subarray(dstart, dstart+csize) });
    p += 46 + nlen + elen + clen;
  }
  return out;
}

function wxZipWrite(entries){
  const enc = new TextEncoder(), body = [], dir = [];
  let off = 0;
  entries.forEach(e => {
    const nm = enc.encode(e.name);
    const lh = new Uint8Array(30 + nm.length), lv = new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0,true);
    lv.setUint16(8,e.method,true);   lv.setUint16(10,e.mtime,true); lv.setUint16(12,e.mdate,true);
    lv.setUint32(14,e.crc,true);     lv.setUint32(18,e.csize,true); lv.setUint32(22,e.usize,true);
    lv.setUint16(26,nm.length,true); lv.setUint16(28,0,true);
    lh.set(nm,30);
    body.push(lh, e.data);

    const ch = new Uint8Array(46 + nm.length), cv = new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true); cv.setUint16(8,0,true);
    cv.setUint16(10,e.method,true);  cv.setUint16(12,e.mtime,true); cv.setUint16(14,e.mdate,true);
    cv.setUint32(16,e.crc,true);     cv.setUint32(20,e.csize,true); cv.setUint32(24,e.usize,true);
    cv.setUint16(28,nm.length,true); cv.setUint32(42,off,true);
    ch.set(nm,46);
    dir.push(ch);
    off += lh.length + e.data.length;
  });
  const dirSize = dir.reduce((a,b)=>a+b.length,0);
  const eo = new Uint8Array(22), ev = new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(8,entries.length,true); ev.setUint16(10,entries.length,true);
  ev.setUint32(12,dirSize,true);       ev.setUint32(16,off,true);
  return new Blob(body.concat(dir,[eo]),
    {type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

/* ---------------- reading the table off the screen ---------------- */
function wxText(el){
  const c = el.cloneNode(true);
  Array.prototype.forEach.call(c.querySelectorAll("br"), function(b){ b.parentNode.replaceChild(document.createTextNode(" "), b); });
  return (c.textContent || "").replace(/\s+/g," ").trim();
}
/* On screen some banks reverse their heading strip out of a coloured bar. The
   Word table keeps the template's plain white look, so anything close to white
   would vanish — those cells come back as black instead. */
function wxHex(css){
  const m = /rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(css || "");
  if(!m) return "000000";
  const r = +m[1], g = +m[2], b = +m[3];
  if(0.299*r + 0.587*g + 0.114*b > 215) return "000000";
  return [r,g,b].map(function(v){ return ("0" + v.toString(16)).slice(-2); }).join("").toUpperCase();
}

/* Turns a <thead>/<tbody> into a rectangular grid so rowspan and colspan can
   be replayed as Word's vMerge and gridSpan. */
function wxGrid(section){
  const grid = [];
  Array.prototype.forEach.call(section.rows, function(tr, r){
    grid[r] = grid[r] || [];
    let c = 0;
    Array.prototype.forEach.call(tr.cells, function(td){
      while(grid[r][c]) c++;
      const cs = td.colSpan || 1, rs = td.rowSpan || 1;
      for(let i=0;i<rs;i++){
        grid[r+i] = grid[r+i] || [];
        for(let j=0;j<cs;j++)
          grid[r+i][c+j] = { td:td, span:cs, rows:rs, colStart:(j===0), rowStart:(i===0) };
      }
      c += cs;
    });
  });
  return grid;
}

function wxReadCell(td, head){
  const cs = getComputedStyle(td);
  return {
    text:  wxText(td),
    color: head ? "000000" : wxHex(cs.color),
    bold:  head || parseInt(cs.fontWeight,10) >= 600 || cs.fontWeight === "bold",
    align: cs.textAlign === "right" ? "right" : (cs.textAlign === "left" || cs.textAlign === "start") ? "left" : "center"
  };
}

/* ---------------- column widths, so every row stays on one line ----------
   Data cells are measured at full length and never allowed to wrap. Header
   cells may still wrap onto the second deck, exactly as the template does, so
   a long heading never squeezes the rows. If even the unwrappable content is
   wider than the page, the whole table steps down a point size until it fits
   rather than breaking a row in two. */
let WX_MEAS = null;
function wxWidth(text, bold, pt){
  if(!WX_MEAS) WX_MEAS = document.createElement("canvas").getContext("2d");
  WX_MEAS.font = (bold ? "bold " : "") + (pt * 4 / 3) + 'px Calibri, Carlito, Candara, "Segoe UI", Arial, sans-serif';
  return WX_MEAS.measureText(text).width * 15;          /* px -> twips */
}
const WX_PAD = 200;                                      /* cell margins + a little air */

function wxColumnWidths(head, body, cols, avail, pt){
  const min = new Array(cols).fill(240), want = new Array(cols).fill(240);
  /* A cell that spans columns only has to fit across the columns it covers,
     so its width is claimed once, from the column it starts in. */
  function claim(arr, from, span, need){
    span = Math.min(span, cols - from);
    if(span < 1) return;
    let have = 0;
    for(let i=0;i<span;i++) have += arr[from+i];
    if(need <= have) return;
    const extra = (need - have) / span;
    for(let i=0;i<span;i++) arr[from+i] += extra;
  }
  body.forEach(function(row){
    row.forEach(function(c){
      if(!c || !c.colStart) return;
      const w = wxWidth(c.text, c.bold, pt) + WX_PAD;
      claim(min, c.col, c.span, w); claim(want, c.col, c.span, w);
    });
  });
  head.forEach(function(row){
    row.forEach(function(c){
      if(!c || !c.colStart) return;
      const longest = c.text.split(" ").reduce(function(a,w){ return Math.max(a, wxWidth(w, c.bold, pt)); }, 0);
      claim(min,  c.col, c.span, longest + WX_PAD);
      claim(want, c.col, c.span, wxWidth(c.text, c.bold, pt) + WX_PAD);
    });
  });

  const sumMin = min.reduce(function(a,b){ return a+b; }, 0);
  if(sumMin > avail) return null;                        /* caller drops a point size */

  const sumWant = want.reduce(function(a,b){ return a+b; }, 0);
  let out;
  if(sumWant <= avail){
    const slack = (avail - sumWant) / cols;
    out = want.map(function(w){ return w + slack; });
  }else{
    const room = avail - sumMin, hunger = sumWant - sumMin;
    out = min.map(function(w,i){ return w + room * ((want[i]-w) / hunger); });
  }
  out = out.map(function(w){ return Math.round(w); });
  out[cols-1] += avail - out.reduce(function(a,b){ return a+b; }, 0);
  return out;
}

/* ---------------- WordprocessingML ---------------- */
function wxEsc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function wxBd(tag, kind){
  return kind === "nil"
    ? '<w:' + tag + ' w:val="nil"/>'
    : '<w:' + tag + ' w:val="single" w:sz="8" w:space="0" w:color="auto"/>';
}
function wxP(c, pt){
  const sz = Math.round(pt * 2);
  const rpr = '<w:rFonts w:ascii="Calibri" w:eastAsia="Times New Roman" w:hAnsi="Calibri" w:cs="Calibri"/>' +
              (c.bold ? "<w:b/><w:bCs/>" : "") +
              '<w:color w:val="' + c.color + '"/>' +
              '<w:sz w:val="' + sz + '"/><w:szCs w:val="' + sz + '"/><w:lang w:eastAsia="en-GB"/>';
  const jc = c.align === "left" ? "" : '<w:jc w:val="' + (c.align === "right" ? "right" : "center") + '"/>';
  return '<w:p><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/>' + jc +
         "<w:rPr>" + rpr + "</w:rPr></w:pPr>" +
         (c.text === "" ? "" : "<w:r><w:rPr>" + rpr + '</w:rPr><w:t xml:space="preserve">' + wxEsc(c.text) + "</w:t></w:r>") +
         "</w:p>";
}
function wxTc(w, inner, o){
  const b = o.bd;
  return '<w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/>' +
    (o.span > 1 ? '<w:gridSpan w:val="' + o.span + '"/>' : "") +
    (o.vm === "restart" ? '<w:vMerge w:val="restart"/>' : o.vm === "cont" ? "<w:vMerge/>" : "") +
    "<w:tcBorders>" + wxBd("top",b.t) + wxBd("left",b.l) + wxBd("bottom",b.b) + wxBd("right",b.r) + "</w:tcBorders>" +
    (o.noWrap ? "<w:noWrap/>" : "") +
    '<w:vAlign w:val="center"/></w:tcPr>' + inner + "</w:tc>";
}

function wxBuildTable(head, body, widths, pt){
  const cols = widths.length;
  let x = '<w:tbl><w:tblPr><w:tblW w:w="' + widths.reduce(function(a,b){return a+b;},0) + '" w:type="dxa"/>' +
          '<w:tblCellMar><w:left w:w="85" w:type="dxa"/><w:right w:w="85" w:type="dxa"/></w:tblCellMar>' +
          '<w:tblLook w:val="04A0" w:firstRow="1" w:lastRow="0" w:firstColumn="1" w:lastColumn="0" w:noHBand="0" w:noVBand="1"/>' +
          "</w:tblPr><w:tblGrid>" + widths.map(function(w){ return '<w:gridCol w:w="' + w + '"/>'; }).join("") + "</w:tblGrid>";

  function emit(rows, isHead){
    rows.forEach(function(row, r){
      x += '<w:tr><w:trPr>' + (isHead ? "<w:tblHeader/>" : '<w:trHeight w:val="340"/>') + "</w:trPr>";
      for(let c=0;c<cols;c++){
        const cell = row[c];
        if(!cell || !cell.colStart) continue;
        let w = 0; for(let i=0;i<cell.span;i++) w += widths[c+i];
        /* the header is boxed in; below it the horizontal rules come from each
           row's own bottom edge and the verticals from the cell to the left */
        const bd = isHead
          ? { t:"single", l:"single", b:"single", r:"single" }
          : { t:"nil", l:(c === 0 ? "single" : "nil"), b:"single", r:"single" };
        x += wxTc(w, wxP(cell, pt), {
          span: cell.span,
          vm: cell.rows > 1 ? (cell.rowStart ? "restart" : "cont") : null,
          bd: bd,
          noWrap: !isHead
        });
      }
      x += "</w:tr>";
    });
  }
  emit(head, true);
  emit(body, false);
  return x + "</w:tbl>";
}

function wxNote(text){
  const rpr = '<w:rPr><w:rFonts w:cstheme="minorHAnsi"/><w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr>';
  return '<w:p><w:pPr><w:spacing w:after="0"/>' + rpr + "</w:pPr>" +
         "<w:r>" + rpr + '<w:t xml:space="preserve">' + wxEsc(text) + "</w:t></w:r></w:p>";
}

/* ---------------- surgery on word/document.xml ---------------- */
function wxFindTable(xml){
  const scan = /<w:tbl[\s>]|<\/w:tbl>/g;
  let m, start = -1, depth = 0;
  while((m = scan.exec(xml))){
    if(m[0].charAt(1) === "/"){ if(--depth === 0) return {start:start, end:scan.lastIndex}; }
    else { if(depth === 0) start = m.index; depth++; }
  }
  return null;
}
function wxFindPara(xml, needle){
  const i = xml.indexOf(needle);
  if(i < 0) return null;
  const s = Math.max(xml.lastIndexOf("<w:p ", i), xml.lastIndexOf("<w:p>", i));
  const e = xml.indexOf("</w:p>", i);
  if(s < 0 || e < 0) return null;
  return {start:s, end:e+6};
}
function wxSplice(xml, at, text){ return xml.slice(0, at.start) + text + xml.slice(at.end); }

/* the width of the template's own text column, so the table lines up with the
   paragraphs underneath it instead of hanging into the margin */
function wxTextWidth(xml){
  const pg = /<w:pgSz\b[^>]*w:w="(\d+)"/.exec(xml);
  const mg = /<w:pgMar\b[^>]*>/.exec(xml);
  if(!pg || !mg) return 9026;
  const left  = /w:left="(\d+)"/.exec(mg[0]);
  const right = /w:right="(\d+)"/.exec(mg[0]);
  const w = +pg[1] - (left ? +left[1] : 1440) - (right ? +right[1] : 1440);
  return w > 2000 ? w : 9026;
}

/* ---------------- the ratesheet on screen ---------------- */
function wxScrape(){
  const table = document.querySelector(WORD_CFG.table);
  if(!table || !table.tHead || !table.tBodies.length || !table.tBodies[0].rows.length)
    throw new Error("there is no ratesheet on screen yet — fill in the deal first");

  const hg = wxGrid(table.tHead), bg = wxGrid(table.tBodies[0]);
  const cols = Math.max.apply(null, hg.concat(bg).map(function(r){ return r.length; }));

  function pack(grid, head){
    return grid.map(function(row){
      const out = new Array(cols).fill(null);
      for(let c=0;c<cols;c++){
        const g = row[c];
        if(!g) continue;
        const cell = wxReadCell(g.td, head);
        cell.span = g.span; cell.rows = g.rows; cell.colStart = g.colStart; cell.rowStart = g.rowStart; cell.col = c;
        out[c] = cell;
      }
      return out;
    });
  }
  const head = pack(hg, true), body = pack(bg, false);

  const footEl = WORD_CFG.foot ? document.querySelector(WORD_CFG.foot) : null;
  let notes = [];
  if(footEl){
    const divs = Array.prototype.filter.call(footEl.querySelectorAll("div"), function(d){ return !d.querySelector("div"); });
    if(divs.length) notes = divs.map(wxText);
    else notes = footEl.innerHTML.split(/<br\s*\/?>/i).map(function(part){
      const t = document.createElement("div"); t.innerHTML = part; return wxText(t);
    });
  }
  notes = notes.filter(function(t){ return t; });

  return {head:head, body:body, cols:cols, notes:notes};
}

function wxFill(xml){
  const s = wxScrape();
  const avail = wxTextWidth(xml);

  let pt = 14, widths = null;
  while(pt >= 8 && !(widths = wxColumnWidths(s.head, s.body, s.cols, avail, pt))) pt -= 0.5;
  if(!widths) throw new Error("the ratesheet has more columns than will fit on the page");

  const tbl = wxFindTable(xml);
  if(!tbl) throw new Error("no table found in that template — the rates table has to be the first table in the document");
  xml = wxSplice(xml, tbl, wxBuildTable(s.head, s.body, widths, pt));

  if(s.notes.length){
    /* The template's cash line goes first. Left until afterwards, the search
       would find the freshly written note instead and delete that, leaving the
       placeholder behind. */
    const cp = wxFindPara(xml, "cash for having your home loan");
    if(cp) xml = wxSplice(xml, cp, "");
    const rp = wxFindPara(xml, "Repayments are on");
    if(rp) xml = wxSplice(xml, rp, s.notes.map(wxNote).join(""));
  }
  return xml;
}

/* ---------------- build and hand over the file ---------------- */
async function wxBuild(){
  const parts = wxZipRead(wxB64Bytes(WX_TPL ? WX_TPL.b64 : WORD_TEMPLATE_B64));
  const doc = parts.filter(function(p){ return p.name === "word/document.xml"; })[0];
  if(!doc) throw new Error("that file is not a Word document");

  const raw = doc.method === 8 ? await wxInflate(doc.data) : doc.data;
  const out = new TextEncoder().encode(wxFill(new TextDecoder().decode(raw)));

  const packed = await wxDeflate(out);
  doc.method = packed ? 8 : 0;
  doc.data   = packed || out;
  doc.csize  = doc.data.length;
  doc.usize  = out.length;
  doc.crc    = wxCrc32(out);

  return wxZipWrite(parts);
}

/* A blob link clicked inside this frame is refused by some browsers, so the
   link is hung off the outer page whenever that page is reachable. */
function wxSave(blob, name){
  let doc = document;
  try{ if(window.top && window.top.document && window.top.document.body) doc = window.top.document; }catch(e){}
  const url = URL.createObjectURL(blob);
  const a = doc.createElement("a");
  a.href = url; a.download = name; a.style.display = "none";
  doc.body.appendChild(a); a.click();
  setTimeout(function(){ try{ a.parentNode.removeChild(a); }catch(e){} URL.revokeObjectURL(url); }, 30000);
}

/* ---------------- controls ---------------- */
(function(){
  const anchor = document.querySelector(WORD_CFG.mount);
  if(!anchor) return;
  const host = anchor.closest(".fld") || anchor;
  const wrap = document.createElement("span");
  wrap.style.cssText = "display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap";
  wrap.innerHTML =
    '<button type="button" class="' + WORD_CFG.cls + '" id="wordBtn">Download Word</button>' +
    '<button type="button" class="' + WORD_CFG.ghost + '" id="tplBtn">Word template…</button>' +
    '<button type="button" id="tplReset" hidden style="background:none;border:0;padding:0;font:inherit;font-size:11px;text-decoration:underline;cursor:pointer;color:inherit;opacity:.75"></button>' +
    '<span id="wordStatus" style="font-size:11px;opacity:.8"></span>' +
    '<input type="file" id="tplFile" accept=".docx" style="display:none">';
  if(host.parentNode) host.parentNode.insertBefore(wrap, host.nextSibling);

  const $$ = function(id){ return document.getElementById(id); };
  let timer = null;
  function say(msg){
    const el = $$("wordStatus"); if(!el) return;
    el.textContent = msg || "";
    clearTimeout(timer);
    if(msg) timer = setTimeout(function(){ el.textContent = ""; }, 6000);
  }
  function paint(){
    $$("tplBtn").textContent = WX_TPL ? "Template: " + WX_TPL.name : "Word template…";
    $$("tplBtn").title = WX_TPL
      ? "Downloads use your own template. Click to choose a different one."
      : "Downloads use the built-in " + WORD_CFG.bank + " template. Click to use your own .docx instead.";
    $$("tplReset").hidden = !WX_TPL;
    $$("tplReset").textContent = "use the built-in one";
  }
  function setTpl(t){
    WX_TPL = t;
    try{ t ? localStorage.setItem(WX_TPLKEY, JSON.stringify(t)) : localStorage.removeItem(WX_TPLKEY); }
    catch(e){ say("Loaded for now, but there is no room to remember it."); }
    paint();
  }

  $$("wordBtn").addEventListener("click", async function(){
    const b = $$("wordBtn"), was = b.textContent;
    b.disabled = true; b.textContent = "Building…";
    try{ wxSave(await wxBuild(), WX_FILE); say("Saved — " + WX_FILE); }
    catch(err){ say("Could not build it: " + err.message); }
    finally{ b.disabled = false; b.textContent = was; }
  });
  $$("tplBtn").addEventListener("click", function(){ $$("tplFile").click(); });
  $$("tplReset").addEventListener("click", function(){ setTpl(null); say("Back to the built-in " + WORD_CFG.bank + " template."); });
  $$("tplFile").addEventListener("change", function(e){
    const f = e.target.files[0]; e.target.value = "";
    if(!f) return;
    if(!/\.docx$/i.test(f.name)){ say("Please choose a .docx file."); return; }
    const fr = new FileReader();
    fr.onerror = function(){ say("That file could not be read."); };
    fr.onload = function(){
      try{
        const bytes = new Uint8Array(fr.result);
        if(!wxZipRead(bytes).some(function(p){ return p.name === "word/document.xml"; }))
          throw new Error("that file is not a Word document");
        setTpl({ name:f.name, b64:wxBytesB64(bytes) });
        say("Template set — " + f.name);
      }catch(err){ say("Could not use that template: " + err.message); }
    };
    fr.readAsArrayBuffer(f);
  });
  paint();
})();

<\/script>

</script>

<script type="text/plain" id="src-coop" data-file="cooperative_bank_calculator_1.html">

<title>The Co-operative Bank Ratesheet Calculator</title>
<style>
  :root{
    --plum:#3E1843;

  /* Motion + busy */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes riseIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes markPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}

  .ring .glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:markPulse 1.5s ease-in-out infinite}
  .busytitle{font-size:14.5px;font-weight:800;color:var(--plum);letter-spacing:-.1px}
  .busysub{font-size:12px;color:var(--ink-3);margin-top:6px;min-height:16px;line-height:1.5}

  .drop.working{border-style:solid;border-color:var(--green);cursor:progress;background:linear-gradient(100deg,#fff 35%,rgba(22,166,76,.16) 50%,#fff 65%);background-size:220% 100%;animation:shimmer 1.3s linear infinite}
  .drop.working .ic{background:var(--green);animation:markPulse 1.3s ease-in-out infinite}
  button.act.done,button.act.done:hover{background:var(--green-2);border-color:var(--green-2);color:#fff}
  button.act.done{animation:pop .22s cubic-bezier(.2,.8,.3,1)}

  @media(prefers-reduced-motion:reduce){
    .busy,.busycard,.ring.spin > svg,.ring .glyph,.drop.working,.drop.working .ic,button.act.done,.parse-status.show{animation:none!important}

  }

  @media print{

    .toolbar,details.rateedit,.card.deals,header .logo,.parse-status,.editnote,.seg,.busy{display:none!important}

    table.rs td,table.rs th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>

      <button class="rule-reset" id="ratesreset" style="margin-left:0">Reset rates to default</button>

  </details>

  <\!-- LOW EQUITY PREMIUM -->
  <details class="rateedit">

      <div class="ruleset">

          <b>Owner Occupied rates</b>
          <p>Owner occupied lending where the home loan is no more than <input class="ninp pct" data-rule="lvrThreshold" id="r_thresh"> % of the property's value — or a Kāinga Ora First Home Loan. Above that the deal prices off Standard rates plus the Low Equity Premium. Investment property always prices off Standard.</p>
        </div>

        </div>
        <div class="rl">
          <b>Kāinga Ora First Home Loan</b>
          <p>Prices off Owner Occupied or First Home Buyer Special rates whatever the LVR. Lender's Mortgage Insurance of <input class="ninp pct" data-rule="koLmiPct" id="r_lmi"> % of the loan balance applies.</p>
        </div>
        <div class="rl">
          <b>Revolving Credit</b>

            <ul>
              <li>New home loan over $<input class="ninp money" data-cash="minLoan" id="c_min"> — the minimum is exclusive, so the loan has to clear it.</li>
              <li>Owner occupied and bought as the applicant's first home. Investment and rental property does not qualify.</li>
              <li>Applicant is classified as a First Home Buyer.</li>
            </ul>
            <p>Pays up to <input class="ninp pct" data-cash="pct" id="c_pct"> % of the new lending amount, maximum payment of $<input class="ninp money" data-cash="cap" id="c_cap">.</p>
