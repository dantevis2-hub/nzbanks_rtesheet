/* ==========================================================================
   WORD EXPORT — drops the ratesheet on screen into this bank's Word template
   --------------------------------------------------------------------------
   The template is a real .docx carried inside this file as base64. A .docx is
   a zip of XML parts, so the export opens that zip, rewrites only the pieces
   that change inside word/document.xml, and zips it back up. Every other part
   — styles, fonts, headers, the whole bottom half of the letter — is copied
   through byte for byte, so what lands in the client's inbox is the adviser's
   own template with today's numbers in it.

   What gets replaced:
     1. the rates table at the top        -> rebuilt from the table on screen
     2. the "*Repayments are on ..." line -> every note under the ratesheet
     3. the "* ... cash for having your home loan ..." line -> removed, because
        the notes in (2) already carry the bank's own cash wording
   Everything below those notes is left exactly as the adviser wrote it.

   The table is read straight off the screen rather than out of this bank's
   internals, so the Word table always says what the adviser is looking at —
   same rows, same order, same traffic-light colours, same "Your Discount" or
   "LEM" heading — and one engine serves every bank in the book.
   ========================================================================== */

const WX_FILE   = "Loan Structure - Ratesheet - " + WORD_CFG.bank + ".docx";
const WX_TPLKEY = "wordtpl_" + WORD_CFG.id + "_v1";
let   WX_TPL    = null;   /* {name,b64} once the adviser supplies their own */

try{ WX_TPL = JSON.parse(localStorage.getItem(WX_TPLKEY) || "null"); }catch(e){ WX_TPL = null; }

/* ---------------- bytes ---------------- */
function wxB64Bytes(b64){
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return u;
}
function wxBytesB64(u8){
  let s=""; const C=0x8000;
  for(let i=0;i<u8.length;i+=C) s += String.fromCharCode.apply(null, u8.subarray(i,i+C));
  return btoa(s);
}

let WX_CRCT = null;
function wxCrc32(u8){
  if(!WX_CRCT){
    WX_CRCT = new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); WX_CRCT[n]=c>>>0; }
  }
  let c = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = WX_CRCT[(c ^ u8[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0;
}

/* Raw deflate through the browser's own Compression Streams — no library.
   A browser too old to compress simply stores the part instead, which Word
   reads perfectly well; the file is just a little larger. */
async function wxInflate(u8){
  if(typeof DecompressionStream !== "function")
    throw new Error("this browser cannot read a compressed Word template — try Chrome, Edge, or Safari 16.4 or newer");
  const st = new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function wxDeflate(u8){
  if(typeof CompressionStream !== "function") return null;
  const st = new Blob([u8]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(st).arrayBuffer());
}

/* ---------------- zip ---------------- */
function wxZipRead(buf){
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for(let i=buf.length-22; i>=0 && i > buf.length-22-65557; i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd < 0) throw new Error("that file is not a Word document");
  const count = dv.getUint16(eocd+10,true);
  let p = dv.getUint32(eocd+16,true);
  const dec = new TextDecoder(), out = [];
  for(let i=0;i<count;i++){
    if(dv.getUint32(p,true) !== 0x02014b50) throw new Error("that Word document is damaged");
    const method=dv.getUint16(p+10,true), mtime=dv.getUint16(p+12,true), mdate=dv.getUint16(p+14,true),
          crc=dv.getUint32(p+16,true), csize=dv.getUint32(p+20,true), usize=dv.getUint32(p+24,true),
          nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true),
          lho=dv.getUint32(p+42,true);
    const name = dec.decode(buf.subarray(p+46, p+46+nlen));
    const dstart = lho + 30 + dv.getUint16(lho+26,true) + dv.getUint16(lho+28,true);
    out.push({ name, method, crc, csize, usize, mtime, mdate, data: buf.subarray(dstart, dstart+csize) });
    p += 46 + nlen + elen + clen;
  }
  return out;
}

function wxZipWrite(entries){
  const enc = new TextEncoder(), body = [], dir = [];
  let off = 0;
  entries.forEach(e => {
    const nm = enc.encode(e.name);
    const lh = new Uint8Array(30 + nm.length), lv = new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0,true);
    lv.setUint16(8,e.method,true);   lv.setUint16(10,e.mtime,true); lv.setUint16(12,e.mdate,true);
    lv.setUint32(14,e.crc,true);     lv.setUint32(18,e.csize,true); lv.setUint32(22,e.usize,true);
    lv.setUint16(26,nm.length,true); lv.setUint16(28,0,true);
    lh.set(nm,30);
    body.push(lh, e.data);

    const ch = new Uint8Array(46 + nm.length), cv = new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true); cv.setUint16(8,0,true);
    cv.setUint16(10,e.method,true);  cv.setUint16(12,e.mtime,true); cv.setUint16(14,e.mdate,true);
    cv.setUint32(16,e.crc,true);     cv.setUint32(20,e.csize,true); cv.setUint32(24,e.usize,true);
    cv.setUint16(28,nm.length,true); cv.setUint32(42,off,true);
    ch.set(nm,46);
    dir.push(ch);
    off += lh.length + e.data.length;
  });
  const dirSize = dir.reduce((a,b)=>a+b.length,0);
  const eo = new Uint8Array(22), ev = new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(8,entries.length,true); ev.setUint16(10,entries.length,true);
  ev.setUint32(12,dirSize,true);       ev.setUint32(16,off,true);
  return new Blob(body.concat(dir,[eo]),
    {type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

/* ---------------- reading the table off the screen ---------------- */
function wxText(el){
  const c = el.cloneNode(true);
  Array.prototype.forEach.call(c.querySelectorAll("br"), function(b){ b.parentNode.replaceChild(document.createTextNode(" "), b); });
  return (c.textContent || "").replace(/\s+/g," ").trim();
}
/* On screen some banks reverse their heading strip out of a coloured bar. The
   Word table keeps the template's plain white look, so anything close to white
   would vanish — those cells come back as black instead. */
function wxHex(css){
  const m = /rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(css || "");
  if(!m) return "000000";
  const r = +m[1], g = +m[2], b = +m[3];
  if(0.299*r + 0.587*g + 0.114*b > 215) return "000000";
  return [r,g,b].map(function(v){ return ("0" + v.toString(16)).slice(-2); }).join("").toUpperCase();
}

/* Turns a <thead>/<tbody> into a rectangular grid so rowspan and colspan can
   be replayed as Word's vMerge and gridSpan. */
function wxGrid(section){
  const grid = [];
  Array.prototype.forEach.call(section.rows, function(tr, r){
    grid[r] = grid[r] || [];
    let c = 0;
    Array.prototype.forEach.call(tr.cells, function(td){
      while(grid[r][c]) c++;
      const cs = td.colSpan || 1, rs = td.rowSpan || 1;
      for(let i=0;i<rs;i++){
        grid[r+i] = grid[r+i] || [];
        for(let j=0;j<cs;j++)
          grid[r+i][c+j] = { td:td, span:cs, rows:rs, colStart:(j===0), rowStart:(i===0) };
      }
      c += cs;
    });
  });
  return grid;
}

function wxReadCell(td, head){
  const cs = getComputedStyle(td);
  return {
    text:  wxText(td),
    color: head ? "000000" : wxHex(cs.color),
    bold:  head || parseInt(cs.fontWeight,10) >= 600 || cs.fontWeight === "bold",
    align: cs.textAlign === "right" ? "right" : (cs.textAlign === "left" || cs.textAlign === "start") ? "left" : "center"
  };
}

/* ---------------- column widths, so every row stays on one line ----------
   Data cells are measured at full length and never allowed to wrap. Header
   cells may still wrap onto the second deck, exactly as the template does, so
   a long heading never squeezes the rows. If even the unwrappable content is
   wider than the page, the whole table steps down a point size until it fits
   rather than breaking a row in two. */
let WX_MEAS = null;
function wxWidth(text, bold, pt){
  if(!WX_MEAS) WX_MEAS = document.createElement("canvas").getContext("2d");
  WX_MEAS.font = (bold ? "bold " : "") + (pt * 4 / 3) + 'px Calibri, Carlito, Candara, "Segoe UI", Arial, sans-serif';
  return WX_MEAS.measureText(text).width * 15;          /* px -> twips */
}
const WX_PAD = 200;                                      /* cell margins + a little air */

function wxColumnWidths(head, body, cols, avail, pt){
  const min = new Array(cols).fill(240), want = new Array(cols).fill(240);
  /* A cell that spans columns only has to fit across the columns it covers,
     so its width is claimed once, from the column it starts in. */
  function claim(arr, from, span, need){
    span = Math.min(span, cols - from);
    if(span < 1) return;
    let have = 0;
    for(let i=0;i<span;i++) have += arr[from+i];
    if(need <= have) return;
    const extra = (need - have) / span;
    for(let i=0;i<span;i++) arr[from+i] += extra;
  }
  body.forEach(function(row){
    row.forEach(function(c){
      if(!c || !c.colStart) return;
      const w = wxWidth(c.text, c.bold, pt) + WX_PAD;
      claim(min, c.col, c.span, w); claim(want, c.col, c.span, w);
    });
  });
  head.forEach(function(row){
    row.forEach(function(c){
      if(!c || !c.colStart) return;
      const longest = c.text.split(" ").reduce(function(a,w){ return Math.max(a, wxWidth(w, c.bold, pt)); }, 0);
      claim(min,  c.col, c.span, longest + WX_PAD);
      claim(want, c.col, c.span, wxWidth(c.text, c.bold, pt) + WX_PAD);
    });
  });

  const sumMin = min.reduce(function(a,b){ return a+b; }, 0);
  if(sumMin > avail) return null;                        /* caller drops a point size */

  const sumWant = want.reduce(function(a,b){ return a+b; }, 0);
  let out;
  if(sumWant <= avail){
    const slack = (avail - sumWant) / cols;
    out = want.map(function(w){ return w + slack; });
  }else{
    const room = avail - sumMin, hunger = sumWant - sumMin;
    out = min.map(function(w,i){ return w + room * ((want[i]-w) / hunger); });
  }
  out = out.map(function(w){ return Math.round(w); });
  out[cols-1] += avail - out.reduce(function(a,b){ return a+b; }, 0);
  return out;
}

/* ---------------- WordprocessingML ---------------- */
function wxEsc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function wxBd(tag, kind){
  return kind === "nil"
    ? '<w:' + tag + ' w:val="nil"/>'
    : '<w:' + tag + ' w:val="single" w:sz="8" w:space="0" w:color="auto"/>';
}
function wxP(c, pt){
  const sz = Math.round(pt * 2);
  const rpr = '<w:rFonts w:ascii="Calibri" w:eastAsia="Times New Roman" w:hAnsi="Calibri" w:cs="Calibri"/>' +
              (c.bold ? "<w:b/><w:bCs/>" : "") +
              '<w:color w:val="' + c.color + '"/>' +
              '<w:sz w:val="' + sz + '"/><w:szCs w:val="' + sz + '"/><w:lang w:eastAsia="en-GB"/>';
  const jc = c.align === "left" ? "" : '<w:jc w:val="' + (c.align === "right" ? "right" : "center") + '"/>';
  return '<w:p><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/>' + jc +
         "<w:rPr>" + rpr + "</w:rPr></w:pPr>" +
         (c.text === "" ? "" : "<w:r><w:rPr>" + rpr + '</w:rPr><w:t xml:space="preserve">' + wxEsc(c.text) + "</w:t></w:r>") +
         "</w:p>";
}
function wxTc(w, inner, o){
  const b = o.bd;
  return '<w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/>' +
    (o.span > 1 ? '<w:gridSpan w:val="' + o.span + '"/>' : "") +
    (o.vm === "restart" ? '<w:vMerge w:val="restart"/>' : o.vm === "cont" ? "<w:vMerge/>" : "") +
    "<w:tcBorders>" + wxBd("top",b.t) + wxBd("left",b.l) + wxBd("bottom",b.b) + wxBd("right",b.r) + "</w:tcBorders>" +
    (o.noWrap ? "<w:noWrap/>" : "") +
    '<w:vAlign w:val="center"/></w:tcPr>' + inner + "</w:tc>";
}

function wxBuildTable(head, body, widths, pt){
  const cols = widths.length;
  let x = '<w:tbl><w:tblPr><w:tblW w:w="' + widths.reduce(function(a,b){return a+b;},0) + '" w:type="dxa"/>' +
          '<w:tblCellMar><w:left w:w="85" w:type="dxa"/><w:right w:w="85" w:type="dxa"/></w:tblCellMar>' +
          '<w:tblLook w:val="04A0" w:firstRow="1" w:lastRow="0" w:firstColumn="1" w:lastColumn="0" w:noHBand="0" w:noVBand="1"/>' +
          "</w:tblPr><w:tblGrid>" + widths.map(function(w){ return '<w:gridCol w:w="' + w + '"/>'; }).join("") + "</w:tblGrid>";

  function emit(rows, isHead){
    rows.forEach(function(row, r){
      x += '<w:tr><w:trPr>' + (isHead ? "<w:tblHeader/>" : '<w:trHeight w:val="340"/>') + "</w:trPr>";
      for(let c=0;c<cols;c++){
        const cell = row[c];
        if(!cell || !cell.colStart) continue;
        let w = 0; for(let i=0;i<cell.span;i++) w += widths[c+i];
        /* the header is boxed in; below it the horizontal rules come from each
           row's own bottom edge and the verticals from the cell to the left */
        const bd = isHead
          ? { t:"single", l:"single", b:"single", r:"single" }
          : { t:"nil", l:(c === 0 ? "single" : "nil"), b:"single", r:"single" };
        x += wxTc(w, wxP(cell, pt), {
          span: cell.span,
          vm: cell.rows > 1 ? (cell.rowStart ? "restart" : "cont") : null,
          bd: bd,
          noWrap: !isHead
        });
      }
      x += "</w:tr>";
    });
  }
  emit(head, true);
  emit(body, false);
  return x + "</w:tbl>";
}

function wxNote(text){
  const rpr = '<w:rPr><w:rFonts w:cstheme="minorHAnsi"/><w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr>';
  return '<w:p><w:pPr><w:spacing w:after="0"/>' + rpr + "</w:pPr>" +
         "<w:r>" + rpr + '<w:t xml:space="preserve">' + wxEsc(text) + "</w:t></w:r></w:p>";
}

/* ---------------- surgery on word/document.xml ---------------- */
function wxFindTable(xml){
  const scan = /<w:tbl[\s>]|<\/w:tbl>/g;
  let m, start = -1, depth = 0;
  while((m = scan.exec(xml))){
    if(m[0].charAt(1) === "/"){ if(--depth === 0) return {start:start, end:scan.lastIndex}; }
    else { if(depth === 0) start = m.index; depth++; }
  }
  return null;
}
function wxFindPara(xml, needle){
  const i = xml.indexOf(needle);
  if(i < 0) return null;
  const s = Math.max(xml.lastIndexOf("<w:p ", i), xml.lastIndexOf("<w:p>", i));
  const e = xml.indexOf("</w:p>", i);
  if(s < 0 || e < 0) return null;
  return {start:s, end:e+6};
}
function wxSplice(xml, at, text){ return xml.slice(0, at.start) + text + xml.slice(at.end); }

/* the width of the template's own text column, so the table lines up with the
   paragraphs underneath it instead of hanging into the margin */
function wxTextWidth(xml){
  const pg = /<w:pgSz\b[^>]*w:w="(\d+)"/.exec(xml);
  const mg = /<w:pgMar\b[^>]*>/.exec(xml);
  if(!pg || !mg) return 9026;
  const left  = /w:left="(\d+)"/.exec(mg[0]);
  const right = /w:right="(\d+)"/.exec(mg[0]);
  const w = +pg[1] - (left ? +left[1] : 1440) - (right ? +right[1] : 1440);
  return w > 2000 ? w : 9026;
}

/* ---------------- the ratesheet on screen ---------------- */
function wxScrape(){
  const table = document.querySelector(WORD_CFG.table);
  if(!table || !table.tHead || !table.tBodies.length || !table.tBodies[0].rows.length)
    throw new Error("there is no ratesheet on screen yet — fill in the deal first");

  const hg = wxGrid(table.tHead), bg = wxGrid(table.tBodies[0]);
  const cols = Math.max.apply(null, hg.concat(bg).map(function(r){ return r.length; }));

  function pack(grid, head){
    return grid.map(function(row){
      const out = new Array(cols).fill(null);
      for(let c=0;c<cols;c++){
        const g = row[c];
        if(!g) continue;
        const cell = wxReadCell(g.td, head);
        cell.span = g.span; cell.rows = g.rows; cell.colStart = g.colStart; cell.rowStart = g.rowStart; cell.col = c;
        out[c] = cell;
      }
      return out;
    });
  }
  const head = pack(hg, true), body = pack(bg, false);

  const footEl = WORD_CFG.foot ? document.querySelector(WORD_CFG.foot) : null;
  let notes = [];
  if(footEl){
    const divs = Array.prototype.filter.call(footEl.querySelectorAll("div"), function(d){ return !d.querySelector("div"); });
    if(divs.length) notes = divs.map(wxText);
    else notes = footEl.innerHTML.split(/<br\s*\/?>/i).map(function(part){
      const t = document.createElement("div"); t.innerHTML = part; return wxText(t);
    });
  }
  notes = notes.filter(function(t){ return t; });

  return {head:head, body:body, cols:cols, notes:notes};
}

function wxFill(xml){
  const s = wxScrape();
  const avail = wxTextWidth(xml);

  let pt = 14, widths = null;
  while(pt >= 8 && !(widths = wxColumnWidths(s.head, s.body, s.cols, avail, pt))) pt -= 0.5;
  if(!widths) throw new Error("the ratesheet has more columns than will fit on the page");

  const tbl = wxFindTable(xml);
  if(!tbl) throw new Error("no table found in that template — the rates table has to be the first table in the document");
  xml = wxSplice(xml, tbl, wxBuildTable(s.head, s.body, widths, pt));

  if(s.notes.length){
    /* The template's cash line goes first. Left until afterwards, the search
       would find the freshly written note instead and delete that, leaving the
       placeholder behind. */
    const cp = wxFindPara(xml, "cash for having your home loan");
    if(cp) xml = wxSplice(xml, cp, "");
    const rp = wxFindPara(xml, "Repayments are on");
    if(rp) xml = wxSplice(xml, rp, s.notes.map(wxNote).join(""));
  }
  return xml;
}

/* ---------------- build and hand over the file ---------------- */
async function wxBuild(){
  const parts = wxZipRead(wxB64Bytes(WX_TPL ? WX_TPL.b64 : WORD_TEMPLATE_B64));
  const doc = parts.filter(function(p){ return p.name === "word/document.xml"; })[0];
  if(!doc) throw new Error("that file is not a Word document");

  const raw = doc.method === 8 ? await wxInflate(doc.data) : doc.data;
  const out = new TextEncoder().encode(wxFill(new TextDecoder().decode(raw)));

  const packed = await wxDeflate(out);
  doc.method = packed ? 8 : 0;
  doc.data   = packed || out;
  doc.csize  = doc.data.length;
  doc.usize  = out.length;
  doc.crc    = wxCrc32(out);

  return wxZipWrite(parts);
}

/* A blob link clicked inside this frame is refused by some browsers, so the
   link is hung off the outer page whenever that page is reachable. */
function wxSave(blob, name){
  let doc = document;
  try{ if(window.top && window.top.document && window.top.document.body) doc = window.top.document; }catch(e){}
  const url = URL.createObjectURL(blob);
  const a = doc.createElement("a");
  a.href = url; a.download = name; a.style.display = "none";
  doc.body.appendChild(a); a.click();
  setTimeout(function(){ try{ a.parentNode.removeChild(a); }catch(e){} URL.revokeObjectURL(url); }, 30000);
}

(function(){

    catch(e){ say("Loaded for now, but there is no room to remember it."); }

  $$("wordBtn").addEventListener("click", async function(){

  });
  $$("tplBtn").addEventListener("click", function(){ $$("tplFile").click(); });
  $$("tplReset").addEventListener("click", function(){ setTpl(null); say("Back to the built-in " + WORD_CFG.bank + " template."); });
  $$("tplFile").addEventListener("change", function(e){
    const f = e.target.files[0]; e.target.value = "";
    if(!f) return;

    const fr = new FileReader();
    fr.onerror = function(){ say("That file could not be read."); };
    fr.onload = function(){
      try{
        const bytes = new Uint8Array(fr.result);
        if(!wxZipRead(bytes).some(function(p){ return p.name === "word/document.xml"; }))
          throw new Error("that file is not a Word document");
        setTpl({ name:f.name, b64:wxBytesB64(bytes) });
        say("Template set — " + f.name);
      }catch(err){ say("Could not use that template: " + err.message); }
    };
    fr.readAsArrayBuffer(f);
  });
  paint();
})();

<script>

    var b=null;

  /* The folder rises out of the drawer, seats itself, then dissolves into the
     calculator that was switched in behind it — while the filed cards give way. */
  function pullFolder(){
    folder.classList.remove("run"); filing.classList.remove("run");

    }

  /* Downscale before storing: a phone photo runs to several megabytes and
     browser storage caps out around five. 1600x900 covers the display size. */
  function ingest(file){
    if(!file) return;
    if(!/^image\//.test(file.type)){ say("That file is not an image. Choose a JPG, PNG or WebP.","err"); return; }
    say("Reading picture\u2026");
    var fr=new FileReader();
    fr.onerror=function(){ say("That picture could not be read. Try another file.","err"); };
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){ say("That picture could not be opened. Try another file.","err"); };
      img.onload=function(){
        var uri=fr.result;
        try{
          var W=1600,H=900,c=document.createElement("canvas");
          c.width=W; c.height=H;
          var g=c.getContext("2d");
          var s=Math.max(W/img.width,H/img.height);
          var w=img.width*s,h=img.height*s;
          g.drawImage(img,(W-w)/2,(H-h)/2,w,h);
          uri=c.toDataURL("image/jpeg",0.85);
        }catch(err){}
        if(applyCover(uri)) say("Cover picture set.","ok");
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  }

      '<path d="M-40 660C260 600 520 720 820 660 1120 600 1380 710 1660 652"/></g>')},
    {n:"Dusk", u:svg('<defs><linearGradient id="e" x1="0" y1="0" x2="1" y2="1">'+
      '<stop offset="0" stop-color="#3E1843"/><stop offset="1" stop-color="#101B33"/></linearGradient></defs>'+
      '<rect width="1600" height="900" fill="url(#e)"/>'+
      '<circle cx="1200" cy="290" r="128" fill="#C8A24A" opacity=".55"/>'+
      '<rect y="596" width="1600" height="2" fill="#C8A24A" opacity=".65"/>'+
      '<path d="M0 598h1600v302H0Z" fill="#0B1226" opacity=".55"/>')}
  ];

  GALLERY.forEach(function(g){
    var s=document.createElement("button");
    s.className="swatch"; s.type="button";
    s.title=g.n; s.setAttribute("aria-label",g.n+" cover");
    s.setAttribute("aria-pressed","false");
    s.dataset.uri=g.u;
    s.style.backgroundImage="url('"+g.u+"')";
    s.addEventListener("click",function(){ if(applyCover(g.u)) say(g.n+" cover applied.","ok"); });
    gallery.appendChild(s);
  });


  /* =================== SAVING RATES ===================
     Each calculator keeps its state in its own script scope, which the shell
     cannot reach. What it CAN reach is every control the user types into — so
     a save is a snapshot of those controls, and a restore writes them back and
     lets each calculator recompute from them exactly as if you had retyped.

     Storage lives here in the shell, not in the frames: one key, one place,
     and it keeps working even where a framed document is refused storage. */
  var SKEY="dev_ratesheet_book_v1";
  var saveBtn=$("saveBtn"), moreBtn=$("moreBtn"), morePop=$("morepop"),
      dirtyDot=$("dirtyDot"), lastSaved=$("lastSaved"), jsonInput=$("jsonInput"), toast=$("toast");
  var dirty=false, restoring=false, toastT=null;

  function canStore(){
    try{ var k="__probe"+Date.now(); localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; }
    catch(e){ return false; }
  }
  var STORE_OK=canStore();

  function note(msg,kind){
    toast.textContent=msg;
    toast.className="toast on"+(kind==="err"?" err":"");
    clearTimeout(toastT);
    toastT=setTimeout(function(){ toast.className="toast"+(kind==="err"?" err":""); }, kind==="err"?5200:2600);
  }

  function readBook(){
    if(!STORE_OK) return {v:1,savedAt:0,banks:{}};
    try{
      var raw=localStorage.getItem(SKEY);
      var o=raw?JSON.parse(raw):null;
      return (o && o.banks) ? o : {v:1,savedAt:0,banks:{}};
    }catch(e){ return {v:1,savedAt:0,banks:{}}; }
  }
  var book=readBook();

  /* An address that survives a re-render. Prefer the id; otherwise walk up to
     the nearest identified ancestor, recording position at each step, so a
     change in one table cannot shift the addresses of controls elsewhere. */
  function pathOf(el){
    if(el.id) return "#"+el.id;
    var parts=[], n=el, guard=0;
    while(n && n.nodeType===1 && n.tagName!=="BODY" && guard++<40){
      var par=n.parentElement; if(!par) break;
      var same=[], i;
      for(i=0;i<par.children.length;i++){ if(par.children[i].tagName===n.tagName) same.push(par.children[i]); }
      parts.unshift(n.tagName.toLowerCase()+":"+same.indexOf(n));
      if(par.id){ parts.unshift("#"+par.id); break; }
      n=par;
    }
    return parts.join(">");
  }
  function resolve(d,path){
    if(!path) return null;
    if(path.charAt(0)==="#" && path.indexOf(">")===-1) return d.getElementById(path.slice(1));
    var segs=path.split(">"), cur=d.body, i;
    if(segs[0].charAt(0)==="#"){ cur=d.getElementById(segs[0].slice(1)); segs=segs.slice(1); }
    for(i=0;i<segs.length && cur;i++){
      var bits=segs[i].split(":"), tag=bits[0].toUpperCase(), idx=+bits[1], same=[], k;
      for(k=0;k<cur.children.length;k++){ if(cur.children[k].tagName===tag) same.push(cur.children[k]); }
      cur=same[idx];
    }
    return cur||null;
  }

  /* File pickers cannot be set programmatically and buttons hold no value. */
  function skip(el){
    var t=(el.type||"").toLowerCase();
    return el.disabled || t==="file" || t==="button" || t==="submit" || t==="reset" || t==="image";
  }
  function isCheck(el){ var t=(el.type||"").toLowerCase(); return t==="checkbox"||t==="radio"; }

  function fire(el){
    try{
      var W=el.ownerDocument.defaultView;
      el.dispatchEvent(new W.Event("input",{bubbles:true}));
      el.dispatchEvent(new W.Event("change",{bubbles:true}));
    }catch(e){}
  }

  function captureDoc(d){
    var vals={}, list=d.querySelectorAll("input,select,textarea"), i, n=0;
    for(i=0;i<list.length;i++){
      var el=list[i]; if(skip(el)) continue;
      vals[pathOf(el)] = isCheck(el) ? !!el.checked : el.value;
      n++;
    }
    var toggles={}, tg=d.querySelectorAll("[data-mode]"), j;
    for(j=0;j<tg.length;j++){
      if(/(^|\s)active(\s|$)/.test(tg[j].className||"")) toggles.mode=tg[j].getAttribute("data-mode");
    }
    return {n:n, vals:vals, toggles:toggles};
  }

  /* Writing a value makes the calculator recompute, which can rebuild the very
     table we are still filling in. So: write everything, let it settle, then
     re-check and repair anything that got rebuilt underneath us. */
  function restoreDoc(d,snap){
    if(!snap || !snap.vals) return {applied:0,missing:0};
    var paths=[], p;
    for(p in snap.vals){ if(Object.prototype.hasOwnProperty.call(snap.vals,p)) paths.push(p); }

    /* Writing a value is not enough on its own. Several calculators keep their
       rate table in a JavaScript object and only update it when an input event
       fires; a value written silently leaves the editor looking correct while
       the ratesheet still computes from the old numbers. So every restored
       control is announced, whether or not this pass had to change it. */
    function announce(list){
      for(var i=0;i<list.length;i++){
        /* a paste box may re-parse on input and clobber what was just restored */
        if(list[i].tagName!=="TEXTAREA") fire(list[i]);
      }
    }

    function write(repairOnly){
      var out=[], i;
      for(i=0;i<paths.length;i++){
        var el=resolve(d,paths[i]); if(!el || skip(el)) continue;
        var want=snap.vals[paths[i]], differs;
        if(isCheck(el)){
          differs = el.checked!==!!want;
          if(differs) el.checked=!!want;
        }else{
          differs = String(el.value)!==String(want);
          if(differs) el.value=want;
        }
        if(!repairOnly || differs) out.push(el);
      }
      return out;
    }

    announce(write(false));

    /* Recomputing can rebuild a table and reset the very fields just filled in,
       so check afterwards and repair, announcing only what needed fixing. */
    var pass;
    for(pass=0; pass<3; pass++){
      var again=write(true);
      if(!again.length) break;
      announce(again);
    }

    if(snap.toggles && snap.toggles.mode){
      var b=d.querySelector('[data-mode="'+snap.toggles.mode+'"]');
      if(b && !/(^|\s)active(\s|$)/.test(b.className||"")){ try{ b.click(); }catch(e){} }
    }

    var applied=0, missing=0, i2;
    for(i2=0;i2<paths.length;i2++){
      var e2=resolve(d,paths[i2]);
      if(!e2){ missing++; continue; }
      var w=snap.vals[paths[i2]];
      if(isCheck(e2) ? (e2.checked===!!w) : (String(e2.value)===String(w))) applied++;
    }
    return {applied:applied, missing:missing, total:paths.length};
  }

  /* ---- "rates last saved" badge, shown beside each Master Rates heading ----
     The seven calculators label that section differently: three say "Master
     Rates" outright, the other four call it "Edit / view loaded rate table".
     Headings are preferred over the wrapper divs so the badge lands on the
     same line rather than dropping below it. */
  function fmtStamp(ts){
    var d=new Date(ts), p=function(n){ return (n<10?"0":"")+n; };
    return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+
           " "+p(d.getHours())+":"+p(d.getMinutes());
  }

  function stampHost(d){
    var tags=["h2","h3","h1"], i, j, els, t;
    for(j=0;j<tags.length;j++){
      els=d.querySelectorAll(tags[j]);
      for(i=0;i<els.length;i++){
        t=(els[i].textContent||"").trim();
        if(/master\s*rates/i.test(t) && t.length<60) return els[i];
      }
    }
    els=d.querySelectorAll("summary");
    for(i=0;i<els.length;i++){
      if(/rate table/i.test(els[i].textContent||"")) return els[i];
    }
    els=d.querySelectorAll(".section-label,legend");
    for(i=0;i<els.length;i++){
      if(/master\s*rates/i.test(els[i].textContent||"")) return els[i];
    }
    return null;
  }

  function paintStamp(f,ts){
    var d;
    try{ d=f.contentDocument; }catch(e){ return; }
    if(!d || !d.body) return;

    if(!d.getElementById("dev-stamp-css")){
      var st=d.createElement("style");
      st.id="dev-stamp-css";
      st.textContent=".dev-saved{display:inline-block;margin-left:12px;font-size:16px;"+
        "font-weight:800;line-height:1.2;color:#14213A;vertical-align:middle;white-space:nowrap}"+
        ".dev-saved .lb{color:#5A6B82}"+
        "@media print{.dev-saved{font-size:13px}}";
      (d.head||d.body).appendChild(st);
    }

    var el=d.getElementById("dev-saved-stamp");
    if(!ts){ if(el && el.parentNode) el.parentNode.removeChild(el); return; }

    if(!el){
      var host=stampHost(d);
      if(!host) return;
      el=d.createElement("span");
      el.id="dev-saved-stamp";
      el.className="dev-saved";
      if(host.tagName==="SUMMARY"){
        /* keep the badge ahead of the little chevron */
        var chev=host.querySelector(".chev");
        if(chev) host.insertBefore(el,chev); else host.appendChild(el);
      }else if(host.parentNode){
        host.parentNode.insertBefore(el, host.nextSibling);
      }else return;
    }
    el.innerHTML='<span class="lb">Rates last saved:</span> '+fmtStamp(ts);
  }

  function repaintStamps(){
    var id;
    for(id in made){
      if(!Object.prototype.hasOwnProperty.call(made,id) || !made[id]) continue;
      paintStamp(made[id], book.banks[id] && book.banks[id].at);
    }
  }

  function setDirty(v){
    dirty=!!v;
    dirtyDot.hidden=!dirty;
    saveBtn.title = dirty ? "You have unsaved changes \u2014 click to save"
                          : "Remember these rates for next time";
  }
  function markDirty(){ if(!restoring) setDirty(true); }

  function watch(f){
    try{
      var d=f.contentDocument;
      d.addEventListener("input",markDirty,true);
      d.addEventListener("change",markDirty,true);
      d.addEventListener("click",function(e){
        var t=e.target;
        while(t && t!==d.body){ if(t.getAttribute && t.getAttribute("data-mode")!==null){ markDirty(); return; } t=t.parentElement; }
      },true);
    }catch(e){}
  }

  /* called from build() once a calculator has finished loading */
  function hydrate(id,f){
    restoring=true;
    try{ if(book.banks[id]) restoreDoc(f.contentDocument, book.banks[id]); }catch(e){}
    restoring=false;
    try{ paintStamp(f, book.banks[id] && book.banks[id].at); }catch(e){}
    watch(f);
  }

  /* Each bank carries the moment ITS rates were captured. A bank left unopened
     keeps its older stamp rather than inheriting the newest save. */
  function grabLoaded(ts){
    var id, when=ts||Date.now();
    for(id in made){
      if(!Object.prototype.hasOwnProperty.call(made,id)) continue;
      if(!made[id]) continue;
      try{
        var snap=captureDoc(made[id].contentDocument);
        snap.at=when;
        book.banks[id]=snap;
      }catch(e){}
    }
  }

  function stamp(){
    if(!book.savedAt){ lastSaved.textContent="Nothing saved yet"; return; }
    var d=new Date(book.savedAt);
    lastSaved.textContent="Saved "+d.toLocaleDateString()+" at "+
      d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  }

  function doSave(quiet){
    var ts=Date.now();
    grabLoaded(ts);
    var n=0, k;
    for(k in book.banks){ if(Object.prototype.hasOwnProperty.call(book.banks,k)) n++; }
    if(!n){ note("Open a bank first \u2014 there is nothing to save yet."); return false; }

    book.v=1; book.savedAt=ts;
    if(!STORE_OK){
      note("This browser will not let the page store data. Use \u201cBack up to file\u201d instead.","err");
      return false;
    }
    try{ localStorage.setItem(SKEY, JSON.stringify(book)); }
    catch(e){
      note("Could not save \u2014 storage is full. Try \u201cBack up to file\u201d, or clear the cover picture.","err");
      return false;
    }
    setDirty(false); stamp(); repaintStamps();
    if(!quiet) note("Saved. These rates will be here next time you open the file.");
    return true;
  }

  function doRestore(){
    var n=0,k; for(k in book.banks){ if(Object.prototype.hasOwnProperty.call(book.banks,k)) n++; }
    if(!n){ note("There is no saved set to go back to."); return; }
    restoring=true;
    var done=0, id;
    for(id in made){
      if(!Object.prototype.hasOwnProperty.call(made,id) || !made[id] || !book.banks[id]) continue;
      try{ restoreDoc(made[id].contentDocument, book.banks[id]); done++; }catch(e){}
    }
    restoring=false;
    setDirty(false); repaintStamps();
    note(done ? "Put back the last saved rates." : "Saved rates will load as you open each bank.");
  }

  saveBtn.addEventListener("click",function(){ doSave(false); });

  moreBtn.addEventListener("click",function(e){
    e.stopPropagation();
    var open=morePop.hidden;
    stamp();
    morePop.hidden=!open;
    moreBtn.setAttribute("aria-expanded",String(open));
  });
  morePop.addEventListener("click",function(e){ e.stopPropagation(); });
  document.addEventListener("click",function(){
    if(!morePop.hidden){ morePop.hidden=true; moreBtn.setAttribute("aria-expanded","false"); }
  });

  $("restoreBtn").addEventListener("click",function(){ doRestore(); morePop.hidden=true; moreBtn.setAttribute("aria-expanded","false"); });

  $("backupBtn").addEventListener("click",function(){
    grabLoaded(); book.v=1; book.savedAt=book.savedAt||Date.now();
    try{
      var blob=new Blob([JSON.stringify(book,null,2)],{type:"application/json"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      a.href=url;
      a.download="ratesheet-rates-"+new Date().toISOString().slice(0,10)+".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); },1500);
      note("Backup file downloaded.");
    }catch(e){ note("Could not create the backup file.","err"); }
    morePop.hidden=true; moreBtn.setAttribute("aria-expanded","false");
  });

  $("importBtn").addEventListener("click",function(){
    jsonInput.click();
    morePop.hidden=true; moreBtn.setAttribute("aria-expanded","false");
  });
  jsonInput.addEventListener("change",function(){
    var file=this.files && this.files[0]; this.value="";
    if(!file) return;
    var fr=new FileReader();
    fr.onerror=function(){ note("That file could not be read.","err"); };
    fr.onload=function(){
      var o=null;
      try{ o=JSON.parse(fr.result); }catch(e){}
      if(!o || !o.banks){ note("That does not look like a ratesheet backup.","err"); return; }
      book=o; book.v=1;
      doRestore();
      if(STORE_OK){ try{ localStorage.setItem(SKEY, JSON.stringify(book)); }catch(e){} }
      stamp();
      note("Rates restored from the backup file.");
    };
    fr.readAsText(file);
  });

  $("clearBtn").addEventListener("click",function(){
    book={v:1,savedAt:0,banks:{}};
    if(STORE_OK){ try{ localStorage.removeItem(SKEY); }catch(e){} }
    setDirty(false); stamp(); repaintStamps();
    note("Saved rates cleared. What is on screen is untouched.");
    morePop.hidden=true; moreBtn.setAttribute("aria-expanded","false");
  });

  /* Ctrl/Cmd+S saves, in the shell and inside a calculator alike */
  function saveKey(e){
    if(e.key==="s" && (e.metaKey||e.ctrlKey)){ e.preventDefault(); doSave(false); return true; }
    return false;
  }
  window.addEventListener("keydown",saveKey);

  window.addEventListener("beforeunload",function(e){
    if(!dirty) return;
    e.preventDefault(); e.returnValue="";
  });

  stamp();
  if(!STORE_OK){
    setTimeout(function(){
      note("This browser will not let the page remember data. \u201cBack up to file\u201d still works.","err");
    },900);
  }

  /* ---------------- boot ---------------- */
  try{ var saved=localStorage.getItem(KEY); if(saved) applyCover(saved,true); }catch(e){}
  open((location.hash||"").replace("#","")||"cover",false);
})();
</script>
</body>
