<script>
/* ---------- rate table (The Co-operative Bank: Home Loan Rates) ---------- */
const BLACK="#000000", AMBER="#E8A317", GREEN="#16A64C", RED="#E63329";
/* The Co-operative Bank: Home Loan Interest Rates — effective 25 September 2026 */
const DEFAULTS = {
  floating: {label:"Floating",        oo:5.69, fhb:5.69, std:5.69, color:BLACK},
  revolving:{label:"Revolving/LOC",   oo:5.69, fhb:5.69, std:5.69, color:BLACK, revolving:true},
  m6:  {label:"6 months fixed",  oo:4.89, fhb:4.79, std:5.39, color:AMBER},
  m12: {label:"12 months fixed", oo:5.19, fhb:5.09, std:5.69, color:AMBER},
  m18: {label:"18 months fixed", oo:5.35, fhb:5.25, std:5.85, color:GREEN},
  m24: {label:"24 months fixed", oo:5.49, fhb:5.39, std:5.99, color:GREEN},
  m36: {label:"36 months fixed", oo:5.69, fhb:5.59, std:6.19, color:RED},
  m48: {label:"48 months fixed", oo:5.89, fhb:5.79, std:6.39, color:RED},
  m60: {label:"60 months fixed", oo:5.99, fhb:5.89, std:6.49, color:RED},
  /* Fresh Start is priced off the Owner Occupied column only */
  freshFloat:{label:"Fresh Start floating",        oo:7.69, fhb:null, std:null, color:BLACK, fresh:true},
  freshFix:  {label:"Fresh Start 12 months fixed", oo:7.19, fhb:null, std:null, color:AMBER, fresh:true},
};
const ORDER = ["floating","revolving","m6","m12","m18","m24","m36","m48","m60"];
const FRESH_ORDER = ["freshFloat","freshFix"];
const EDIT_ORDER = ORDER.concat(FRESH_ORDER);
const COLS  = [["oo","Owner Occupied"],["fhb","First Home Buyer Special"],["std","Standard"]];
let rates = structuredClone(DEFAULTS);

/* Low Equity Premium — added to the Standard rate when the loan is more than
   80% of the property's value. max = top of the LVR band (inclusive). */
const DEFAULT_LEM = [
  {max:85, rate:0.20},
  {max:90, rate:0.50},
  {max:95, rate:1.00},
];
let lemBands = structuredClone(DEFAULT_LEM);
function lemBand(lvr){
  if(lvr<=rules.lvrThreshold) return 0;
  const sorted=[...lemBands].sort((x,y)=>x.max-y.max);
  for(const b of sorted){ if(lvr<=b.max) return b.rate; }
  return sorted.length ? sorted[sorted.length-1].rate : 0;
}
function lemTop(){ return lemBands.reduce((t,b)=>Math.max(t,b.max),0); }

/* ---------- pricing rules ---------- */
const DEFAULT_RULES = {
  lvrThreshold:80,      // Owner Occupied rates need equity at or above this
  fhbMinLend:250000,    // minimum new lending for the first home buyer rate
  koLmiPct:1.2,         // Kāinga Ora Lender's Mortgage Insurance, % of loan balance
  revNoLowEquity:true,  // revolving credit unavailable on low equity loans
};
let rules = structuredClone(DEFAULT_RULES);

/* Cash contribution rule — first home buyer, owner occupied, loan over the minimum */
const DEFAULT_CASH = {
  minLoan:250000,   // exclusive: the loan has to be over this
  pct:1.00,
  cap:15000,
};
let cashRule = structuredClone(DEFAULT_CASH);

let cashOverride = null;     // null = follow the rule
let repayMode = "pi";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const num = s => { const n = parseFloat(String(s).replace(/[^0-9.]/g,"")); return isNaN(n)?0:n; };
const money = n => "$"+Math.round(n).toLocaleString("en-NZ");
const groupInt = v => { const raw=String(v).replace(/[^0-9.]/g,""); if(raw==="")return ""; const [i,d]=raw.split("."); const gi=Number(i||0).toLocaleString("en-NZ"); return d!==undefined? gi+"."+d : gi; };
const adjText = v => v===0 ? "0.00%" : (v>0?"+":"")+v.toFixed(2)+"%";

function pmt(P,ratePct,ppy,years){
  const r=ratePct/100/ppy, n=years*ppy;
  if(n<=0) return 0;
  if(r===0) return P/n;
  return P*r/(1-Math.pow(1+r,-n));
}
function repay(P,ratePct,ppy,years){
  if(repayMode==="io") return P*(ratePct/100)/ppy;
  return pmt(P,ratePct,ppy,years);
}

/* which column of the card the deal prices from */
function pickTier(m){
  if(!m.ownerOcc) return {tier:"std", label:"Standard rates", tone:"std",
    why:"Non owner-occupied lending prices off the Standard card."};
  if(m.lowEquity && !m.ko) return {tier:"std", label:"Standard rates + Low Equity Premium", tone:"warn",
    why:`Owner occupied above ${rules.lvrThreshold}% LVR — under 20% equity, so Standard rates plus the Low Equity Premium apply.`};
  if(m.fhb && m.loan>=rules.fhbMinLend) return {tier:"fhb", label:"First Home Buyer Special", tone:"ok",
    why:m.ko?"Kāinga Ora First Home Loan — the first home buyer special applies.":"Owner occupied first home, and new lending meets the minimum."};
  if(m.fhb) return {tier:"oo", label:"Owner Occupied rates", tone:"ok",
    why:`The first home buyer special starts at ${money(rules.fhbMinLend)} of new lending.`};
  return {tier:"oo", label:"Owner Occupied rates", tone:"ok",
    why:m.ko?"Kāinga Ora First Home Loan — owner occupied rates apply.":`At least ${100-rules.lvrThreshold}% equity, so owner occupied rates apply.`};
}
/* A blank cell means the card doesn't offer it, so fall back along the card:
   First Home Buyer -> Owner Occupied -> Standard, and Standard -> Owner Occupied. */
function rateFor(r,tier){
  if(tier==="fhb" && r.fhb!=null) return r.fhb;
  if((tier==="fhb"||tier==="oo") && r.oo!=null) return r.oo;
  if(r.std!=null) return r.std;
  return r.oo!=null ? r.oo : r.fhb;
}

/* cash contribution: owner occupied first home, first home buyer, loan over the minimum */
function cashEligible(loan,fhb,ownerOcc){
  if(!ownerOcc) return {amount:0, why:`Cash needs owner occupied lending — investment and rental property does not qualify.`};
  if(!fhb)      return {amount:0, why:`Cash is for first home buyers only.`};
  if(loan<=cashRule.minLoan)
    return {amount:0, why:`New lending has to be over ${money(cashRule.minLoan)} — this deal is ${money(loan)}.`};
  return {amount:Math.min(loan*cashRule.pct/100, cashRule.cap),
          why:`${cashRule.pct}% of new lending, capped at ${money(cashRule.cap)}`};
}

/* ---------- model ---------- */
function computeModel(){
  const loan = num($("#loan").value);
  const term = num($("#term").value);
  const pval = num($("#pval").value);
  const ooVal=$("#oo").value, fhbVal=$("#fhb").value, koVal=$("#ko").value, freshVal=$("#fresh").value;
  const ownerOcc = ooVal==="Yes", fhb = fhbVal==="Yes", ko = koVal==="Yes", fresh = freshVal==="Yes";
  const lvr = pval>0 ? loan/pval*100 : 0;
  const lowEquity = lvr>rules.lvrThreshold;

  const base = {loan,term,pval,ooVal,fhbVal,koVal,freshVal,ownerOcc,fhb,ko,fresh,lvr,lowEquity};
  let pick = pickTier(base);
  if(fresh) pick = {tier:"fresh", label:"Fresh Start rates", tone:"warn",
    why:"Fresh Start pricing: floating and 1 year fixed, off the Owner Occupied column of the card."};
  /* Kāinga Ora First Home Loans price off Owner Occupied whatever the LVR,
     so they carry no premium. */
  const lem = (lowEquity && !ko && !fresh) ? lemBand(lvr) : 0;
  const offCard = lem>0 && lvr>lemTop();

  const el   = cashEligible(loan,fhb,ownerOcc);
  /* A figure equal to what the rule gives is not a deliberate override —
     it is just the number the box was already showing, and pinning it there
     would stop the cashback following the loan. */
  if(cashOverride!=null && Math.round(cashOverride)===Math.round(el.amount)) cashOverride=null;
  const cash = cashOverride!=null ? cashOverride : el.amount;
  const lmi  = ko ? loan*rules.koLmiPct/100 : 0;

  const rows = (fresh ? FRESH_ORDER : ORDER).map(k=>{
    const r = rates[k];
    if(r.fresh){
      const rate = (pick.tier==="fresh" && fhb && r.fhb!=null) ? r.fhb : (r.oo!=null ? r.oo : (r.std!=null ? r.std : r.fhb));
      if(rate==null) return null;
      const fstd = r.std!=null ? r.std : rate;
      return {label:r.label, color:r.color, std:fstd, rate, adj:rate-fstd, na:false,
              wk:repay(loan,rate,52,term), fn:repay(loan,rate,26,term), mo:repay(loan,rate,12,term)};
    }
    const base = rateFor(r,pick.tier);
    if(base==null) return null;               // nothing entered for this term at all
    const std = r.std!=null ? r.std : base;   // Standard Rate is the Standard column
    const na  = !!(r.revolving && rules.revNoLowEquity && lowEquity);
    const rate = base + lem;  // Your Rate follows the client type, plus any premium
    return {label:r.label, color:r.color, std, rate, adj:rate-std, na,
            wk:repay(loan,rate,52,term),
            fn:repay(loan,rate,26,term),
            mo:repay(loan,rate,12,term)};
  }).filter(Boolean);

  return Object.assign(base,{tier:pick.tier, tierLabel:pick.label, tierTone:pick.tone, tierWhy:pick.why,
    lem, offCard, adjHeader: lem>0 ? "Low Equity Premium" : "Your Discount",
    cash, lmi, eligible:el.amount, cashWhy:el.why, rows});
}

/* ---------- render ---------- */
function calc(){
  const m = computeModel();

  const lvrEl=$("#lvr");
  lvrEl.textContent = m.pval>0 ? Math.round(m.lvr)+"%" : "—";
  lvrEl.classList.toggle("warn", m.pval>0 && m.lowEquity);

  [["#ooCell",m.ooVal],["#fhbCell",m.fhbVal],["#koCell",m.koVal],["#freshCell",m.freshVal]].forEach(([sel,v])=>{
    const el=$(sel); el.classList.toggle("yes",v==="Yes"); el.classList.toggle("no",v==="No");
  });

  const b=$("#basis");
  b.textContent=m.tierLabel;
  b.className="basis"+(m.tierTone==="std"?" std":m.tierTone==="warn"?" warn":"");
  b.title=m.tierWhy;

  const cashEl=$("#cash");
  if(document.activeElement!==cashEl) cashEl.value = groupInt(Math.round(m.cash));

  const hint=$("#cashhint");
  if(cashOverride!=null){
    hint.innerHTML = `Overridden. The rule gives <b>${money(m.eligible)}</b>. <button id="applycash">Reset to the rule</button>`;
    $("#applycash").addEventListener("click",()=>{ cashOverride=null; calc(); });
  }else if(m.eligible>0){
    hint.innerHTML = `Auto-filled — ${m.cashWhy}. Type over it to set an approved amount.`;
  }else{
    hint.textContent = `No cash contribution. ${m.cashWhy}`;
  }

  const body=$("#rsbody"); body.innerHTML="";
  m.rows.forEach(row=>{
    const tr=document.createElement("tr");
    const c=row.color;
    if(row.na){
      tr.className="na";
      tr.innerHTML=`<td class="term">${row.label}</td><td>${row.std.toFixed(2)}%</td>`+
        `<td colspan="5">not available on low equity lending</td>`;
    }else{
      tr.innerHTML =
        `<td class="term" style="color:${c}">${row.label}</td>`+
        `<td style="color:${c}">${row.std.toFixed(2)}%</td>`+
        `<td style="color:${c}">${adjText(row.adj)}</td>`+
        `<td style="color:${c};font-weight:800">${row.rate.toFixed(2)}%</td>`+
        `<td style="color:${c}">${money(row.wk)}</td>`+
        `<td style="color:${c}">${money(row.fn)}</td>`+
        `<td style="color:${c}">${money(row.mo)}</td>`;
    }
    body.appendChild(tr);
  });

  const basis = repayMode==="io" ? "an Interest Only basis" : `a P&amp;I basis over <b>${m.term||0}</b> years`;
  let foot = `<div>*Repayments are on ${basis} - Loan of <b>${money(m.loan)}</b></div>`;
  foot += `<div>*Co-op will also give you <b>${money(m.cash)}</b> cash for having your home loan with them.</div>`;
  if(m.ko)     foot += `<div>*Kāinga Ora First Home Loan — a Lender's Mortgage Insurance premium of <b>${money(m.lmi)}</b> (${rules.koLmiPct}% of the loan balance) applies and can be added to the loan.</div>`;
  if(m.lem>0)   foot += `<div>*Your Rate includes a Low Equity Premium of <b>+${m.lem.toFixed(2)}%</b> p.a. — the loan is ${Math.round(m.lvr)}% of the property's value.</div>`;
  if(m.offCard) foot += `<div>*LVR is above ${lemTop()}%, past the last band on the card — the highest premium is shown. Check with The Co-operative Bank which rate applies.</div>`;
  if(m.fresh)   foot += `<div>*Fresh Start rates — floating and 12 months fixed only.</div>`;
  $("#adjHead").innerHTML = m.lem>0 ? "Low Equity<br>Premium" : "Your<br>Discount";
  $("#foot").innerHTML = foot;
}

/* ---------- copy ratesheet to Word ---------- */
function buildCopyHTML(){
  const m = computeModel();
  const HEAVY="2.25pt solid #000", LIGHT="0.5pt solid #000";
  const heads=["Term","Standard Rate",m.adjHeader,"Your Rate","weekly","f/n","monthly"];
  const R = m.rows.length + 1, C = heads.length;
  const cellStyle=(ri,ci,extra="")=>{
    const top   = ri===0   ? HEAVY : LIGHT;
    const bot   = ri===R-1 ? HEAVY : LIGHT;
    const left  = ci===0   ? HEAVY : LIGHT;
    const right = ci===C-1 ? HEAVY : LIGHT;
    return `border-top:${top};border-bottom:${bot};border-left:${left};border-right:${right};padding:4px 8px;font-family:Arial,Helvetica,sans-serif;font-size:10.5pt;${extra}`;
  };
  let html=`<table style="border-collapse:collapse;border:${HEAVY}"><thead><tr>`;
  heads.forEach((h,ci)=>{ html+=`<th style="${cellStyle(0,ci,'text-align:center;font-weight:bold;color:#000000')}">${h}</th>`; });
  html+=`</tr></thead><tbody>`;
  m.rows.forEach((row,i)=>{
    const ri=i+1, c=row.color;
    if(row.na){
      html+=`<tr>`+
        `<td style="${cellStyle(ri,0,'text-align:left;font-weight:bold;color:'+c)}">${row.label}</td>`+
        `<td style="${cellStyle(ri,1,'text-align:center;color:'+c)}">${row.std.toFixed(2)}%</td>`+
        `<td colspan="5" style="${cellStyle(ri,6,'text-align:center;font-style:italic;color:#8A8A8A')}">not available on low equity lending</td>`+
        `</tr>`;
      return;
    }
    html+=`<tr>`+
      `<td style="${cellStyle(ri,0,'text-align:left;font-weight:bold;color:'+c)}">${row.label}</td>`+
      `<td style="${cellStyle(ri,1,'text-align:center;color:'+c)}">${row.std.toFixed(2)}%</td>`+
      `<td style="${cellStyle(ri,2,'text-align:center;color:'+c)}">${adjText(row.adj)}</td>`+
      `<td style="${cellStyle(ri,3,'text-align:center;font-weight:bold;color:'+c)}">${row.rate.toFixed(2)}%</td>`+
      `<td style="${cellStyle(ri,4,'text-align:center;color:'+c)}">${money(row.wk)}</td>`+
      `<td style="${cellStyle(ri,5,'text-align:center;color:'+c)}">${money(row.fn)}</td>`+
      `<td style="${cellStyle(ri,6,'text-align:center;color:'+c)}">${money(row.mo)}</td>`+
      `</tr>`;
  });
  html+=`</tbody></table>`;
  const p="font-family:Arial;font-size:9.5pt;font-style:italic;margin:6px 0 0";
  const basis = repayMode==="io" ? "an Interest Only basis" : `a P&I basis over ${m.term||0} years`;
  html+=`<p style="${p}">*Repayments are on ${basis} - Loan of ${money(m.loan)}</p>`;
  html+=`<p style="${p};margin-top:2px">*Co-op will also give you ${money(m.cash)} cash for having your home loan with them.</p>`;
  if(m.ko)     html+=`<p style="${p};margin-top:2px">*Kāinga Ora First Home Loan — a Lender's Mortgage Insurance premium of ${money(m.lmi)} (${rules.koLmiPct}% of the loan balance) applies.</p>`;
  if(m.lem>0)   html+=`<p style="${p};margin-top:2px">*Your Rate includes a Low Equity Premium of +${m.lem.toFixed(2)}% p.a. — the loan is ${Math.round(m.lvr)}% of the property's value.</p>`;
  if(m.fresh)   html+=`<p style="${p};margin-top:2px">*Fresh Start rates — floating and 12 months fixed only.</p>`;
  return html;
}

async function copyToWord(){
  const html = buildCopyHTML();
  const tmp = document.createElement("div"); tmp.innerHTML=html;
  const plain = tmp.innerText;
  let ok=false;
  try{
    if(navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({
        "text/html": new Blob([html],{type:"text/html"}),
        "text/plain": new Blob([plain],{type:"text/plain"})
      })]);
      ok=true;
    }
  }catch(e){ ok=false; }
  if(!ok){
    const holder=document.createElement("div");
    holder.contentEditable="true"; holder.innerHTML=html;
    holder.style.cssText="position:fixed;left:-9999px;top:0;opacity:0";
    document.body.appendChild(holder);
    const range=document.createRange(); range.selectNodeContents(holder);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    try{ ok=document.execCommand("copy"); }catch(e){}
    sel.removeAllRanges(); document.body.removeChild(holder);
  }
  const btn=$("#copyword"); const label=btn.dataset.label||btn.textContent;
  btn.dataset.label=label;
  btn.classList.toggle("done",ok);
  btn.textContent = ok ? "✓ Copied — paste into Word" : "Copy failed — try again";
  setTimeout(()=>{ btn.textContent=label; btn.classList.remove("done"); },2200);
}

/* ---------- rate editor ---------- */
function renderEditor(){
  const b=$("#rateRows"); b.innerHTML="";
  EDIT_ORDER.forEach(k=>{
    const r=rates[k];
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${r.label}</td>`+
      COLS.map(([f])=>{
        const v = r[f]==null ? "" : r[f].toFixed(2);
        return `<td><input data-k="${k}" data-f="${f}" value="${v}" placeholder="—" title="Leave blank if this rate is not offered"></td>`;
      }).join("");
    b.appendChild(tr);
  });
  b.querySelectorAll("input[data-k]").forEach(inp=>{
    inp.addEventListener("input",e=>{
      const v=e.target.value.trim();
      rates[e.target.dataset.k][e.target.dataset.f] = /\d/.test(v) ? num(v) : null;
      calc();
    });
  });
}

/* ---------- rules editor ---------- */
function renderRules(){
  $("#r_thresh").value=rules.lvrThreshold;
  $("#r_fhbmin").value=groupInt(rules.fhbMinLend);
  $("#r_lmi").value=rules.koLmiPct;
  $("#r_rev").checked=rules.revNoLowEquity;
}
document.querySelectorAll("[data-rule]").forEach(inp=>{
  inp.addEventListener("input",e=>{
    rules[e.target.dataset.rule]=num(e.target.value);

/* ---------- rate card parsing ---------- */
const SECTION_NAMES = {std:"Standard", oo:"Owner Occupied", fhb:"First Home Buyer Special"};

function sectionKey(line){
  const l=line.toLowerCase();
  if(/first\s*home|fhb\b/.test(l)) return "fhb";
  if(/owner[\s-]*occupied|owner occ/.test(l)) return "oo";
  /* OCR clips this heading badly — on the sample card "Standard" came back as
     just "dard" — so accept the tail of the word as well. */
  if(/standard|tandard|ndard|dard/.test(l)) return "std";
  return null;
}
function termKey(line){
  const t=line.toLowerCase();
  if(/fresh\s*start/.test(t)){
    if(t.includes("float")) return "freshFloat";
    if(/\b1\s*(year|yr)|12\s*month/.test(t)) return "freshFix";
    return null;
  }
  if(t.includes("revolving")) return "revolving";
  if(t.includes("float")||t.includes("variable")) return "floating";
  if(/18\s*month/.test(t)) return "m18";
  if(/6\s*month/.test(t)) return "m6";
  if(/\b1\s*(year|yr)/.test(t)||/12\s*month/.test(t)) return "m12";
  if(/\b2\s*(year|yr)/.test(t)||/24\s*month/.test(t)) return "m24";
  if(/\b3\s*(year|yr)/.test(t)||/36\s*month/.test(t)) return "m36";
  if(/\b4\s*(year|yr)/.test(t)||/48\s*month/.test(t)) return "m48";
  if(/\b5\s*(year|yr)/.test(t)||/60\s*month/.test(t)) return "m60";
  return null;
}

/* The card carries three numeric columns — Current Rate, New Rate, Change —
   and only the New Rate is wanted. Rather than trust a fixed position, read the
   card's own header row to learn which column is which; some cards list New
   before Current. Falls back to the usual middle-of-three when no header is
   found in the extract. */
function rateColumn(text){
  const lines=text.split(/\r?\n/);
  for(const raw of lines){
    const l=raw.toLowerCase();
    if(l.indexOf("new")===-1) continue;
    const iNew=l.search(/new\s*(rate|interest)?/);
    const iCur=l.search(/current\s*(rate|interest)?/);
    if(iNew===-1||iCur===-1) continue;
    return {index: iNew<iCur ? 0 : 1, from:"the card's own column headings"};
  }
  return {index:1, from:"the usual Current, New, Change order"};
}

/* The card carries three tables, in this order down the page. */
const SECTION_ORDER=["oo","fhb","std"];

/* The current card is a single table: each row carries its term then the
   Owner Occupied, First Home Buyer Special and Standard rates. Older cards
   were three tables of Current / New / Change, read by applyRowsSections. */
function applyRows(text){
  const lines=text.split(/\r?\n/);

  /* Low Equity Premium table: "80.01-85.00%   +0.20% p.a." */
  const bands=[];
  lines.forEach(raw=>{
    const m=raw.match(/(\d{2,3}(?:\.\d+)?)\s*%?\s*(?:-|–|—|to)\s*(\d{2,3}(?:\.\d+)?)\s*%[^\d+]*\+\s*(\d+\.\d+)\s*%/i);
    if(!m) return;
    const hi=parseFloat(m[2]), r=parseFloat(m[3]);
    if(hi>50 && hi<=100 && r<5) bands.push({max:hi, rate:r});
  });
  if(bands.length) lemBands=bands.sort((x,y)=>x.max-y.max);

  const oldLayout=/current/i.test(text) && /\bnew\b/i.test(text);
  if(oldLayout){ const res=applyRowsSections(text); res.lem=bands.length; return res; }

  let n=0, skipped=0;
  const seen=new Set();
  lines.forEach(raw=>{
    const line=raw.trim(); if(!line) return;
    const k=termKey(line);
    const nums=(line.match(/\d+\.\d+/g)||[]).map(parseFloat).filter(v=>v>=0&&v<25);
    if(!k || !nums.length) return;
    const r=rates[k];
    if(r.fresh){ r.oo=nums[0]; seen.add("oo"); n++; return; }
    if(nums.length>=3){
      r.oo=nums[0]; r.fhb=nums[1]; r.std=nums[2];
      seen.add("oo"); seen.add("fhb"); seen.add("std"); n++;
    }else skipped++;
  });
  lastRateColumn={matrix:true, from:"the Owner Occupied, First Home Buyer Special and Standard columns"};
  return {n,skipped,lem:bands.length,sections:[...seen]};
}

function applyRowsSections(text){
  let n=0, skipped=0;
  const seen=new Set();
  const col=rateColumn(text);
  lastRateColumn=col;

  /* Relying on the headings alone is not safe: on the sample card OCR lost
     "First Home Buyer" completely and clipped "Standard". A term appearing a
     second time is therefore also treated as the start of the next table,
     which needs no heading to survive at all. */
  let secIdx=0, termsHere=new Set();

  text.split(/\r?\n/).forEach(raw=>{
    const line=raw.trim();
    if(!line) return;

    const s=sectionKey(line);
    if(s){
      const at=SECTION_ORDER.indexOf(s);
      if(at>=0 && at!==secIdx){ secIdx=at; termsHere=new Set(); }
    }

    const k=termKey(line);
    const nums=(line.match(/\d+\.\d+/g)||[]).map(parseFloat).filter(v=>v>=0&&v<25);
    if(!k || !nums.length){ if(!s && /[a-z]/i.test(line)) skipped++; return; }

    if(termsHere.has(k) && secIdx<SECTION_ORDER.length-1){
      secIdx++; termsHere=new Set();
    }
    termsHere.add(k);

    const target=SECTION_ORDER[secIdx];
    if(target==="fhb" && rates[k].fhb===null){ skipped++; return; }   // FHB card has fixed terms only
    /* two or three numbers on the row: take whichever the header said is New.
       A lone number on the row is that term's only rate. */
    const pick = nums.length>=2 ? (nums[col.index]!==undefined ? nums[col.index] : nums[1]) : nums[0];
    rates[k][target]=pick;
    seen.add(target); n++;
  });
  return {n,skipped,sections:[...seen]};
}
let lastRateColumn={index:1,from:""};
function loadText(text,source){
  const {n,skipped,sections,lem}=applyRows(text);
  if(n===0){
    setStatus("err","No rate rows recognised in "+source+". Each row needs a term plus its rates in card order, like: Fixed - 6 months 4.89% 4.79% 5.39%.");
    return false;
  }
  renderEditor(); renderLem(); calc();
  $("#rateedit").open=true;
  const secTxt = sections.map(s=>SECTION_NAMES[s]).join(", ");
  setStatus("ok","Loaded "+n+" new rate"+(n===1?"":"s")+" from "+source+" into "+secTxt+
    (skipped?". Skipped "+skipped+" line"+(skipped===1?"":"s"):"")+
    (lastRateColumn.matrix ? ". Read "+lastRateColumn.from : ". Took the New Rate column, matched from "+lastRateColumn.from)+
    (lem ? ". Low Equity Premium bands updated ("+lem+")" : "")+
    ". Check the rate table below to confirm.");
  return true;
}

const PDFJS_SRC="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const TESS_SRC="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";

function loadScript(src){
  return new Promise((res,rej)=>{
    if([...document.scripts].some(s=>s.src===src)) return res();
    const el=document.createElement("script");
    el.src=src; el.onload=()=>res();
    el.onerror=()=>rej(new Error("couldn't load a required library — check your internet connection"));
    document.head.appendChild(el);
  });
}

/* sharpen and enlarge before OCR — small type reads badly at native size */
function prepCanvas(img,scale){
  const c=document.createElement("canvas");
  c.width=img.width*scale; c.height=img.height*scale;
  const x=c.getContext("2d");
  x.imageSmoothingQuality="high";
  x.drawImage(img,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height), a=d.data;
  for(let i=0;i<a.length;i+=4){
    const g=0.299*a[i]+0.587*a[i+1]+0.114*a[i+2];
    const v=g>165?255:(g<105?0:g);
    a[i]=a[i+1]=a[i+2]=v;
  }
  x.putImageData(d,0,0);
  return c;
}
/* ---------- choosing how to read an image ----------
   Two settings decide whether a rate card reads at all.

   Page segmentation: tesseract.js defaults to SINGLE_BLOCK, which treats a
   bordered table as one paragraph of prose and returns almost nothing from it.
   The tesseract command line defaults to AUTO instead, and AUTO is what reads
   these cards properly, so it has to be asked for explicitly.

   Preparation: sharpening helps a dim photo and ruins a clean screenshot,
   because a fixed threshold eats the thin strokes of small type while
   tesseract already does its own adaptive version. So the image is read as it
   is first and only worked on if that comes back thin. */
function canvasOf(img,scale,cropTop){
  const skip=Math.round((img.height||0)*(cropTop||0));
  const sh=(img.height||0)-skip;
  const c=document.createElement("canvas");
  c.width=Math.round(img.width*scale); c.height=Math.round(sh*scale);
  const x=c.getContext("2d");
  x.imageSmoothingQuality="high";
  x.drawImage(img,0,skip,img.width,sh,0,0,c.width,c.height);
  return c;
}

/* a usable row carries some words and at least two rates */
function readScore(text){
  let n=0;
  (text||"").split(/\r?\n/).forEach(l=>{
    const nums=(l.match(/\d+\.\d+/g)||[]).length;
    if(nums>=2 && /[a-z]{3}/i.test(l)) n++;
  });
  return n;
}

async function ocrBest(img){
  const tries=[
    {how:"as it is",          psm:3, make:()=>canvasOf(img,1)},
    /* A stacked header \u2014 a band like "Loan to Value Band" sitting above the
       columns it spans \u2014 throws off the page analysis badly enough that whole
       blocks of rows are dropped. Setting the header aside recovers them, and
       costs nothing on cards that did not need it because the best read wins. */
    {how:"below the header",  psm:3, make:()=>canvasOf(img,1,0.15)},
    {how:"column by column",  psm:4, make:()=>canvasOf(img,1)},
    {how:"enlarged",          psm:3, make:()=>canvasOf(img,2)},
    {how:"sharpened",         psm:3, make:()=>prepCanvas(img,2)}
  ];
  let best={score:-1,text:"",how:""};
  for(let i=0;i<tries.length;i++){
    busy(true,"Reading the rate card","Reading the image "+tries[i].how+"\u2026",null);
    let text="";
    try{ text=await ocrCanvas(tries[i].make(),tries[i].psm); }
    catch(e){ if(i===tries.length-1) throw e; }
    const s=readScore(text);
    if(s>best.score) best={score:s,text:text,how:tries[i].how};
    if(s>=4) break;      /* a decent read \u2014 the heavier passes cost seconds each */
  }
  return best;
}

async function ocrCanvas(canvas,psm){
  await loadScript(TESS_SRC);
  const worker=await Tesseract.createWorker("eng",1,{
    logger:m=>{
      if(m.status==="recognizing text") busy(true,"Reading the rate card","Recognising the tables — "+Math.round(m.progress*100)+"%",m.progress*100);
      else busy(true,"Reading the rate card","Warming up the text engine…",null);
    }
  });
  try{
    /* Left to itself tesseract.js uses SINGLE_BLOCK, which reads a bordered
       rate table as one paragraph and loses nearly every row. AUTO is what the
       command line tool uses by default and what these cards need. */
    await worker.setParameters({
      tessedit_pageseg_mode: String(psm||3),
      preserve_interword_spaces: "1"
    });
    const {data:{text}}=await worker.recognize(canvas);
    return text;
  } finally { await worker.terminate(); }
}
async function pdfText(file){
  await loadScript(PDFJS_SRC);
  pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
  const buf=await file.arrayBuffer();
  const doc=await pdfjsLib.getDocument({data:buf}).promise;
  let out="";
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p);
    const content=await page.getTextContent();
    const rows={};
    content.items.forEach(it=>{
      const key=Math.round(it.transform[5]/4);
      (rows[key]=rows[key]||[]).push(it);
    });
    /* A PDF content stream may emit a row's cells in any order, so the columns
       have to be put back into reading order by their x position before the
       row is joined — otherwise Current Rate and New Rate can arrive swapped. */
    out+=Object.keys(rows).sort((a,b)=>b-a).map(k=>
      rows[k].sort((p,q)=>p.transform[4]-q.transform[4]).map(i=>i.str).join(" ")
    ).join("\n")+"\n";
  }
  return {text:out, doc};
}
async function pdfOcr(doc){
  let out="";
  for(let p=1;p<=Math.min(doc.numPages,3);p++){
    const page=await doc.getPage(p);
    const vp=page.getViewport({scale:2});
    const c=document.createElement("canvas");
    c.width=vp.width; c.height=vp.height;
    await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    /* rendered at scale 2 the page is already generous, so read it untouched
       and only work on it if that comes back thin */
    let pageText=await ocrCanvas(c,3);
    if(readScore(pageText)<3){
      const alt=await ocrCanvas(c,4);
      if(readScore(alt)>readScore(pageText)) pageText=alt;
    }
    if(readScore(pageText)<3){
      const sharp=await ocrCanvas(prepCanvas(c,1),3);
      if(readScore(sharp)>readScore(pageText)) pageText=sharp;
    }
    out+=pageText+"\n";
  }
  return out;
}
function imageFromFile(file){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>res(img);
    img.onerror=()=>rej(new Error("that image couldn't be opened"));
    img.src=URL.createObjectURL(file);
  });
}
async function handleFile(file){
  const isPdf = file.type==="application/pdf" || /\.pdf$/i.test(file.name);
  busy(true,"Reading the rate card","Opening “"+file.name+"”…",null);
  setStatus("load","Reading “"+file.name+"”…");
  try{
    let text="";
    if(isPdf){
      busy(true,"Reading the rate card","Pulling the text out of the PDF…",null);
      const {text:layer,doc}=await pdfText(file);
      text=layer;
      const snapshot=structuredClone(rates), lemSnap=structuredClone(lemBands);
      const trial=applyRows(layer).n;
      rates=snapshot; lemBands=lemSnap;                                   // undo the trial pass
      if(trial<3){
        busy(true,"Reading the rate card","No text layer — reading the page as an image…",null);
        text=await pdfOcr(doc);
      }
    }else{
      const img=await imageFromFile(file);
      text=(await ocrBest(img)).text;
    }
    busy(true,"Reading the rate card","Matching the rows…",100);
    await new Promise(r=>setTimeout(r,220));
    loadText(text,"“"+file.name+"”");
  }catch(err){
    setStatus("err","Couldn't read that file ("+err.message+"). Copy the rate rows and use “Paste rates from the rate card” below instead.");
  }finally{
    busy(false);
  }
}

/* ==========================================================================
   WORD EXPORT — drops the ratesheet on screen into this bank's Word template
   --------------------------------------------------------------------------
   The template is a real .docx carried inside this file as base64. A .docx is
   a zip of XML parts, so the export opens that zip, rewrites only the pieces
   that change inside word/document.xml, and zips it back up. Every other part
   — styles, fonts, headers, the whole bottom half of the letter — is copied
   through byte for byte, so what lands in the client's inbox is the adviser's
   own template with today's numbers in it.

   What gets replaced:
     1. the rates table at the top        -> rebuilt from the table on screen
     2. the "*Repayments are on ..." line -> every note under the ratesheet
     3. the "* ... cash for having your home loan ..." line -> removed, because
        the notes in (2) already carry the bank's own cash wording
   Everything below those notes is left exactly as the adviser wrote it.

   The table is read straight off the screen rather than out of this bank's
   internals, so the Word table always says what the adviser is looking at —
   same rows, same order, same traffic-light colours, same "Your Discount" or
   "LEM" heading — and one engine serves every bank in the book.
   ========================================================================== */

const WX_FILE   = "Loan Structure - Ratesheet - " + WORD_CFG.bank + ".docx";
const WX_TPLKEY = "wordtpl_" + WORD_CFG.id + "_v1";
let   WX_TPL    = null;   /* {name,b64} once the adviser supplies their own */

try{ WX_TPL = JSON.parse(localStorage.getItem(WX_TPLKEY) || "null"); }catch(e){ WX_TPL = null; }

/* ---------------- bytes ---------------- */
function wxB64Bytes(b64){
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return u;
}
function wxBytesB64(u8){
  let s=""; const C=0x8000;
  for(let i=0;i<u8.length;i+=C) s += String.fromCharCode.apply(null, u8.subarray(i,i+C));
  return btoa(s);
}

let WX_CRCT = null;
function wxCrc32(u8){
  if(!WX_CRCT){
    WX_CRCT = new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); WX_CRCT[n]=c>>>0; }
  }
  let c = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = WX_CRCT[(c ^ u8[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0;
}

/* Raw deflate through the browser's own Compression Streams — no library.
   A browser too old to compress simply stores the part instead, which Word
   reads perfectly well; the file is just a little larger. */
async function wxInflate(u8){
  if(typeof DecompressionStream !== "function")
    throw new Error("this browser cannot read a compressed Word template — try Chrome, Edge, or Safari 16.4 or newer");
  const st = new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function wxDeflate(u8){
  if(typeof CompressionStream !== "function") return null;
  const st = new Blob([u8]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(st).arrayBuffer());
}

/* ---------------- zip ---------------- */
function wxZipRead(buf){
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for(let i=buf.length-22; i>=0 && i > buf.length-22-65557; i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd < 0) throw new Error("that file is not a Word document");
  const count = dv.getUint16(eocd+10,true);
  let p = dv.getUint32(eocd+16,true);
  const dec = new TextDecoder(), out = [];
  for(let i=0;i<count;i++){
    if(dv.getUint32(p,true) !== 0x02014b50) throw new Error("that Word document is damaged");
    const method=dv.getUint16(p+10,true), mtime=dv.getUint16(p+12,true), mdate=dv.getUint16(p+14,true),
          crc=dv.getUint32(p+16,true), csize=dv.getUint32(p+20,true), usize=dv.getUint32(p+24,true),
          nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true),
          lho=dv.getUint32(p+42,true);
    const name = dec.decode(buf.subarray(p+46, p+46+nlen));
    const dstart = lho + 30 + dv.getUint16(lho+26,true) + dv.getUint16(lho+28,true);
    out.push({ name, method, crc, csize, usize, mtime, mdate, data: buf.subarray(dstart, dstart+csize) });
    p += 46 + nlen + elen + clen;
  }
  return out;
}

function wxZipWrite(entries){
  const enc = new TextEncoder(), body = [], dir = [];
  let off = 0;
  entries.forEach(e => {
    const nm = enc.encode(e.name);
    const lh = new Uint8Array(30 + nm.length), lv = new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0,true);
    lv.setUint16(8,e.method,true);   lv.setUint16(10,e.mtime,true); lv.setUint16(12,e.mdate,true);
    lv.setUint32(14,e.crc,true);     lv.setUint32(18,e.csize,true); lv.setUint32(22,e.usize,true);
    lv.setUint16(26,nm.length,true); lv.setUint16(28,0,true);
    lh.set(nm,30);
    body.push(lh, e.data);

    const ch = new Uint8Array(46 + nm.length), cv = new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true); cv.setUint16(8,0,true);
    cv.setUint16(10,e.method,true);  cv.setUint16(12,e.mtime,true); cv.setUint16(14,e.mdate,true);
    cv.setUint32(16,e.crc,true);     cv.setUint32(20,e.csize,true); cv.setUint32(24,e.usize,true);
    cv.setUint16(28,nm.length,true); cv.setUint32(42,off,true);
    ch.set(nm,46);
    dir.push(ch);
    off += lh.length + e.data.length;
  });
  const dirSize = dir.reduce((a,b)=>a+b.length,0);
  const eo = new Uint8Array(22), ev = new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(8,entries.length,true); ev.setUint16(10,entries.length,true);
  ev.setUint32(12,dirSize,true);       ev.setUint32(16,off,true);
  return new Blob(body.concat(dir,[eo]),
    {type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

/* ---------------- reading the table off the screen ---------------- */
function wxText(el){
  const c = el.cloneNode(true);
  Array.prototype.forEach.call(c.querySelectorAll("br"), function(b){ b.parentNode.replaceChild(document.createTextNode(" "), b); });
  return (c.textContent || "").replace(/\s+/g," ").trim();
}
/* On screen some banks reverse their heading strip out of a coloured bar. The
   Word table keeps the template's plain white look, so anything close to white
   would vanish — those cells come back as black instead. */
function wxHex(css){
  const m = /rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(css || "");
  if(!m) return "000000";
  const r = +m[1], g = +m[2], b = +m[3];
  if(0.299*r + 0.587*g + 0.114*b > 215) return "000000";
  return [r,g,b].map(function(v){ return ("0" + v.toString(16)).slice(-2); }).join("").toUpperCase();
}

/* Turns a <thead>/<tbody> into a rectangular grid so rowspan and colspan can
   be replayed as Word's vMerge and gridSpan. */
function wxGrid(section){
  const grid = [];
  Array.prototype.forEach.call(section.rows, function(tr, r){
    grid[r] = grid[r] || [];
    let c = 0;
    Array.prototype.forEach.call(tr.cells, function(td){
      while(grid[r][c]) c++;
      const cs = td.colSpan || 1, rs = td.rowSpan || 1;
      for(let i=0;i<rs;i++){
        grid[r+i] = grid[r+i] || [];
        for(let j=0;j<cs;j++)
          grid[r+i][c+j] = { td:td, span:cs, rows:rs, colStart:(j===0), rowStart:(i===0) };
      }
      c += cs;
    });
  });
  return grid;
}

function wxReadCell(td, head){
  const cs = getComputedStyle(td);
  return {
    text:  wxText(td),
    color: head ? "000000" : wxHex(cs.color),
    bold:  head || parseInt(cs.fontWeight,10) >= 600 || cs.fontWeight === "bold",
    align: cs.textAlign === "right" ? "right" : (cs.textAlign === "left" || cs.textAlign === "start") ? "left" : "center"
  };
}

/* ---------------- column widths, so every row stays on one line ----------
   Data cells are measured at full length and never allowed to wrap. Header
   cells may still wrap onto the second deck, exactly as the template does, so
   a long heading never squeezes the rows. If even the unwrappable content is
   wider than the page, the whole table steps down a point size until it fits
   rather than breaking a row in two. */
let WX_MEAS = null;
function wxWidth(text, bold, pt){
  if(!WX_MEAS) WX_MEAS = document.createElement("canvas").getContext("2d");
  WX_MEAS.font = (bold ? "bold " : "") + (pt * 4 / 3) + 'px Calibri, Carlito, Candara, "Segoe UI", Arial, sans-serif';
  return WX_MEAS.measureText(text).width * 15;          /* px -> twips */
}
const WX_PAD = 200;                                      /* cell margins + a little air */

function wxColumnWidths(head, body, cols, avail, pt){
  const min = new Array(cols).fill(240), want = new Array(cols).fill(240);
  /* A cell that spans columns only has to fit across the columns it covers,
     so its width is claimed once, from the column it starts in. */
  function claim(arr, from, span, need){
    span = Math.min(span, cols - from);
    if(span < 1) return;
    let have = 0;
    for(let i=0;i<span;i++) have += arr[from+i];
    if(need <= have) return;
    const extra = (need - have) / span;
    for(let i=0;i<span;i++) arr[from+i] += extra;
  }
  body.forEach(function(row){
    row.forEach(function(c){
      if(!c || !c.colStart) return;
      const w = wxWidth(c.text, c.bold, pt) + WX_PAD;
      claim(min, c.col, c.span, w); claim(want, c.col, c.span, w);
    });
  });
  head.forEach(function(row){
    row.forEach(function(c){
      if(!c || !c.colStart) return;
      const longest = c.text.split(" ").reduce(function(a,w){ return Math.max(a, wxWidth(w, c.bold, pt)); }, 0);
      claim(min,  c.col, c.span, longest + WX_PAD);
      claim(want, c.col, c.span, wxWidth(c.text, c.bold, pt) + WX_PAD);
    });
  });

  const sumMin = min.reduce(function(a,b){ return a+b; }, 0);
  if(sumMin > avail) return null;                        /* caller drops a point size */

  const sumWant = want.reduce(function(a,b){ return a+b; }, 0);
  let out;
  if(sumWant <= avail){
    const slack = (avail - sumWant) / cols;
    out = want.map(function(w){ return w + slack; });
  }else{
    const room = avail - sumMin, hunger = sumWant - sumMin;
    out = min.map(function(w,i){ return w + room * ((want[i]-w) / hunger); });
  }
  out = out.map(function(w){ return Math.round(w); });
  out[cols-1] += avail - out.reduce(function(a,b){ return a+b; }, 0);
  return out;
}

/* ---------------- WordprocessingML ---------------- */
function wxEsc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function wxBd(tag, kind){
  return kind === "nil"
    ? '<w:' + tag + ' w:val="nil"/>'
    : '<w:' + tag + ' w:val="single" w:sz="8" w:space="0" w:color="auto"/>';
}
function wxP(c, pt){
  const sz = Math.round(pt * 2);
  const rpr = '<w:rFonts w:ascii="Calibri" w:eastAsia="Times New Roman" w:hAnsi="Calibri" w:cs="Calibri"/>' +
              (c.bold ? "<w:b/><w:bCs/>" : "") +
              '<w:color w:val="' + c.color + '"/>' +
              '<w:sz w:val="' + sz + '"/><w:szCs w:val="' + sz + '"/><w:lang w:eastAsia="en-GB"/>';
  const jc = c.align === "left" ? "" : '<w:jc w:val="' + (c.align === "right" ? "right" : "center") + '"/>';
  return '<w:p><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/>' + jc +
         "<w:rPr>" + rpr + "</w:rPr></w:pPr>" +
         (c.text === "" ? "" : "<w:r><w:rPr>" + rpr + '</w:rPr><w:t xml:space="preserve">' + wxEsc(c.text) + "</w:t></w:r>") +
         "</w:p>";
}
function wxTc(w, inner, o){
  const b = o.bd;
  return '<w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/>' +
    (o.span > 1 ? '<w:gridSpan w:val="' + o.span + '"/>' : "") +
    (o.vm === "restart" ? '<w:vMerge w:val="restart"/>' : o.vm === "cont" ? "<w:vMerge/>" : "") +
    "<w:tcBorders>" + wxBd("top",b.t) + wxBd("left",b.l) + wxBd("bottom",b.b) + wxBd("right",b.r) + "</w:tcBorders>" +
    (o.noWrap ? "<w:noWrap/>" : "") +
    '<w:vAlign w:val="center"/></w:tcPr>' + inner + "</w:tc>";
}

function wxBuildTable(head, body, widths, pt){
  const cols = widths.length;
  let x = '<w:tbl><w:tblPr><w:tblW w:w="' + widths.reduce(function(a,b){return a+b;},0) + '" w:type="dxa"/>' +
          '<w:tblCellMar><w:left w:w="85" w:type="dxa"/><w:right w:w="85" w:type="dxa"/></w:tblCellMar>' +
          '<w:tblLook w:val="04A0" w:firstRow="1" w:lastRow="0" w:firstColumn="1" w:lastColumn="0" w:noHBand="0" w:noVBand="1"/>' +
          "</w:tblPr><w:tblGrid>" + widths.map(function(w){ return '<w:gridCol w:w="' + w + '"/>'; }).join("") + "</w:tblGrid>";

  function emit(rows, isHead){
    rows.forEach(function(row, r){
      x += '<w:tr><w:trPr>' + (isHead ? "<w:tblHeader/>" : '<w:trHeight w:val="340"/>') + "</w:trPr>";
      for(let c=0;c<cols;c++){
        const cell = row[c];
        if(!cell || !cell.colStart) continue;
        let w = 0; for(let i=0;i<cell.span;i++) w += widths[c+i];
        /* the header is boxed in; below it the horizontal rules come from each
           row's own bottom edge and the verticals from the cell to the left */
        const bd = isHead
          ? { t:"single", l:"single", b:"single", r:"single" }
          : { t:"nil", l:(c === 0 ? "single" : "nil"), b:"single", r:"single" };
        x += wxTc(w, wxP(cell, pt), {
          span: cell.span,
          vm: cell.rows > 1 ? (cell.rowStart ? "restart" : "cont") : null,
          bd: bd,
          noWrap: !isHead
        });
      }
      x += "</w:tr>";
    });
  }
  emit(head, true);
  emit(body, false);
  return x + "</w:tbl>";
}

function wxNote(text){
  const rpr = '<w:rPr><w:rFonts w:cstheme="minorHAnsi"/><w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr>';
  return '<w:p><w:pPr><w:spacing w:after="0"/>' + rpr + "</w:pPr>" +
         "<w:r>" + rpr + '<w:t xml:space="preserve">' + wxEsc(text) + "</w:t></w:r></w:p>";
}

/* ---------------- surgery on word/document.xml ---------------- */
function wxFindTable(xml){
  const scan = /<w:tbl[\s>]|<\/w:tbl>/g;
  let m, start = -1, depth = 0;
  while((m = scan.exec(xml))){
    if(m[0].charAt(1) === "/"){ if(--depth === 0) return {start:start, end:scan.lastIndex}; }
    else { if(depth === 0) start = m.index; depth++; }
  }
  return null;
}
function wxFindPara(xml, needle){
  const i = xml.indexOf(needle);
  if(i < 0) return null;
  const s = Math.max(xml.lastIndexOf("<w:p ", i), xml.lastIndexOf("<w:p>", i));
  const e = xml.indexOf("</w:p>", i);
  if(s < 0 || e < 0) return null;
  return {start:s, end:e+6};
}
function wxSplice(xml, at, text){ return xml.slice(0, at.start) + text + xml.slice(at.end); }

/* the width of the template's own text column, so the table lines up with the
   paragraphs underneath it instead of hanging into the margin */
function wxTextWidth(xml){
  const pg = /<w:pgSz\b[^>]*w:w="(\d+)"/.exec(xml);
  const mg = /<w:pgMar\b[^>]*>/.exec(xml);
  if(!pg || !mg) return 9026;
  const left  = /w:left="(\d+)"/.exec(mg[0]);
  const right = /w:right="(\d+)"/.exec(mg[0]);
  const w = +pg[1] - (left ? +left[1] : 1440) - (right ? +right[1] : 1440);
  return w > 2000 ? w : 9026;
}

/* ---------------- the ratesheet on screen ---------------- */
function wxScrape(){
  const table = document.querySelector(WORD_CFG.table);
  if(!table || !table.tHead || !table.tBodies.length || !table.tBodies[0].rows.length)
    throw new Error("there is no ratesheet on screen yet — fill in the deal first");

  const hg = wxGrid(table.tHead), bg = wxGrid(table.tBodies[0]);
  const cols = Math.max.apply(null, hg.concat(bg).map(function(r){ return r.length; }));

  function pack(grid, head){
    return grid.map(function(row){
      const out = new Array(cols).fill(null);
      for(let c=0;c<cols;c++){
        const g = row[c];
        if(!g) continue;
        const cell = wxReadCell(g.td, head);
        cell.span = g.span; cell.rows = g.rows; cell.colStart = g.colStart; cell.rowStart = g.rowStart; cell.col = c;
        out[c] = cell;
      }
      return out;
    });
  }
  const head = pack(hg, true), body = pack(bg, false);

  const footEl = WORD_CFG.foot ? document.querySelector(WORD_CFG.foot) : null;
  let notes = [];
  if(footEl){
    const divs = Array.prototype.filter.call(footEl.querySelectorAll("div"), function(d){ return !d.querySelector("div"); });
    if(divs.length) notes = divs.map(wxText);
    else notes = footEl.innerHTML.split(/<br\s*\/?>/i).map(function(part){
      const t = document.createElement("div"); t.innerHTML = part; return wxText(t);
    });
  }
  notes = notes.filter(function(t){ return t; });

  return {head:head, body:body, cols:cols, notes:notes};
}

function wxFill(xml){
  const s = wxScrape();
  const avail = wxTextWidth(xml);

  let pt = 14, widths = null;
  while(pt >= 8 && !(widths = wxColumnWidths(s.head, s.body, s.cols, avail, pt))) pt -= 0.5;
  if(!widths) throw new Error("the ratesheet has more columns than will fit on the page");

  const tbl = wxFindTable(xml);
  if(!tbl) throw new Error("no table found in that template — the rates table has to be the first table in the document");
  xml = wxSplice(xml, tbl, wxBuildTable(s.head, s.body, widths, pt));

  if(s.notes.length){
    /* The template's cash line goes first. Left until afterwards, the search
       would find the freshly written note instead and delete that, leaving the
       placeholder behind. */
    const cp = wxFindPara(xml, "cash for having your home loan");
    if(cp) xml = wxSplice(xml, cp, "");
    const rp = wxFindPara(xml, "Repayments are on");
    if(rp) xml = wxSplice(xml, rp, s.notes.map(wxNote).join(""));
  }
  return xml;
}

/* ---------------- build and hand over the file ---------------- */
async function wxBuild(){
  const parts = wxZipRead(wxB64Bytes(WX_TPL ? WX_TPL.b64 : WORD_TEMPLATE_B64));
  const doc = parts.filter(function(p){ return p.name === "word/document.xml"; })[0];
  if(!doc) throw new Error("that file is not a Word document");

  const raw = doc.method === 8 ? await wxInflate(doc.data) : doc.data;
  const out = new TextEncoder().encode(wxFill(new TextDecoder().decode(raw)));

  const packed = await wxDeflate(out);
  doc.method = packed ? 8 : 0;
  doc.data   = packed || out;
  doc.csize  = doc.data.length;
  doc.usize  = out.length;
  doc.crc    = wxCrc32(out);

  return wxZipWrite(parts);
}

/* A blob link clicked inside this frame is refused by some browsers, so the
   link is hung off the outer page whenever that page is reachable. */
function wxSave(blob, name){
  let doc = document;
  try{ if(window.top && window.top.document && window.top.document.body) doc = window.top.document; }catch(e){}
  const url = URL.createObjectURL(blob);
  const a = doc.createElement("a");
  a.href = url; a.download = name; a.style.display = "none";
  doc.body.appendChild(a); a.click();
  setTimeout(function(){ try{ a.parentNode.removeChild(a); }catch(e){} URL.revokeObjectURL(url); }, 30000);
}

/* ---------------- controls ---------------- */
(function(){
  const anchor = document.querySelector(WORD_CFG.mount);
  if(!anchor) return;
  const host = anchor.closest(".fld") || anchor;
  const wrap = document.createElement("span");
  wrap.style.cssText = "display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap";
  wrap.innerHTML =
    '<button type="button" class="' + WORD_CFG.cls + '" id="wordBtn">Download Word</button>' +
    '<button type="button" class="' + WORD_CFG.ghost + '" id="tplBtn">Word template…</button>' +
    '<button type="button" id="tplReset" hidden style="background:none;border:0;padding:0;font:inherit;font-size:11px;text-decoration:underline;cursor:pointer;color:inherit;opacity:.75"></button>' +
    '<span id="wordStatus" style="font-size:11px;opacity:.8"></span>' +
    '<input type="file" id="tplFile" accept=".docx" style="display:none">';
  if(host.parentNode) host.parentNode.insertBefore(wrap, host.nextSibling);

  const $$ = function(id){ return document.getElementById(id); };
  let timer = null;
  function say(msg){
    const el = $$("wordStatus"); if(!el) return;
    el.textContent = msg || "";
    clearTimeout(timer);
    if(msg) timer = setTimeout(function(){ el.textContent = ""; }, 6000);
  }
  function paint(){
    $$("tplBtn").textContent = WX_TPL ? "Template: " + WX_TPL.name : "Word template…";
    $$("tplBtn").title = WX_TPL
      ? "Downloads use your own template. Click to choose a different one."
      : "Downloads use the built-in " + WORD_CFG.bank + " template. Click to use your own .docx instead.";
    $$("tplReset").hidden = !WX_TPL;
    $$("tplReset").textContent = "use the built-in one";
  }
  function setTpl(t){
    WX_TPL = t;
    try{ t ? localStorage.setItem(WX_TPLKEY, JSON.stringify(t)) : localStorage.removeItem(WX_TPLKEY); }
    catch(e){ say("Loaded for now, but there is no room to remember it."); }
    paint();
  }

  $$("wordBtn").addEventListener("click", async function(){
    const b = $$("wordBtn"), was = b.textContent;
    b.disabled = true; b.textContent = "Building…";
    try{ wxSave(await wxBuild(), WX_FILE); say("Saved — " + WX_FILE); }
    catch(err){ say("Could not build it: " + err.message); }
    finally{ b.disabled = false; b.textContent = was; }
  });
  $$("tplBtn").addEventListener("click", function(){ $$("tplFile").click(); });
  $$("tplReset").addEventListener("click", function(){ setTpl(null); say("Back to the built-in " + WORD_CFG.bank + " template."); });
  $$("tplFile").addEventListener("change", function(e){
    const f = e.target.files[0]; e.target.value = "";
    if(!f) return;
    if(!/\.docx$/i.test(f.name)){ say("Please choose a .docx file."); return; }
    const fr = new FileReader();
    fr.onerror = function(){ say("That file could not be read."); };
    fr.onload = function(){
      try{
        const bytes = new Uint8Array(fr.result);
        if(!wxZipRead(bytes).some(function(p){ return p.name === "word/document.xml"; }))
          throw new Error("that file is not a Word document");
        setTpl({ name:f.name, b64:wxBytesB64(bytes) });
        say("Template set — " + f.name);
      }catch(err){ say("Could not use that template: " + err.message); }
    };
    fr.readAsArrayBuffer(f);
  });
  paint();
})();

<\/script>

</script>

<!DOCTYPE html>
<html lang="en">

<title>Kiwisaver Ratesheet Calculator by D.E. Visto</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"><\/script>
<style>
  :root{

  header.app h1{font-size:22px;margin:0;font-weight:900;letter-spacing:-.3px;text-transform:uppercase;line-height:1.1}

  .app-logo{display:flex;align-items:center;justify-content:center;min-width:120px;height:52px;padding:6px 16px;background:#fff;border:1.5px solid var(--ink);border-radius:10px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.14);transition:.15s;position:relative}
  .app-logo:hover{box-shadow:0 3px 0 rgba(0,0,0,.18);transform:translateY(-1px)}
  .app-logo img{max-height:40px;max-width:150px;object-fit:contain;display:none}
  .app-logo #logoText{font-size:15px;font-weight:900;color:var(--brand-dark);letter-spacing:.3px}
  .app-logo .logo-hint{position:absolute;bottom:-17px;right:2px;font-size:9.5px;color:#ffffffcc;white-space:nowrap;font-weight:600}
  .wrap{max-width:1400px;margin:0 auto;padding:20px 20px 78px}
  .main-grid{display:grid;grid-template-columns:minmax(420px,1fr) minmax(660px,1.25fr);gap:20px;align-items:start;margin-bottom:20px}
  @media(max-width:1180px){.main-grid{grid-template-columns:1fr}}
  .grid-left,.grid-right{min-width:0}
  .section-label{font-size:11px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink);margin:0 0 9px;display:flex;align-items:center;gap:8px}
  .section-label::after{content:"";flex:1;height:2px;background:var(--ink)}
  #uploadPanel .drop{padding:14px}
  #uploadPanel .big{font-size:13px}
  .panel{background:var(--panel);border:1.5px solid var(--ink);border-radius:14px;padding:20px 22px;margin-bottom:20px;box-shadow:0 10px 28px rgba(20,30,16,.07)}
  .panel h2{margin:0 0 12px;padding-bottom:10px;font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;color:var(--ink);border-bottom:2px solid var(--ink);display:flex;align-items:baseline;gap:10px}
  .pane-tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);background:var(--brand-soft);border:1px solid var(--brand-tint);border-radius:20px;padding:2px 9px;margin-left:auto}
  h2.panel-toggle{margin:0;padding-bottom:10px;border-bottom:2px solid var(--ink);cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
  h2.panel-toggle .chev{font-size:12px;transition:transform .18s;color:var(--brand)}
  .panel.collapsed h2.panel-toggle{margin-bottom:0;border-bottom:0}
  .panel.collapsed h2.panel-toggle .chev{transform:rotate(-90deg)}
  .panel.collapsed .panel-body{display:none}
  .panel-body{margin-top:4px}
  .panel p.hint{margin:0 0 16px;font-size:12.5px;color:var(--muted)}
  .hidden{display:none}

  /* ---- Deal form (image 1 style) ---- */
  .form-grid{display:inline-block;border-collapse:collapse}
  table.deal{border-collapse:separate;border-spacing:6px 6px}
  table.deal td{vertical-align:middle}
  .lbl{background:var(--green-dark);color:#fff;font-weight:800;font-size:16px;padding:12px 16px;border-radius:2px;min-width:230px}
  .lbl.plain{background:#fff;color:#1b1b1b;border:2px solid #1b1b1b}
  .val{min-width:230px}
  .val input{width:100%;font-size:17px;padding:11px 14px;border:2px solid #1b1b1b;border-radius:2px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
  .val input:focus{outline:2px solid var(--brand-accent);outline-offset:1px}
  .cell-soft{background:var(--green-soft);border:2px solid #1b1b1b;padding:11px 14px;text-align:right;font-size:17px;font-weight:700;border-radius:2px}
  .cell-lvr{background:var(--green-lvr);border:2px solid #1b1b1b;padding:11px 14px;text-align:right;font-size:18px;font-weight:800;border-radius:2px}
  .yn{width:100%;font-size:17px;font-weight:800;color:#fff;padding:11px 14px;border:2px solid #1b1b1b;border-radius:2px;appearance:none;-webkit-appearance:none;cursor:pointer;
     background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='white'><path d='M7 10l5 5 5-5z'/></svg>");
     background-repeat:no-repeat;background-position:right 10px center}
  .yn.no{background-color:var(--red)}
  .yn.yes{background-color:var(--green-yes)}
  .enter-note{font-style:italic;color:var(--green-mid);font-size:13px;text-align:right;padding-bottom:4px}

  /* ---- Modern Deal tab ---- */
  .deal-wrap{display:block}
  .cash-card-wrap{margin-bottom:16px}
  .dcard{background:#fff;border:1.5px solid var(--ink);border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:0 6px 16px rgba(20,30,16,.05)}
  .dcard-h{font-size:11.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--brand-dark);margin-bottom:14px;padding-bottom:10px;border-bottom:1.5px solid var(--line);display:flex;align-items:center;gap:8px}
  .dcard-h::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brand)}
  .dgrid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:480px){.dgrid2{grid-template-columns:1fr}}
  .dfield{margin-bottom:14px}
  .dgrid2 .dfield,.dfield:last-child{margin-bottom:0}
  .dfield label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px}
  .dfield input{width:100%;font-size:16px;padding:10px 13px;border:1.5px solid var(--ink);border-radius:6px;font-weight:700;color:var(--ink);background:#fff;transition:.15s;font-variant-numeric:tabular-nums}
  .dfield input:focus{outline:3px solid var(--brand-tint);outline-offset:1px;border-color:var(--brand-dark)}
  .imoney{position:relative}
  .imoney span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:800;pointer-events:none}
  .imoney input{padding-left:25px}
  .lvr-box{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:14px 16px;border-radius:11px;background:var(--brand-soft);border:1.5px solid var(--ink)}
  .lvr-k{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .lvr-v{font-size:30px;font-weight:900;color:var(--brand-dark);line-height:1.1}
  .lvr-t{font-size:11.5px;color:var(--muted);text-align:right;max-width:160px;font-weight:700}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
  .toggle-row:last-child{border-bottom:none}
  .toggle-row.disabled{opacity:.5}
  .toggle-row.disabled .toggle-name{color:#93a08c}
  .switch input:disabled+.slider{cursor:not-allowed}
  .toggle-row.disabled .switch{cursor:not-allowed}
  .toggle-name{font-size:14px;font-weight:700;color:var(--ink)}
  .tg{display:flex;align-items:center;gap:11px}
  .tg .st{font-size:12px;font-weight:800;width:26px;text-align:right;color:#a2ad98}
  .tg .st.on{color:var(--brand-dark)}
  .switch{position:relative;display:inline-block;width:44px;height:25px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;cursor:pointer;inset:0;background:#d0d5c8;border-radius:25px;transition:.2s}
  .slider::before{content:"";position:absolute;height:19px;width:19px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .switch input:checked+.slider{background:var(--brand)}
  .switch input:checked+.slider::before{transform:translateX(19px)}
  .cash-card{background:linear-gradient(160deg,var(--brand),var(--brand-dark));border:1.5px solid var(--ink);border-radius:14px;padding:22px 22px 20px;color:#fff;position:sticky;top:66px;box-shadow:0 10px 26px rgba(20,30,16,.2)}
  .cash-card .ck{font-size:11.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--brand-accent)}
  .cash-card .cv{font-size:40px;font-weight:900;margin:5px 0 2px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .cash-card .cbreak{font-size:12px;line-height:1.7;color:#e6f2e8;background:rgba(255,255,255,.1);border-radius:10px;padding:11px 13px;margin-top:12px}
  .cash-card .cbreak strong{color:#fff}
  .cash-card .cmanual{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12.5px;color:#d5ecda;flex-wrap:wrap}
  .cash-card .cmanual label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .cash-card .cmanual input[inputmode]{width:110px;padding:7px 9px;border-radius:7px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;font-weight:700}
  .cash-card .cmanual input[inputmode]::placeholder{color:#bcd9c2}

  /* ---- Master rates (image 3 style) ---- */
  .rate-tables{display:flex;gap:26px;flex-wrap:wrap}
  .rate-block{flex:1;min-width:340px;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 6px 16px rgba(20,30,16,.05)}
  .rate-block .cap{background:var(--brand-tint);color:var(--brand-dark);text-align:right;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding:8px 14px;border-bottom:1.5px solid var(--ink)}
  .rate-block .tier-name{font-weight:800;font-size:12.5px;color:var(--ink);margin:0;padding:8px 14px 4px;text-transform:uppercase;letter-spacing:.4px}
  table.rates{width:100%;border-collapse:collapse;font-size:14px}
  table.rates th{background:var(--brand-tint);color:var(--brand-dark);font-weight:800;padding:9px 8px;text-align:center;border:1px solid var(--line);text-transform:uppercase;font-size:11.5px;letter-spacing:.4px}
  table.rates td.prod{background:#fff;color:var(--ink);font-weight:800;padding:8px 12px;border:1px solid var(--line)}
  table.rates tbody tr:nth-child(even) td.prod{background:var(--brand-soft)}
  table.rates td.rate{border:1px solid var(--line);padding:0}
  table.rates td.rate input{width:100%;border:none;text-align:center;font-size:14px;font-weight:700;padding:9px 4px;background:#fff;font-variant-numeric:tabular-nums}
  table.rates tbody tr:nth-child(even) td.rate input{background:#f5f8f4}
  table.rates td.rate input:focus{outline:2px solid var(--brand-accent);outline-offset:-2px;background:#f0f9f2}

  /* ---- Report (compact, A4-friendly for Word paste) ---- */
  #reportArea{overflow-x:auto}
  #reportArea .rpt-sheet{max-width:620px}
  table.report{width:620px;table-layout:fixed;border-collapse:collapse;background:#fff;font-variant-numeric:tabular-nums;border:1.5px solid var(--ink)}
  table.report th,table.report td{border:1px solid var(--ink);padding:4px 6px;text-align:center;font-size:12px;line-height:1.25;overflow:hidden}
  table.report thead th{font-weight:800;background:var(--brand-tint);text-transform:uppercase;font-size:10.5px;letter-spacing:.3px}
  table.report .term{text-align:left;font-weight:700;padding-left:8px;white-space:nowrap}
  table.report tr.gold td{color:var(--gold)}
  table.report tr.green td{color:var(--rowgreen)}
  table.report tr.red td{color:var(--rowred)}
  table.report tr.reco td{background:var(--brand-soft)}
  .rpt-foot{margin-top:10px;font-size:11px;font-style:italic;color:var(--muted);line-height:1.6;max-width:620px}
  .rpt-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin-bottom:10px;max-width:620px}
  .rpt-head .bank{font-size:19px;font-weight:900;color:var(--ink);text-transform:uppercase}
  .rpt-head .meta{font-size:11.5px;color:var(--muted);text-align:right}
  .tier-badge{display:inline-block;background:var(--ink);color:var(--brand-accent);font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;margin-left:8px;text-transform:uppercase;letter-spacing:.3px}

  /* buttons + misc */
  .btn{background:var(--brand);color:#fff;border:1.5px solid var(--ink);padding:9px 16px;border-radius:6px;font-size:13px;font-weight:800;cursor:pointer;transition:.1s}
  .btn:hover{background:var(--brand-dark)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:#fff;color:var(--brand-dark);border:1.5px solid var(--ink)}
  .btn.ghost:hover{background:var(--brand-soft)}
  .btn.sm{padding:6px 12px;font-size:12px}
  .row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .drop{border:2.5px dashed var(--brand-dark);border-radius:12px;padding:22px;text-align:center;background:var(--brand-soft);cursor:pointer;transition:.15s}
  .drop.drag{background:#fff;border-color:var(--ink);transform:scale(1.005)}
  .drop .big{font-size:14px;font-weight:800;color:var(--brand-dark)}
  .drop .small{font-size:12px;color:var(--muted);margin-top:4px}
  .extract-box{margin-top:14px}
  .extract-box textarea{width:100%;height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;border:1.5px solid var(--ink);border-radius:8px;padding:10px;resize:vertical}
  .detected{margin-top:12px;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
  .detected table{width:100%;border-collapse:collapse;font-size:13px}
  .detected th{background:var(--brand-tint);padding:7px;text-align:left;font-weight:800}
  .detected td{border-top:1px solid var(--line);padding:6px 8px}
  .detected select,.detected input{font-size:12px;padding:3px}
  .flash{background:var(--brand-soft);border:1.5px dashed var(--brand-dark);color:var(--brand-dark);padding:9px 12px;border-radius:8px;font-size:12.5px;margin-top:10px;font-weight:600}
  .status{font-size:12px;color:var(--brand-dark);margin-left:8px;font-weight:700}
  .field-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .field-inline label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);min-width:120px}
  label.cr{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
  label.cr span{flex:1}
  label.cr input[type=text],label.cr input:not([type]){width:100px}
  label.cr input{padding:7px 9px;border:1.5px solid var(--ink);border-radius:6px;font-size:13px;width:100px}
  label.cr input[type=checkbox]{width:auto}
  .crule{font-size:14px;line-height:2.1;color:var(--ink)}
  .crule.muted{color:var(--muted);font-size:13px}
  .crule input{width:64px;padding:5px 7px;border:1.5px solid var(--ink);border-radius:6px;font-size:14px;font-weight:700;text-align:center;background:var(--brand-soft);margin:0 2px}
  .crule input.wide{width:96px}
  .crule .opt{color:#8a8a8a;font-size:12px;margin-left:6px}
  .crule .opt input{border-color:var(--line);background:#fafafa;font-weight:600}
  .crule input[type=checkbox]{width:auto;background:none}
  .crule input:focus{outline:3px solid var(--brand-tint);outline-offset:1px;border-color:var(--brand-dark)}
  .field-inline input,.field-inline select{padding:8px 10px;border:1.5px solid var(--ink);border-radius:6px;font-size:13px}
  .savebar{position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:#fff;padding:10px 18px;display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;z-index:50;border-top:3px solid var(--brand)}
  .savebar .note{margin-right:auto;font-size:12px;opacity:.85}
  @media print{
    header.app,.savebar,.no-print,#uploadPanel,#tab-deal,#tab-rates,.section-label{display:none!important}
    .wrap{max-width:none;padding:0}
    .main-grid{display:block}
    .panel{border:none;padding:0;margin:0;box-shadow:none}
    body{background:#fff}
  }
</style>
</head>
<body>
<header class="app">
  <div>
    <h1>Kiwisaver Ratesheet Calculator <span class="byline-inline" style="font-weight:400;opacity:.8">by D.E. Visto</span></h1>
    <div class="sub">Upload / enter master rates &rarr; fill the deal &rarr; generate the ratesheet</div>
  </div>
  <div class="app-logo" id="logoSlot" title="Click to upload a bank logo">
    <img id="logoImg" alt="Bank logo">
    <span id="logoText">KIWIBANK</span>
    <span class="logo-hint" id="logoHint">click to upload logo</span>
    <input type="file" id="logoInput" accept="image/*" style="display:none">
  </div>
</header>

<div class="wrap">

<\!-- ============ TOP: PDF upload bar ============ -->
<div class="panel" id="uploadPanel">
  <h2>Upload bank ratesheet <span class="pane-tag">drag &amp; drop</span></h2>
  <p class="hint">Drop a ratesheet PDF to auto-extract rates. It reads every rate on each product line, so a sheet listing both LVR bands fills the &le; 80% <strong>and</strong> &gt; 80% tables in one pass. You map each detected column before applying.</p>
  <div class="drop" id="drop">
    <div class="big">Drop a ratesheet PDF here, or click to choose</div>
    <div class="small">Reads the text from the PDF and matches Carded &amp; Matrix rates to each product</div>
    <input type="file" id="pdfInput" accept="application/pdf" style="display:none">
  </div>
  <div id="pdfStatus"></div>
  <div class="extract-box hidden" id="extractBox">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <strong style="font-size:13px">Extracted text</strong>
      <button class="btn ghost sm" id="reparseBtn">Re-detect rates from text</button>
    </div>
    <textarea id="extractText" spellcheck="false"></textarea>
    <div id="detected"></div>
  </div>
</div>

<\!-- ============ MIDDLE: Deal (left) + Ratesheet (right) ============ -->
<div class="main-grid">
  <section id="tab-deal" class="grid-left">
  <div class="section-label">Deal</div>
  <div class="deal-wrap">
    <div class="deal-col-right cash-card-wrap">
      <div class="cash-card">
        <div class="ck">Cash contribution</div>
        <div class="cv" id="cashDiscountCell">$3,420</div>
        <div class="cbreak" id="cashBreakdown"></div>
        <div class="cmanual">
          <label><input type="checkbox" id="cashManual"> Override manually</label>
          <input id="cashManualVal" inputmode="decimal" value="" placeholder="amount" disabled>
        </div>
      </div>
    </div>
    <div class="deal-col">

      <div class="dcard">
        <div class="dcard-h">Loan</div>
        <div class="dfield">
          <label>Bank</label>
          <input id="bankName" value="KIWIBANK">
        </div>
        <div class="dgrid2">
          <div class="dfield">
            <label>Loan amount</label>
            <div class="imoney"><span>$</span><input id="loanAmount" inputmode="decimal" value="380000"></div>
          </div>
          <div class="dfield">
            <label>Loan term (years)</label>
            <input id="termYears" inputmode="decimal" value="24">
          </div>
        </div>
      </div>

      <div class="dcard">
        <div class="dcard-h">Property &amp; LVR</div>
        <div class="dfield">
          <label>Property value</label>
          <div class="imoney"><span>$</span><input id="propertyValue" inputmode="decimal" value="660000"></div>
        </div>
        <div class="lvr-box">
          <div>
            <div class="lvr-k">Loan-to-value ratio</div>
            <div class="lvr-v" id="lvrCell">58%</div>
          </div>
          <div class="lvr-t" id="tierExplain"></div>
        </div>
      </div>

      <div class="dcard">
        <div class="dcard-h">Loan characteristics</div>
        <div class="toggle-row">
          <span class="toggle-name">First Home Buyer</span>
          <span class="tg"><span class="st" id="firstHomeBuyer_s">No</span>
            <label class="switch"><input type="checkbox" id="firstHomeBuyer"><span class="slider"></span></label></span>
        </div>
        <div class="toggle-row">
          <span class="toggle-name">K&#257;inga Ora</span>
          <span class="tg"><span class="st" id="kaingaOra_s">No</span>
            <label class="switch"><input type="checkbox" id="kaingaOra"><span class="slider"></span></label></span>
        </div>
        <div class="toggle-row">
          <span class="toggle-name">Refinancing</span>
          <span class="tg"><span class="st on" id="refinancing_s">Yes</span>
            <label class="switch"><input type="checkbox" id="refinancing" checked><span class="slider"></span></label></span>
        </div>
        <div class="toggle-row">
          <span class="toggle-name">Top-up</span>
          <span class="tg"><span class="st" id="topUp_s">No</span>
            <label class="switch"><input type="checkbox" id="topUp"><span class="slider"></span></label></span>
        </div>
      </div>

    </div>
  </div>
</section>

<\!-- ============ RIGHT: Generated ratesheet ============ -->
<section id="tab-report" class="grid-right">
  <div class="section-label">Generated ratesheet</div>
  <div class="panel">
    <div class="no-print" style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:14px">
      <div>
        <h2 style="margin:0">Ratesheet <span class="pane-tag">client output</span></h2>
        <p class="hint" style="margin:2px 0 0">Repayments calculated on "your rate".</p>
      </div>
      <div class="row-actions" style="margin:0">
        <label style="font-size:12px;display:flex;align-items:center;gap:6px">Repayments
          <select id="repayType" style="padding:6px;border-radius:6px;border:1px solid var(--line)">
            <option value="pi">Principal &amp; Interest</option>
            <option value="io">Interest Only</option>
          </select>
        </label>
        <label style="font-size:12px;display:flex;align-items:center;gap:6px">Highlight
          <select id="recoTerm" style="padding:6px;border-radius:6px;border:1px solid var(--line)"></select>
        </label>
        <button class="btn ghost sm" id="copyTableBtn">Copy for Word</button>
        <button class="btn sm" id="printBtn">Print / PDF</button>
      </div>
    </div>
    <div id="reportArea"></div>
  </div>
</section>
</div>

<\!-- ============ BOTTOM: Master rates & criteria ============ -->
<section id="tab-rates">
  <div class="section-label">Master rates &amp; criteria</div>

  <div class="panel">
    <h2>Ratesheet ID</h2>
    <p class="hint">Captured from the PDF (editable). Prints on the generated ratesheet.</p>
    <div class="field-inline">
      <label>Matrix ID</label>
      <input id="cr_matrixId" style="width:180px" placeholder="e.g. ADVJUL20">
      <label style="margin-left:12px">Effective</label>
      <input id="cr_effective" style="width:320px" placeholder="e.g. Monday 20 July 2026 to Sunday 26 July 2026">
    </div>
  </div>

  <div class="panel collapsible collapsed">
    <h2 class="panel-toggle">Cash contribution criteria &mdash; standard loans <span class="chev">&#9662;</span></h2>
    <div class="panel-body">
    <p class="hint">For purchases and top-ups. Fully editable for future versions.</p>

    <div style="font-size:12px;font-weight:700;color:var(--brand-dark);margin:4px 0 6px">LVR tiers</div>
    <div class="crule">If <strong>LVR is up to</strong> <input id="cr_b1lvr" inputmode="decimal">%, cash =
      <input id="cr_b1pct" inputmode="decimal">% of the loan.
      <span class="opt">max $<input id="cr_b1max" inputmode="decimal" class="wide" placeholder="none"> (optional)</span></div>
    <div class="crule">If <strong>LVR is over the above and up to</strong> <input id="cr_b2lvr" inputmode="decimal">%, cash =
      <input id="cr_b2pct" inputmode="decimal">% of the loan.
      <span class="opt">max $<input id="cr_b2max" inputmode="decimal" class="wide" placeholder="none"> (optional)</span></div>

<script>
/* ---------------------------------------------------------------------------
   State
--------------------------------------------------------------------------- */
const DEFAULT_PRODUCTS = ["Variable","Offset Home Loan","Revolving Credit","6 months fixed","1 year fixed","2 year fixed","3 year fixed","4 year fixed","5 year fixed"];

// Example rates from the KiwiBank screenshots (image 3). carded = advertised, matrix = negotiated.
const EXAMPLE_RATES = {

    "5 year fixed":{carded:6.39,matrix:6.09}
